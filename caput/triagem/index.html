<style>
:root{--bg:#fcfbf8;--p:#fbfaf5;--w:#fff;--tx:#203b39;--m:#5c6b67;--m2:#4f5a57;--b:#d8d3c6;--b2:#c8c3b6;--l:#e3ded2;--l2:#f0ece2;--v:#173f3d;--v2:#235a55;--g:#805b18;--g2:#a57829;--ok:#1f5a4a;--ok2:#3b7150;--az:#24506f;--az2:#4b7fa8;--r:#8a2f22;--r2:#e2b3aa;--cz:#8a948f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Figtree,system-ui,sans-serif}
a{color:var(--v2)}
button{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.k{font:500 10px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.btn{height:34px;padding:0 13px;border:1px solid var(--b2);background:var(--w);color:var(--tx);font:700 13px Figtree,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border-radius:6px;white-space:nowrap}
.btn:hover{border-color:var(--v2)}
.btn.pri{background:var(--v);border-color:var(--v);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:28px;font-size:12px;padding:0 10px}
.lk{border:0;background:transparent;color:var(--v2);font:600 12.5px Figtree,sans-serif;cursor:pointer;padding:0;white-space:nowrap}
.lk:hover{text-decoration:underline;text-underline-offset:3px}
.x{border:0;background:transparent;color:var(--m);font-size:15px;cursor:pointer;padding:0 0 0 4px;line-height:1}
.tg{display:inline-block;font:500 10px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--b);color:var(--m);border-radius:4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tg.d-pauta{border-color:#9cc0b4;color:var(--ok);background:#eaf3ef}
.tg.d-mono{border-color:#a9bfd0;color:var(--az);background:#eaf1f6}

      var line=d3.line().x(function(d){return x(d[0]);}).y(function(d){return y(d[1]);}).curve(d3.curveMonotoneX);
      PR.sel.forEach(function(n){var d=P.map(function(p){return [p,(T[n]||{})[p]||0];});
        svg.append('path').attr('class','ln').attr('d',line(d)).attr('stroke',cor[n]);
        svg.append('g').selectAll('circle').data(d).join('circle').attr('cx',function(v){return x(v[0]);}).attr('cy',function(v){return y(v[1]);}).attr('r',3).attr('fill',cor[n]);
        var u=d[d.length-1];svg.append('text').attr('class','lb').attr('x',x(u[0])+6).attr('y',y(u[1])).attr('dy','0.35em').attr('fill',cor[n]).text(n);});
      var guia=svg.append('line').attr('class','guia').attr('y1',m.t).attr('y2',H-m.b).style('display','none');

      svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',H-m.t-m.b).attr('fill','transparent')
        .on('mousemove',function(e){var mx=d3.pointer(e)[0],p=P.reduce(function(a,b){return Math.abs(x(b)-mx)<Math.abs(x(a)-mx)?b:a;});guia.attr('x1',x(p)).attr('x2',x(p)).style('display',null);
          var linhas=PR.sel.map(function(n){return [n,(T[n]||{})[p]||0];}).sort(function(a,b){return b[1]-a[1];});

  /* a matriz fica dentro de Produção (abaixo da evolução); no Caput, Perfis é a seção própria da Coordenação */

    else{ED[m.nome]=Object.assign({},ED[m.nome]||{},{exp:m.exp,pref:m.pref,nao:m.nao,matriz:m.matriz});try{localStorage.setItem(LS,JSON.stringify(ED));}catch(e){}toast(m.nome+(vai?' dissociado nesta cópia.':' de volta à matriz.'));}
    redesenha();}

  document.addEventListener('click',function(e){

    var t=e.target.closest('[data-oc],[data-dis],[data-aplicar],[data-pr-grupo],[data-pr-med],[data-pr-s],[data-pr-linha],[data-papel],[data-s],[data-vista],[data-tira],[data-mv],[data-acao],[data-dim],[data-fm],[data-arvk],[data-arv]');if(!t)return;

<script>
(function () {
'use strict';
const D = document, W = window;
const $ = (s, r) => (r || D).querySelector(s), $$ = (s, r) => [...(r || D).querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nz = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const dg = (v) => String(v || '').replace(/\D/g, '');
const fmtCnj = (v) => { const d = dg(v); return d.length === 20 ? d.replace(/^(\d{7})(\d{2})(\d{4})(\d)(\d{2})(\d{4})$/, '$1-$2.$3.$4.$5.$6') : String(v || ''); };

const iso = (v) => { const s = String(v || '').trim(); let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (m) return m[1] + '-' + m[2] + '-' + m[3]; m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s); if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); return ''; };
const br = (i) => i ? i.slice(8, 10) + '/' + i.slice(5, 7) + '/' + i.slice(0, 4) : '';
const HOJE = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
const ANO = +HOJE.slice(0, 4);
const dias = (i) => i ? Math.floor((Date.parse(HOJE) - Date.parse(i)) / 864e5) : null;
const somaDias = (i, n) => { const d = new Date(Date.parse(i) + n * 864e5); return d.toISOString().slice(0, 10); };
const hhmm = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function toast(t, bad) { const b = $('#toast'); b.textContent = t; b.classList.toggle('bad', !!bad); b.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { b.hidden = true; }, bad ? 9000 : 5000); }

/* ===================== motor de dados (acervo, gravação no procs-muta, ficha e importadores) ===================== */
const frame = D.createElement('iframe'); frame.id = 'cmt-motor'; frame.title = 'Motor de dados do acervo'; frame.src = '/init/motor/index.html'; D.body.appendChild(frame);
const M = () => { try { return frame.contentWindow; } catch (e) { return null; } };

async function carregarTriados() {
  /* chamada durante a montagem do HTML da sub-aba: espera o quadro existir antes de escrever nele */
  if (carregarTriados.rodando) return; carregarTriados.rodando = true;
  await new Promise((r) => setTimeout(r, 0));
  const P = PM();
  if (!P || !P.ler) { carregarTriados.rodando = false; setTimeout(carregarTriados, 1500); return; }
  try {
    const ESC_IDX = 'acervo/lotes/colecoes.json';
    const idx = JSON.parse(await P.ler(ESC_IDX));
    const triLotes = (idx.colecoes && idx.colecoes.triagem) || [];
    const items = new Map();
    const series = new Map();
    const lotesCarregados = [];
    for (const entry of triLotes) {
      const lid = typeof entry === 'string' ? entry : (entry.id || String(entry));
      try {
        const lote = JSON.parse(await P.ler('acervo/lotes/'+lid+'.json'));
        lotesCarregados.push(lote);
        const procs = lote.itens || lote.processos || [];
        if (lid.startsWith('adp-serie-')) {
          procs.forEach(p => { const d = p.d||p.num||p.processo; if(d) series.set(d, {id:lid, titulo:lote.titulo||lid}); });
        } else {
          procs.forEach(p => { const d = p.d||p.num||p.processo; if(d) items.set(d, {...p, _loteId:lid, _loteTitulo:lote.titulo||lid}); });
        }
      } catch(e) { /* lote não encontrado, ignora */ }
    }
    _triCache = {items, lotes:lotesCarregados, series};

}

function subPainelEm(p, aba) {

    ['Lote', p._loteTitulo],['Movimentos', p.movimentos],['Decisão', p.decisao],
    ['Acórdão', p.acordao],['Publicação', p.publicacao],

  let h = '<div class="tri-sub-painel"><div class="tri-sp-wrap">';

    const painel = est.convAb ? `<section class="cwe-convs"><div class="h"><span><span class="cwe-k">TODAS AS ${conv} CONVERSÕES · PAUTA DE ${e(A.br(ss.data).slice(0, 5))}</span><small>Agrupadas pelo resultado. Abra um grupo para ver cada etiqueta, o processo e a regra.</small></span><button type="button" data-cwe="conv-todos">${G.every(([k]) => est.convG.has(k)) ? 'Recolher todos' : 'Abrir todos'}</button></div>
      ${G.map(([k, g]) => { const ab = est.convG.has(k); return `<div class="g"><button type="button" data-cwe="conv-g" data-v="${e(k)}" aria-expanded="${ab}"><span>${ab ? '▾' : '▸'}</span><b>${g.rows.length}</b><span><b>${e(g.rot)}</b>${g.v ? ' ' + e(g.v) : ''}</span><small>${e([...g.regras].slice(0, 3).join(' · '))}</small></button>
        ${ab ? `<table><thead><tr><th>Item</th><th>Processo</th><th>Etiqueta no PJe</th><th>Regra</th></tr></thead><tbody>${g.rows.map((r) => `<tr><td>${e(r.item || '')}</td><td class="cwe-mono">${e(A.cnj(r.cnj))}</td><td>${e(r.e)}</td><td class="m">${e(r.id)}</td></tr>`).join('')}</tbody></table>` : ''}</div>`; }).join('')}</section>` : '';
    const card = (p) => { const dg = A.digits(p.cnj), pr = p.proposta;
      const chips = p.tags.map((t) => t.ign ? `<span class="cwe-chp ign"><span>${e(t.e)}</span><i>→</i><b>ignorada</b></span>` : t.regras.length ? `<span class="cwe-chp cv"><span>${e(t.e)}</span><i>→</i><b>${e(t.regras.map((r) => r.rot + (r.v ? ' ' + r.v : '')).join(' · '))}</b><small>${e(t.regras.map((r) => r.nome || r.id).join(' · '))}</small></span>` : `<span class="cwe-chp"><span>${e(t.e)}</span></span>`).join('') || '<span class="cwe-chp vazio">sem etiquetas no PJe</span>';
      const chT = (p.c.porTarefa ? `<span class="cwe-chp cv tf"><span>tarefa no PJe</span><i>→</i><b>${e(p.c.porTarefa)}</b><small>fixa</small></span>` : '') + (p.porRegra || []).map((g) => `<span class="cwe-chp cv tf"><span>${g.sessao ? 'regra da pauta' : 'regra padrão'}</span><i>→</i><b>${e(g.rot + (g.v ? ' ' + g.v : ''))}</b><small>${e(g.nome || g.id)}</small></span>`).join('');
      const ap = pr ? pr.ap : (p.tipoManual || p.tipo || '—');
      const campos = [['APRECIAÇÃO', AP_T[ap] || ap, (p.porRegra || []).some((g) => ['ED', 'AgInt', 'JR', '1julg'].includes(g.ef)) ? 'pela regra' : p.c.porTarefa || tipoTarefa(p.tarefa) ? 'pela tarefa no PJe' : pr?.dif.includes('ap') ? 'pela etiqueta · a aplicar' : p.tipoManual ? 'fixado' : 'padrão'], ['TAREFA NO PJe', p.tarefa || '—', ''], ['META', (pr?.meta || p.meta || (p.c.metas || []).join(' ') || '—'), pr?.dif.includes('meta') ? 'a aplicar' : ''], ['MPF', pr?.mpf || p.mpf || (p.c.mpf || []).join(' · ') || '—', pr?.dif.includes('mpf') ? 'a aplicar' : ''], ['SUBASSUNTO', (p.c.tema || []).join(' · ') || '—', ''], ['ESPECIFICIDADE', (p.c.esp || []).join(' · ') || '—', '']];
      const nc = p.tags.filter((t) => t.regras.length && !t.ign).length;
      return `<article class="cwe-pc ${pr?.dif.length ? 'dif' : ''}"><div class="t">${ck('etq', dg)}<span class="it">item ${e(p.item || '—')}</span><button type="button" class="cwe-mono cwe-lnk" data-cwt="ficha" data-p="${e(dg)}">${e(A.cnj(p.cnj))}</button><span class="as">${e(p.assunto || '—')} · ${e(p.recurso || p.classe || '')}</span><span class="ct">${p.tags.length} etiqueta(s) · ${nc} convertida(s)</span></div>
        <div class="chs">${chips}${chT}</div>
        ${pr?.man.length ? `<p class="cf"><b>CONFERIR</b><span>O valor fixado à mão difere do que a regra daria (${e(pr.man.map((x) => ({ ap: 'apreciação', meta: 'meta', mpf: 'MPF' }[x])).join(', '))}). A aplicação não mexe no que foi fixado.</span></p>` : ''}
        <div class="cps">${campos.map(([k, v, o]) => `<div><span>${e(k)}</span><b>${e(v)}</b>${o ? `<small>${e(o)}</small>` : ''}</div>`).join('')}</div></article>`; };
    const semL = [...semM.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    return `<section class="cwe-st"><header class="cwe-et"><p class="k">03 / tipo de julgamento, meta e MPF</p><h2>Etiquetagem</h2></header>${tabs}
      <p>Cada processo mostra todas as etiquetas do PJe. O tipo de julgamento sai primeiro da tarefa em que o processo está no PJe; a etiqueta confirma ou, sem indicação na tarefa, sugere. A etiqueta convertida aponta o resultado e a regra que a converteu.</p>
      <div class="cwe-fil" role="group" aria-label="Filtrar os processos"><span class="cwe-k">METAS E TIPO DE JULGAMENTO</span>${F.map(([k, t, n]) => `<button type="button" data-cwe="etq-f" data-v="${k}" aria-pressed="${fl === k}">${e(t)}<span>${n}</span></button>`).join('')}</div>
      <div class="cwe-kpis cwe-k4">${kpi(tot, 'Etiquetas na pauta', 'em ' + C.length + ' processos')}<button type="button" data-cwe="conv-ab" aria-expanded="${est.convAb}"><b>${conv}</b>Convertidas ${est.convAb ? '▴' : '▾'}<small>${est.convAb ? 'recolher a lista' : 'ver todas as conversões'}</small></button>${kpi(ign, 'Ignoradas por regra', 'APTO, SESSÃO, origem…')}<button type="button" data-cwe="etq-f" data-v="${fl === 'sem' ? 'todos' : 'sem'}" aria-pressed="${fl === 'sem'}"><b>${sem}</b>Sem regra<small>${fl === 'sem' ? 'mostrar todos' : 'filtrar os processos'}</small></button></div>
      ${painel}
      <div class="cwe-2col"><div class="cwe-lst"><div class="cwe-lst-h"><span><b>${aplic} de ${C.filter((p) => p.proposta?.dif.length).length} com conversão a aplicar</b> · desmarque o processo que não deve receber as conversões</span><button type="button" class="pri" data-cwe="etq-aplicar" ${aplic ? '' : 'disabled'}>Aplicar as conversões</button>${fl === 'conf' ? `<button type="button" data-cwe="etq-forcar" title="Troca o valor fixado à mão pelo que as regras dão, nos processos marcados deste filtro">Substituir o fixado pelas regras (${C.filter((p) => p.proposta?.man.length && marcado('etq', A.digits(p.cnj))).length})</button>` : ''}<button type="button" class="cwe-lnk2" data-cwe="etapa" data-n="4">Próximo: designação e correção →</button></div>
        ${vis.map(card).join('') || '<p class="cwe-vazio">Nenhum processo neste filtro.</p>'}
        <div class="cwe-mostra"><span>mostrando ${vis.length} de ${L.length}</span>${L.length > vis.length ? `<button type="button" data-cwe="etq-mais">Mostrar mais 50</button><button type="button" data-cwe="etq-todos">Mostrar todos</button>` : ''}</div></div>
      <div class="cwe-lado">${boxRegrasPauta(ss, d)}
        <section class="cwe-box"><div class="h"><span><b>Pela tarefa no PJe</b></span><small>fixas · valem antes das etiquetas · o tipo de julgamento sai daqui</small></div>
          <div class="rb"><code>[Sessão - ED] …  ·  [ED] …</code><b>→ ED</b></div><div class="rb"><code>[Ag. Int] …</code><b>→ AgInt</b></div><div class="rb"><code>tarefa com "retratação"</code><b>→ JR</b></div><div class="rb"><code>… Processos retirados e adiados</code><b>→ Retirado ou adiado</b></div>
          <p>A etiqueta de ED só informa. Remessa necessária vem da classe. Para outra regra por tarefa, use "Nova regra" acima com a condição "Tarefa atual no PJe".</p></section>
        ${boxRegrasPadrao(ss, d)}
        <aside class="cwe-box"><div class="h"><span><b>Sem regra, mais frequentes</b></span><small>na pauta de ${e(A.br(ss.data).slice(0, 5))} · escolha a regra de cada etiqueta (vale só nesta pauta)</small></div>
          ${semL.map(([t, n]) => { const aqui = est.rb?.de === t; return `<div class="sr${aqui ? ' ab' : ''}"><b>${n}</b><span>${e(t)}</span><select data-cwe-rbsel="${e(t)}" aria-label="Criar regra para a etiqueta ${e(t)}"><option value="">Criar regra…</option>${efeitosRb(d).map((x) => `<option value="${e(x.k)}"${aqui && est.rb.ef === x.k ? ' selected' : ''}>${e(x.t)}</option>`).join('')}</select></div>${aqui ? `<div class="sr-f">${boxRegrasPauta(ss, d, 'form')}</div>` : ''}`; }).join('') || '<p>Todas as etiquetas têm regra.</p>'}</aside></div></div></section>`;
  }

  /* ===== regras de etiquetas por pauta: criadas aqui valem só nesta sessão (gravadas no arquivo dela); "Tornar padrão" leva às regras gerais ===== */
  function efeitosRb(d) { try { return d.s?.efeitosEtiqueta?.() || []; } catch (er) { return []; } }
  /* onde: 'top' = caixa "Regras desta pauta"; 'form' = só o formulário, aberto junto da etiqueta escolhida em "Sem regra" */
  function boxRegrasPauta(ss, d, onde = 'top') { let R = null; try { R = d.s?.regrasPauta?.(ss.id) || null; } catch (er) { R = null; } if (!R) return '';
    const rb = est.rb, opt = (L, v) => L.map((x) => `<option value="${e(x.k)}"${x.k === v ? ' selected' : ''}>${e(x.t)}</option>`).join('');
    let form = '';
    if (rb && (onde === 'form') === !!rb.de) { const ef = R.efeitos.find((x) => x.k === rb.ef) || R.efeitos[0]; let prev = []; try { prev = d.s?.previaRegraPauta?.(ss.id, rb) || []; } catch (er) { prev = []; }
      const temCond = rb.conds.some((c) => c.op === 'vazio' || String(c.val || '').trim());
      const tarefas = [...new Set((convDados(ss, d) || []).map((p) => p.tarefa).filter(Boolean))].sort();
      form = `<div class="cwe-rb"><div class="rbl"><span class="cwe-k">QUANDO</span><span class="rbg"><button type="button" data-cwe="rb-liga" data-v="E" aria-pressed="${rb.liga !== 'OU'}">E</button><button type="button" data-cwe="rb-liga" data-v="OU" aria-pressed="${rb.liga === 'OU'}">OU</button></span></div>
        ${rb.conds.map((c, i) => `<div class="rbc"><select data-rb="campo" aria-label="Campo">${opt(R.campos, c.campo)}</select><select data-rb="op" aria-label="Operador">${opt(R.ops, c.op)}</select><button type="button" data-cwe="rb-tira" data-i="${i}" aria-label="Tirar a condição" title="Tirar a condição">×</button><input data-rb="val" value="${e(c.val || '')}" placeholder="${c.campo === 'tarefa' ? 'ex.: [Sessão - ED] ou retratação' : c.campo === 'item' ? 'ex.: 12 ou 40-60' : 'texto'}"${c.campo === 'tarefa' ? ' list="rb-tarefas"' : ''}></div>`).join('')}
        <datalist id="rb-tarefas">${tarefas.map((t) => `<option value="${e(t)}"></option>`).join('')}</datalist>
        <button type="button" class="cwe-lnk" data-cwe="rb-mais">+ condição</button>
        <div class="rbl"><span class="cwe-k">ENTÃO</span></div><select data-rb="ef" aria-label="Efeito">${opt(R.efeitos, rb.ef)}</select>${ef && ef.v ? `<input data-rb="v" value="${e(rb.v || '')}" placeholder="${e(ef.v)}">` : ''}
        <p class="rbp"><b>${temCond ? prev.length + ' processo(s) desta pauta' : 'Preencha uma condição'}</b>${prev.slice(0, 4).map((x) => `<span>item ${e(x.item || '—')} · ${e(A.cnj(x.cnj))}</span>`).join('')}${prev.length > 4 ? `<span>… e mais ${prev.length - 4}</span>` : ''}<button type="button" class="cwe-lnk" data-cwe="rb-previa">atualizar a prévia</button></p>
        <span class="cwe-acoes"><button type="button" class="pri" data-cwe="rb-salvar">Salvar nesta pauta</button><button type="button" data-cwe="rb-x">Cancelar</button></span><small>Vale só para a pauta de ${e(A.br(ss.data))} e fica gravada com ela. "Tornar padrão" leva a regra às configurações.</small></div>`; }
    if (onde === 'form') return form;
    return `<section class="cwe-box"><div class="h"><span><b>Regras desta pauta</b><button type="button" class="cwe-lnk" data-cwe="rb-abre">${rb ? 'Fechar' : '+ Nova regra'}</button></span><small>por tarefa atual, etiqueta, assunto, classe, meta ou item · valem só em ${e(A.br(ss.data).slice(0, 5))}</small></div>
      ${form}${R.sessao.map((r) => `<div class="rb rbs"><code>${e(r.quando)}</code><b>→ ${e(r.ef)}</b><small>${r.n} proc.</small><span><button type="button" class="cwe-lnk" data-cwe="rb-pad" data-id="${e(r.id)}" title="Levar às regras padrão (configurações): passa a valer em todas as sessões">Tornar padrão</button><button type="button" class="cwe-lnk x" data-cwe="rb-del" data-id="${e(r.id)}" title="Excluir a regra desta pauta">Excluir</button></span></div>`).join('') || (rb ? '' : '<p>Nenhuma regra própria desta pauta.</p>')}</section>`; }
  function boxRegrasPadrao(ss, d) { let R = null; try { R = d.s?.regrasPauta?.(ss.id) || null; } catch (er) { R = null; } if (!R || !R.padrao.length) return '';
    const L = est.rbTodas ? R.padrao : R.padrao.slice(0, 8), off = R.padrao.filter((r) => r.off).length;
    return `<section class="cwe-box"><div class="h"><span><b>Regras padrão</b><button type="button" class="cwe-lnk" data-cwe="cfg-2">Configurações</button></span><small>vêm das configurações e valem em todas as sessões · aqui só se desligam nesta pauta${off ? ' · ' + off + ' desligada(s)' : ''}</small></div>
      ${L.map((r) => `<div class="rb${r.off ? ' off' : ''}"><code>${e(r.nome ? r.nome + ' · ' : '')}${e(r.quando)}</code><b>→ ${e(r.ef)}</b><button type="button" class="cwe-lnk" data-cwe="rb-off" data-id="${e(r.id)}" data-on="${r.off ? 1 : 0}" title="${r.off ? 'Voltar a aplicar nesta pauta' : 'Não aplicar só nesta pauta; nas demais continua'}">${r.off ? 'religar' : 'desligar aqui'}</button></div>`).join('')}
      ${R.padrao.length > 8 ? `<p><button type="button" class="cwe-lnk" data-cwe="rb-todas">${est.rbTodas ? 'mostrar menos' : 'ver as ' + R.padrao.length}</button></p>` : ''}</section>`; }
  function rbSync(view) { const f = view.querySelector('.cwe-rb'); if (!f || !est.rb) return;
    est.rb.conds = [...f.querySelectorAll('.rbc')].map((r) => ({ campo: r.querySelector('[data-rb="campo"]').value, op: r.querySelector('[data-rb="op"]').value, val: r.querySelector('[data-rb="val"]').value }));
    const ef = f.querySelector('[data-rb="ef"]'), v = f.querySelector('[data-rb="v"]'); if (ef) est.rb.ef = ef.value; est.rb.v = v ? v.value : ''; }

  /* criar regra sem sair da esteira */
  function formEtq(d, t) { let E = []; try { E = d.s?.efeitosEtiqueta?.() || []; } catch (er) { E = []; }
    return `<div class="cwe-nr" data-nr="etq"><span class="cwe-k">NOVA REGRA · ETIQUETA "${e(t)}"</span><label>Converte em<select data-nr-ef>${E.map((x) => `<option value="${e(x.k)}" data-v="${e(x.v)}">${e(x.t)}</option>`).join('')}</select></label>
      <label>Valor <small>(tema, especificidade, hipótese ou nº da meta)</small><input data-nr-v placeholder="só para os efeitos que pedem valor"></label>

  function formAss(Z, t) { const op = (P) => `<option value="">— manter —</option>${P.map((m) => `<option>${e(m.nome)}</option>`).join('')}`;
    return `<div class="cwe-nr" data-nr="ass"><span class="cwe-k">NOVA REGRA · ASSUNTO "${e(t)}"</span><label>Minutante<select data-nr-d>${op(Z.minutantes)}</select></label><label>Corretor<select data-nr-c>${op(Z.corretores)}</select></label>
      <span class="cwe-acoes"><button type="button" class="pri" data-cwe="nr-salvar">Salvar a regra</button><button type="button" data-cwe="nr-x">Cancelar</button></span><small>Entra no critério "Tema ou assunto"${Z.escopo === 'sessao' ? ', no ajuste desta sessão' : ', nas regras gerais'}.</small></div>`; }

  /* 3 · B · designação e correção */
  /* regras de designação na ordem, uma coluna para a minuta e outra para a correção:
     quantos processos cada regra decide › categorias da regra › processos (com quem está designado) */
  function desigSig(ss) { const s = A.getSes(); let st = {}; try { st = s?.estado?.() || {}; } catch (er) { st = {}; }
    return ss.id + '|' + (ss.itens || []).map((i) => (i.servidor || '') + '/' + (i.corretor || '')).join(',') + '|' + JSON.stringify(ss.fases || {}) + '|' + JSON.stringify(st.desig || {}).length + '|' + JSON.stringify((st.equipe || []).map((m) => [m.nome, m.minuta, m.correcao, m.auto, m.minutaEventual, m.aus])) + '|' + JSON.stringify(ss.desigOverride || null).length + '|' + JSON.stringify(ss.foraSessao || null); }
  function desigMemo(ss, k) { const sig = desigSig(ss); est.dMemo = est.dMemo || {}; const c = est.dMemo[k]; if (c && c.sig === sig) return c.v;
    let v = null; try { v = k === 'Z' ? A.getSes()?.designacao?.(ss.id) || null : A.getSes()?.designacaoPorRegra?.(ss.id) || null; } catch (er) { v = null; } est.dMemo[k] = { sig, v }; return v; }
  function painelRegras(ss, Z) { const R = desigMemo(ss, 'R');
    if (!R) return '';
    /* categorias do critério de julgamento sem responsável (ex.: META na minuta): aparecem com quantos processos da pauta seguem para a próxima regra */
    let Dg = {}; try { const st = A.getSes()?.estado?.() || {}; Dg = ss.desigOverride || st.desig || {}; } catch (er) { Dg = {}; }
    const TJ = { ed: 'ED', agint: 'AgInt', jr: 'JR', meta: 'META' }, nTipo = (t) => (Z.linhas || []).filter((p) => p.tipo === t).length;
    const semResp = (kind, r) => r.cid !== 'julg' ? [] : Object.keys(Dg.rows || {}).filter((k) => /^julg:/.test(k)).map((k) => ({ k, row: Dg.rows[k], tipo: TJ[k.slice(5)] || (Dg.rows[k].cap || k.slice(5)) })).filter((x) => !x.row[kind] && !r.cats.some((c) => A.norm(c.chave) === A.norm(x.tipo)));
    est.rgAb = est.rgAb || {}; est.rgCat = est.rgCat || {};
    const col = (kind, tit) => { const L = R[kind] || [], tot = L.reduce((a, r) => a + r.n, 0) || 1;
      return `<div class="cwe-rg-col"><p class="cwe-rg-t">${tit}</p>
        ${L.map((r, i) => { const k = kind + ':' + r.cid, ab = !!est.rgAb[k], ord = r.cid === 'ader' || r.cid === 'nenhuma' ? '·' : i + 1;
          const SR = semResp(kind, r), srH = SR.map((x) => { const n = nTipo(x.tipo); return `<div class="rg-c vz"><button type="button" disabled title="Sem responsável para ${kind === 'd' ? 'minuta' : 'correção'} nesta categoria: os processos seguem para a próxima regra."><span class="t">${e(x.tipo)}</span><span class="p">sem responsável · ${n ? n + ' seguem para a próxima regra' : 'nenhum nesta pauta'}</span><b class="n">${n}</b></button></div>`; }).join('');
          return `<div class="rg-r ${r.n ? '' : 'zero'} ${ab ? 'ab' : ''}"><button type="button" data-cwe="rg" data-k="${e(k)}" aria-expanded="${ab}" ${r.n ? '' : 'disabled'}><b class="o">${ord}</b><span class="t">${e(r.t)}</span><span class="bar"><i style="width:${Math.round(100 * r.n / tot)}%"></i></span><b class="n">${r.n}</b><small>${r.n ? (r.seguem === r.n ? 'todos seguem' : r.seguem + ' seguem') : 'nenhum'}</small></button>
            ${ab || SR.length ? `<div class="rg-cats">${srH}${(ab ? r.cats : []).map((c) => { const kc = k + ':' + c.chave, abc = !!est.rgCat[kc], ps = Object.keys(c.pessoas).sort((a, b) => c.pessoas[b] - c.pessoas[a]).map((p) => p + (Object.keys(c.pessoas).length > 1 ? ' ' + c.pessoas[p] : '')).join(' · ') || '—';
              return `<div class="rg-c ${abc ? 'ab' : ''}"><button type="button" data-cwe="rgc" data-k="${e(kc)}" aria-expanded="${abc}"><span class="t">${e(c.chave)}</span><span class="p">→ ${e(ps)}</span><b class="n">${c.n}</b></button>
                ${abc ? `<div class="rg-its">${c.itens.map((x) => { const dif = x.atual && x.regra && A.norm(x.atual) !== A.norm(x.regra); return `<span class="${dif ? 'dif' : ''}"><em>item ${e(x.item || '—')}</em><button type="button" class="cwe-mono cwe-lnk" data-cwt="ficha" data-p="${e(A.digits(x.cnj))}">${e(A.cnj(x.cnj))}</button><small>${x.atual ? e(x.atual) + (dif ? ' · regra: ' + e(x.regra) : '') : 'sem designação · regra: ' + e(x.regra || '—')}</small></span>`; }).join('')}</div>` : ''}</div>`; }).join('')}</div>` : ''}</div>`; }).join('')}</div>`; };

   ${sec('Ajustes',val(it.ajustes))}
   ${sec('Outros registros',dl(resto))}
   ${it.minuta&&!mn?sec('Minuta','<p class="vazio">Lendo a minuta…</p>'):''}${mn?sec('Minuta · '+esc(mn.vigente||'')+(mn.rotulo?' · '+esc(mn.rotulo):''),`${dl({origem:mn.origem,registrado_por:mn.registrado_por,atualizado_em:mn.atualizado_em,pendencias:mn.pendencias,versoes:(mn.versoes||[]).map(v=>({versao:v.id,rotulo:v.rotulo,por:v.por,em:v.em}))})}<div class="mdoc">${[['relatorio','RELATÓRIO'],['voto','VOTO'],['ementa','EMENTA'],['acordao','ACÓRDÃO']].map(([k,r])=>((mn.secoes||{})[k]||[]).length?`<h4>${r}</h4>`+mn.secoes[k].map(p=>`<p>${esc(p)}</p>`).join(''):'').join('')}</div>`):''}
  </div>`;
}
function ligar(){
  $$('[data-aba]').forEach(b=>b.onclick=()=>{if(OPC.onAba)OPC.onAba(b.dataset.aba)});
  $$('[data-lote]').forEach(b=>b.onclick=()=>{S.lote=b.dataset.lote;S.grupo='';S.col='';render();scrollTo(0,0)});
  const q=$('#q');if(q)q.oninput=()=>{clearTimeout(q._t);q._t=setTimeout(()=>{S.q=q.value;const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)},300)};
  const fg=$('#fg');if(fg)fg.onchange=()=>{S.grupo=fg.value;render()};
  const fc=$('#fc');if(fc)fc.onchange=()=>{S.col=fc.value;render()};
  $('#ft').onchange=()=>{S.tri=$('#ft').value;render()};
  $('#exp').onclick=()=>{S.fechados.clear();render()};
  $('#rec').onclick=()=>{lotesVis().forEach(l=>{l.grupos.forEach(g=>S.fechados.add(l.id+'|'+g.id));S.fechados.add(l.id+'|__')});render()};
  $('#todos').onclick=()=>{const n=lotesVis().reduce((a,l)=>a+filtra(l).length,0);if(n>150&&!confirm('Abrir '+n+' processos de uma vez pode deixar a página lenta. Continuar?'))return;lotesVis().forEach(l=>filtra(l).forEach(it=>S.abertos.add(l.id+'|'+it.processo)));S.fechados.clear();render()};
  $('#nenhum').onclick=()=>{S.abertos.clear();render()};
  $$('tr.gh').forEach(t=>t.onclick=()=>{const k=t.dataset.grp;S.fechados.has(k)?S.fechados.delete(k):S.fechados.add(k);const y=scrollY;render();scrollTo(0,y)});
  $$('tr.r').forEach(t=>{const tg=()=>{const k=t.dataset.k;S.abertos.has(k)?S.abertos.delete(k):S.abertos.add(k);const y=scrollY;render();scrollTo(0,y)};t.onclick=tg;t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tg()}}});
}

  function montar(host, D, o) {
    o = o || {}; OPC = o; const chave = o.chave || 'triados';
    S = ESTADOS[chave] || (ESTADOS[chave] = { lote: '', q: '', grupo: '', col: '', tri: '', abertos: new Set(), fechados: new Set(), D: null });
    if (S.D !== D) { D.lotes.forEach((l) => (l.itens || []).forEach((it) => { if (it._h) return; it._l = l; it._h = sem(JSON.stringify([it.processo, it.partes, it.assunto, it.assunto_detalhado, it.tipo_caso, it.observacao, it.resultado, it.especificidades, it.peculiaridades, it.etiquetas, it.triagem, it.teor])); })); S.D = D; }
    if (o.lote != null && o.lote !== S.lote) { S.lote = o.lote; S.grupo = ''; S.col = ''; }
    root = host.shadowRoot || host.attachShadow({ mode: 'open' });
    root.innerHTML = '<style>' + CSS + '</style><div class="cv"><div id="app"></div></div>';
    refazer = render; render();
  }
  return { montar };
})();
</script>
