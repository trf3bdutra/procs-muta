<style>

</style></head><body><header class="top"><div class="row between"><b>HERO18810 · Prontuário Universal</b><span class="mut">DEMONSTRAÇÃO</span></div></header><main class="main" id="app" aria-live="polite"><p>Carregando os campos da ficha…</p></main><footer class="note">Dados fictícios · alterações apenas em memória · nenhum envio ao PJe ou ao GitHub.</footer>
<script>
'use strict';
const app=document.querySelector('#app');
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const add=(p,...xs)=>{p.append(...xs);return p};
const btn=(txt,fn,cls='',disabled=false)=>{const b=el('button',cls,txt);b.type='button';b.disabled=disabled;b.addEventListener('click',fn);return b};

const make=(mono)=>({data:{'triagem.Tipo de Julgamento':mono?'Agravo de instrumento':'Apelação','triagem.Tema':mono?'Conselhos profissionais':'Revisão remuneratória','triagem.Assunto detalhado':mono?'Inscrição em conselho profissional':'Reajuste remuneratório de servidores públicos','triagem.Especificidades':mono?'Registro profissional; Tutela provisória':'Servidor público; Compensação de reajustes'},active:{},stage:mono?3:0,manual:false,notes:[],signals:[],requests:[],assignees:mono?['Minutante B','Não designado']:['Minutante A','Revisor A']});
const shared=make(false);shared.data['producao.Destino']='Sessão';
let profile='sessao',states={sessao:shared,monocratica:{...shared,stage:0}},tab='acom',expanded=new Set(),editing='',schema=[],all=[],draft={},signalFilter='';
const S=()=>states[profile], value=c=>S().data[key(c)]??'', find=(sec,k)=>all.find(c=>c.secao===sec&&c.chave===k);
const txt=(v)=>v==null?'':Array.isArray(v)?v.map(x=>Object.values(x).join(' · ')).join('\n'):String(v);
function details(id,title,fill,cls='sub'){const d=el('details',cls);d.open=expanded.has(id);d.addEventListener('toggle',()=>{if(d.open)expanded.add(id);else expanded.delete(id)});d.append(el('summary','',title));fill(d);return d}
function start(id,cs){editing=id;draft={};cs.forEach(c=>draft[key(c)]=S().data[key(c)]??(c.tipo==='tabela'?[]:''));render()}
function save(){Object.assign(S().data,draft);editing='';draft={};render()}

function field(c,mode){const k=key(c),t=c.tipo||'texto',f=el('div','field'+(['texto-longo','tabela'].includes(t)?' full':'')),v=mode?draft[k]:value(c);f.append(el('label','',c.rotulo||c.chave));const ro=c.editavel===false||c.calculado||!c.secao||['LIBERADO','Assinado','Data da Assinatura'].includes(c.chave)||(c.chave==='Data da Liberação'&&profile==='sessao');if(!mode||ro){f.append(el('div','read'+(!txt(v)?' mut':''),txt(v)||'—'));return f}
const put=x=>draft[k]=x;let e;
if(t==='lista'){e=el('select');for(const x of ['',...(c.opcoes||[])]){const o=el('option','',x||'—');o.value=x;e.append(o)}if(v&&!Array.from(e.options).some(o=>o.value===v)){const o=el('option','',v);o.value=v;e.append(o)}e.value=v||'';e.onchange=()=>put(e.value)}
else if(t==='simnao'||c.rotulo==='Nível'){e=el('div','row wrap');for(const x of (c.opcoes||['Sim','Não']))e.append(btn(x,()=>{put(x);Array.from(e.children).forEach(b=>b.classList.toggle('on',b.textContent===x))},v===x?'on':''))}
else if(t==='tabela'){e=el('div','stack');let rows=Array.isArray(v)?v.map(x=>({...x})):[];const draw=()=>{e.replaceChildren();rows.forEach((r,i)=>{const g=el('div','sub');for(const col of c.colunas||[]){const inp=el('input');inp.placeholder=col.rotulo||col.chave;inp.value=r[col.chave]||'';inp.oninput=()=>{r[col.chave]=inp.value;put(rows)};g.append(inp)}g.append(btn('Excluir linha',()=>{rows.splice(i,1);put(rows);draw()}));e.append(g)});e.append(btn('+ Linha',()=>{rows.push({});put(rows);draw()}))};draw()}
else{e=el(t==='texto-longo'?'textarea':'input');if(t==='data')e.type='date';e.value=txt(v);e.oninput=()=>put(e.value)}
e.setAttribute('aria-label',c.rotulo||c.chave);f.append(e);return f}
function block(id,title,cs){return details(id,title,p=>{const edit=editing===id;const grid=el('div','grid');cs.forEach(c=>grid.append(field(c,edit)));p.append(grid);if(edit)p.append(actions());else if(cs.some(c=>c.secao&&c.editavel!==false&&!c.calculado))p.append(btn('Editar / +',()=>start(id,cs)))})}
function group(name){return schema.flatMap(a=>a.grupos).find(g=>g.grupo===name)}
function groups(names,parent){for(const n of names){const g=group(n);if(g&&(!g.destino||g.destino===profile)){const cs=g.campos.filter(c=>key(c)!=='producao.Destino');if(cs.length)parent.append(block('g:'+n,n,cs))}}}
function control(g){const conf=controls[g.grupo], id='ctl:'+g.grupo, active=!!S().active[g.grupo], d=el('details','sub ctl');d.style.setProperty('--accent',active?conf.color:'#cbd0d2');d.open=expanded.has(id);d.addEventListener('toggle',()=>{if(d.open)expanded.add(id);else expanded.delete(id)});const su=el('summary');su.append(row(el('span','',conf.icon+' '+g.grupo),el('span','mut',active?'Em vigor':'Inativo')));d.append(su);const choices=el('div','seg');for(const [label,on] of [['Sim',true],['Não',false]])choices.append(btn(label,()=>{S().active[g.grupo]=on;expanded.add(id);if(on)start(id,g.campos);else{editing='';render()}},active===on?'on':''));d.append(choices);if(active){const main=g.campos.filter(c=>conf.main.includes(c.rotulo)),rest=g.campos.filter(c=>!conf.main.includes(c.rotulo)),edit=editing===id;const grid=el('div','grid');main.forEach(c=>grid.append(field(c,edit)));d.append(grid);d.append(details(id+':more','Mais campos',p=>{const gr=el('div','grid');rest.forEach(c=>gr.append(field(c,edit)));p.append(gr)},'stack'));d.append(edit?actions():btn('Editar / +',()=>start(id,g.campos)))}return d}
function addEntry(kind){editing=kind;draft={text:'',type:kind==='signals'?'Pendência':'Sustentação presencial'};render()}
function entries(kind,title){const p=el('section','stack');p.append(row(el('h3','',title),btn(editing===kind?'−':'+',()=>editing===kind?(editing='',render()):addEntry(kind),'icon')));if(kind==='signals'){const cnt=el('div','cnts');for(const t of ['Intercorrência','Pendência','Aviso']){const b=btn('',()=>{signalFilter=signalFilter===t?'':t;render()},signalFilter===t?'on':'');b.append(el('b','',S().signals.filter(x=>x.type===t&&!x.ok).length),el('span','',t));cnt.append(b)}p.append(cnt)}if(editing===kind){const box=el('div','sub');if(kind!=='notes'){const se=el('select');for(const t of (kind==='signals'?['Pendência','Intercorrência','Aviso']:['Sustentação presencial','Videoconferência','Preferência','Retirada','Adiamento'])){const o=el('option','',t);o.value=t;se.append(o)}se.value=draft.type;se.onchange=()=>draft.type=se.value;box.append(se)}const ta=el('textarea');ta.placeholder=kind==='notes'?'Nova nota…':kind==='signals'?'Nova sinalização…':'Dados do pedido…';ta.value=draft.text;ta.oninput=()=>draft.text=ta.value;box.append(ta);if(kind==='requests')for(const t of ['Advogado(a)','OAB','Parte representada','Recebido em','Situação','Deliberação']){const inp=el('input');inp.placeholder=t;inp.setAttribute('aria-label',t);if(t==='Recebido em')inp.type='date';inp.value=draft[t]||'';inp.oninput=()=>draft[t]=inp.value;box.append(inp)}box.append(row(btn('Cancelar',()=>{editing='';render()}),btn('Incluir',()=>{if(!draft.text.trim())return;S()[kind].push({...draft,ok:false});editing='';render()},'primary')));p.append(box)}S()[kind].forEach((x,i)=>{if(kind==='signals'&&signalFilter&&x.type!==signalFilter)return;const e=el('div','entry');if(kind!=='notes')e.append(el('div','mut',x.type));e.append(el('div','read',x.text));if(kind==='requests')Object.keys(x).filter(k=>!['type','text','ok'].includes(k)&&x[k]).forEach(k=>e.append(el('div','mut',k+': '+x[k])));e.append(row(el('span','mut',x.ok?'Resolvida':'Registro demonstrativo'),btn(kind==='signals'?(x.ok?'Reabrir':'Resolver'):'Excluir',()=>{if(kind==='signals')x.ok=!x.ok;else S()[kind].splice(i,1);render()})));p.append(e)});return p}
function render(){const s=S(),mono=profile==='monocratica';app.replaceChildren();const h=el('section','panel');const stages=mono?['Minuta','Revisão','Enviada','Assinatura']:['Minuta','Correção','Liberação'];h.append(row(el('span','ey','Para '+stages[s.stage].toLowerCase()),el('span','mut',mono?'Tarefa monocrática':'Sessão · item demonstrativo')));
const base='ApCiv', tj=s.data['triagem.Tipo de Julgamento']||'', tags=[['Embargos de declaração','ED'],['Agravo interno','AgInt'],['Juízo de retratação','JR'],['Remessa necessária','RemNec']].filter(x=>tj.includes(x[0])).map(x=>x[1]);h.append(row(el('span','mono','0000001-00.2026.4.03.6000'),el('span','tag class',[base,...tags].join(' · '))));h.append(el('h1','','Índice de 28,86%'),el('div','mut',s.data['triagem.Assunto detalhado']||''));const tr=el('div','row wrap');String(s.data['triagem.Especificidades']||'').split(/[;\n]+/).filter(x=>x.trim()).forEach(x=>tr.append(el('span','tag',x.trim())));h.append(tr);
const sc=find('triagem','Síntese Processual');if(sc){const b=el('div','summary stack');b.append(row(el('h3','','Síntese'),btn(editing==='syn'?'−':value(sc)?'✎':'+',()=>editing==='syn'?(editing='',render()):start('syn',[sc]),'icon')));if(editing==='syn')b.append(field(sc,true),actions());else if(value(sc))b.append(el('div','read',value(sc)));h.append(b)}
const flow=el('div','flow');stages.forEach((t,i)=>{const st=el('div','stage');const lock=i===stages.length-1;st.append(btn(['✎','✓','➤','✒'][i],()=>{if(i===s.stage)s.stage++;else if(i===s.stage-1)s.stage--;render()},(i<s.stage?'done':i===s.stage?'current':''),lock||i>s.stage),el('b','mut',t),el('span','mut',i<s.stage?'Concluída':i===s.stage?'Atual':'—'));flow.append(st)});h.append(el('h3','rule','Etapas'),flow);const people=el('div','people');s.assignees.forEach((v,i)=>people.append(add(el('div'),el('span','mut',i?mono?'Revisão':'Correção':'Minuta'),el('b','',v))));const dest=el('label');const label=el('span','mut','Destino');const select=el('select');select.setAttribute('aria-label','Destino do julgamento');for(const [v,t] of [['sessao','Acórdão'],['monocratica','Monocrática / outras decisões']]){const o=el('option','',t);o.value=v;select.append(o)}select.value=profile;select.title=select.options[select.selectedIndex].text;select.onchange=()=>switchProfile(select.value);dest.append(label,select);people.append(dest);h.append(people);
h.append(details('ctx','Autuação e contexto '+Object.keys(s.active).filter(k=>s.active[k]).map(k=>controls[k].icon).join(' '),p=>{p.append(details('tj','Tipo de julgamento: '+(tj||'A definir')+' · '+(s.manual?'manual':'automático'),q=>{const w=el('div','row wrap');types.forEach(t=>w.append(btn(t,()=>{let arr=(s.data['triagem.Tipo de Julgamento']||'').split(' + ').filter(Boolean);arr=arr.includes(t)?arr.filter(x=>x!==t):[...arr,t];s.data['triagem.Tipo de Julgamento']=arr.join(' + ');s.manual=true;render()},tj.split(' + ').includes(t)?'on':'')));q.append(w,btn('Restaurar automático',()=>{s.data['triagem.Tipo de Julgamento']='Apelação';s.manual=false;render()}))}));groups(['Autuação','Partes','Tramitação'],p);const char=['Tema','Assunto detalhado','Especificidades','Síntese Processual','Síntese Fática','Alegações','Etiquetas','Etiquetas sugeridas'].map(k=>find('triagem',k)).filter(Boolean);p.append(block('char','Caracterização jurídica, síntese e etiquetas',char));p.append(el('h3','rule','Controles especiais · '+Object.values(s.active).filter(Boolean).length+' em vigor'));for(const g of schema.find(a=>a.aba==='Controles especiais').grupos)if(controls[g.grupo])p.append(control(g))}));app.append(h);
const tabs=el('div','tabs');for(const [k,t] of [['acom','Acompanhamento'],['caso','Caso'],['adm','Admissibilidade'],['jul',mono?'Decisão':'Julgamento'],['autos','Autos']])tabs.append(btn(t,()=>{tab=k;editing='';render()},tab===k?'on':''));app.append(tabs);
const body=el('div','stack');if(tab==='acom'){body.append(entries('signals','Sinalizações'),entries('notes','Notas sobre o caso'));if(!mono)body.append(entries('requests','Solicitações'));groups(['Acompanhamento','Registro no acervo'],body);const mat=group('Matéria e gestão');const skip=['Tema','Assunto detalhado','Especificidades','Síntese Processual','Síntese Fática','Alegações','Tipo de Julgamento','Etiquetas','Etiquetas sugeridas','O que falta sanar','Intercorrências','Avisos'];if(mat)body.append(block('mat','Encaminhamento e demais campos de triagem',mat.campos.filter(c=>!skip.includes(c.chave))));}
if(tab==='caso')groups(['Sentença','Origem','Recursos e contrarrazões','Outras peças e ocorrências','Espécie e decisão impugnada','Acórdão recorrido (embargos de declaração)','Embargos de declaração','Agravo interno','Juízo de retratação','Registro da triagem (lote)'],body);
if(tab==='adm')groups(['Admissibilidade e regularidade','Ministério Público'],body);
if(tab==='jul')groups(['Designação e minuta','Revisão','Lote e correção (Index)',...(mono?['Ato e fundamento','Decisão monocrática','Monocrática']:['Revisão do acórdão (ementa)','Relatório, voto e ementa','Liberação para a sessão','Pauta e julgamento'])],body);
if(tab==='autos'){groups(['Autos extraídos do PJe'],body);body.append(el('p','mut','A leitura real dos autos permanece na versão atual. Este protótipo não consulta o PJe.'))}
app.append(body)}
function switchProfile(p){if(!Object.hasOwn(states,p)||p===profile)return;const before=S();if(editing){if(!window.confirm('Descartar a edição não salva e alterar o destino?')){render();return}}profile=p;const next=S();next.manual=before.manual;next.data['producao.Destino']=p==='sessao'?'Sessão':'Monocrática';editing='';draft={};render()}
fetch('universal-ficha.json').then(r=>{if(!r.ok)throw Error('Ficha indisponível');return r.json()}).then(f=>{schema=f.abas;all=schema.flatMap(a=>a.grupos.flatMap(g=>g.campos));render()}).catch(e=>{app.replaceChildren(el('p','error','Não foi possível carregar o esquema: '+e.message))});
</script></body></html>
