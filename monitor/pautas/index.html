   Camada de apresentação sobre o motor: lê CMTSessao, o acervo (acervoDe) e a equipe.
   Etapas: 1 seleção prévia · 2 pauta oficial · 3 preparar · 4 publicar · 5 painel da sessão.

(function (W, D) {

  const SEM = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];

  /* ---------- ações que gravam (sempre com confirmação) ---------- */
  const marcados = (k, lista) => lista.filter((dg) => marcado(k, dg));
  function mover(ss, cnjs, dest, txt) {

  $('#pt-tema').addEventListener('click', () => { const dk = D.documentElement.getAttribute('data-theme') === 'dark'; if (dk) D.documentElement.removeAttribute('data-theme'); else D.documentElement.setAttribute('data-theme', 'dark'); try { localStorage.setItem('cmt-theme', dk ? 'light' : 'dark'); } catch (e) {} });
  /* pedido de token do GitHub (aparece dentro do motor): enquanto aberto, o motor fica à vista */
  setInterval(() => { const w = getMotor(); let pede = false; try { pede = !!(w && w.document.querySelector('form input[type=password]')); } catch (e) {} D.body.classList.toggle('pt-token', pede); }, 400);
  /* espera o motor carregar o acervo e as sessões */
  let n = 0; const t = setInterval(() => {
    const w = getMotor();
    if (w && w.__painelCentralComponent && w.CMTSessao && w.CMTSessao.estado) { clearInterval(t); pronto = true; render(); return; }
    if (++n === 240) { clearInterval(t); $('#pt-carga').innerHTML = '<b>O motor de dados não carregou.</b><span>Recarregue a página. Se persistir, abra a Triagem e confira a conexão com o procs-muta.</span>'; }
  }, 250);
  /* o motor avisa mudanças (gravação, importação): a página redesenha */
  setInterval(() => { if (!pronto || D.body.classList.contains('cmt-ficha-on')) return; const s = getSes(); const sig = JSON.stringify((s?.estado()?.sessoes || []).map((x) => [x.id, (x.itens || []).length, (x.previa || []).length, x.publicada || ''])); if (sig !== render.sig) { render.sig = sig; if (!D.activeElement?.closest?.('#pt-view input,#pt-view select,#pt-view textarea')) render(); } }, 1500);
})(window, document);
</script>
