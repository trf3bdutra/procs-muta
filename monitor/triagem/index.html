<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Figtree,system-ui,sans-serif}
a{color:var(--v2)}

.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

.btn{height:34px;padding:0 13px;border:1px solid var(--b2);background:var(--w);color:var(--tx);font:700 13px Figtree,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border-radius:6px;white-space:nowrap}

.x{border:0;background:transparent;color:var(--m);font-size:15px;cursor:pointer;padding:0 0 0 4px;line-height:1}

.tg.d-pauta{border-color:#9cc0b4;color:var(--ok);background:#eaf3ef}

#abas{display:flex;align-items:flex-end;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}#abas::-webkit-scrollbar{display:none}

/* Fila */
.fl-cab{display:flex;flex-direction:column;gap:10px;padding:14px 0 12px;border-bottom:1px solid var(--b)}
.fl-l1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--b2);border-radius:6px;overflow:hidden;height:34px;flex:none}
.seg button{border:0;border-left:1px solid var(--b);background:var(--w);font:600 12.5px Figtree,sans-serif;color:var(--tx);padding:0 11px;cursor:pointer}
.seg button:first-child{border-left:0}.seg button.on{background:var(--v);color:#fff}
.busca{flex:1 1 360px;display:flex;align-items:center;gap:10px;min-height:34px;padding:0 12px;background:var(--w);border:1px solid var(--b2);border-radius:6px}

.busca textarea{flex:1;border:0;outline:0;resize:vertical;min-height:34px;padding:7px 0;font:13px "JetBrains Mono",monospace}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 6px 2px 10px;border:1px solid #9cc0b4;background:#eaf3ef;border-radius:999px;font-size:12.5px;color:var(--ok);max-width:100%}

.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}

.pop{position:absolute;z-index:40;background:var(--w);border:1px solid var(--b2);border-radius:10px;box-shadow:0 14px 36px rgba(23,63,61,.2)}
#crit-pop{width:min(780px,calc(100vw - 32px));padding:16px 18px;display:flex;flex-direction:column;gap:12px}

.vals{border:1px solid #e3ded2;border-radius:8px}
.vals .vh{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #e3ded2}
.vals .vh input{flex:1;border:0;outline:0}
.vals .vl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 6px;max-height:260px;overflow:auto;padding:6px;font-size:12.5px;background:#fbfaf5}
.vals .vl label{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px;cursor:pointer;border-radius:5px;min-width:0}.vals .vl .vt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vals .vl .bd{font:500 10.5px 'JetBrains Mono',monospace;background:#e3ecf2;color:#24506f;border-radius:999px;padding:1px 7px;flex:none}

.vals .vl label span:first-child{display:flex;gap:8px;align-items:center;min-width:0}
.pjf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;padding:14px 16px;border:1px solid var(--b);background:var(--w);border-radius:8px}.pjf .f input,.pjf .f select{height:32px;padding:0 8px;font-weight:400}.pjf .f input:disabled{background:#f4f2ea}@media (max-width:860px){.pjf{grid-template-columns:minmax(0,1fr)}}
.acf{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start;padding:12px 16px;border:1px solid var(--b);background:var(--p);border-radius:8px}.acf .big{font:500 30px 'JetBrains Mono',monospace;color:var(--v);line-height:1.1}.acf .pre{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.acf .pre button{height:30px;padding:0 12px;border:1px solid var(--b2);background:var(--w);border-radius:999px;font:700 12.5px Figtree,sans-serif;cursor:pointer}.acf .pre button.on{background:var(--v);border-color:var(--v);color:#fff}.acf .gs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.acf .gs button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--b);background:var(--w);border-radius:999px;font:600 12.5px Figtree,sans-serif;cursor:pointer;color:var(--tx)}.acf .gs button i{width:9px;height:9px;border-radius:50%;border:2px solid var(--c);display:inline-block}.acf .gs button.on{background:#eef4f1;border-color:var(--v2)}.acf .gs button.on i{background:var(--c)}.acf .gs button b{font:500 11.5px 'JetBrains Mono',monospace;color:var(--m)}
.etp{border:1px solid var(--b);background:var(--p);border-radius:8px}.etp .eh{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--l)}.etp .eh .hs{width:28px;height:28px;border-radius:50%;background:#e3ecf2;color:var(--az);display:grid;place-items:center;font-weight:700}.etp .eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;padding:10px 14px 14px}.etp .eg button{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:34px;padding:4px 6px 4px 10px;border:1px solid var(--b);background:var(--w);border-radius:8px;font:600 12.5px Figtree,sans-serif;color:var(--tx);cursor:pointer;text-align:left;min-width:0}.etp .eg button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.etp .eg button b{font:500 10.5px 'JetBrains Mono',monospace;background:#e3ecf2;color:var(--az);border-radius:999px;padding:1px 7px;flex:none}.etp .eg button.in{background:var(--v);border-color:var(--v);color:#fff}.etp .eg button.in b{background:rgba(255,255,255,.18);color:#fff}.etp .eg button.out{background:#fbefec;border-color:var(--r2);color:var(--r);text-decoration:line-through}
.fl-grid{display:grid;grid-template-columns:240px minmax(0,1fr)}
.rail{padding:16px 18px 40px 0;border-right:1px solid var(--b);display:flex;flex-direction:column;gap:14px;min-width:0}

.rl.on{background:var(--v);color:#fff;font-weight:700}.rl.on span{color:#cfe0dc}
.et{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;padding:2px 0}

.et .pm{display:flex;gap:3px;flex:none}
.et .pm button{height:22px;width:22px;padding:0;border:1px solid var(--b2);background:var(--w);border-radius:5px;cursor:pointer;font-weight:700;line-height:1}
.et .pm button.on{background:var(--v);border-color:var(--v);color:#fff}.et .pm button.on.neg{background:var(--r);border-color:var(--r)}
.fl-main{padding:14px 0 0 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.st{border:1px solid var(--b);background:var(--p);border-radius:8px;box-shadow:inset 0 3px 0 var(--g2)}
.st-h{display:flex;align-items:center;gap:18px;padding:11px 16px;border-bottom:1px solid var(--l);flex-wrap:wrap}

.row{display:grid;grid-template-columns:26px 205px 64px minmax(0,1fr) 84px 92px 150px;gap:12px;align-items:center;padding:8px 16px;border-top:1px solid var(--l2);font-size:13.5px}

.es-cab{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start;padding:18px 0 14px}

body.cmt-ficha-on #cmt-motor{left:0;visibility:visible;z-index:61;top:calc(4vh + 48px);left:4vw;width:92vw;height:calc(92vh - 48px)}

@media (max-width:860px){.fl-grid{grid-template-columns:minmax(0,1fr)}.rail{border-right:0;padding-right:0}.fl-main{padding-left:0}.row{grid-template-columns:24px minmax(0,1fr) 80px;}.row>:nth-child(3),.row>:nth-child(5),.row>:nth-child(6){display:none}#rodape{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#rodape .sel{grid-column:1/-1}#marca span{display:none}.wrap{padding:0 14px}#top{padding:0 14px}}

<script>
(function () {
'use strict';
const D = document, W = window;
const $ = (s, r) => (r || D).querySelector(s), $$ = (s, r) => [...(r || D).querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nz = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const dg = (v) => String(v || '').replace(/\D/g, '');
const fmtCnj = (v) => { const d = dg(v); return d.length === 20 ? d.replace(/^(\d{7})(\d{2})(\d{4})(\d)(\d{2})(\d{4})$/, '$1-$2.$3.$4.$5.$6') : String(v || ''); };
const nf = (n) => Number(n || 0).toLocaleString('pt-BR');
const iso = (v) => { const s = String(v || '').trim(); let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (m) return m[1] + '-' + m[2] + '-' + m[3]; m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s); if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); return ''; };
const br = (i) => i ? i.slice(8, 10) + '/' + i.slice(5, 7) + '/' + i.slice(0, 4) : '';
const HOJE = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
const ANO = +HOJE.slice(0, 4);
const dias = (i) => i ? Math.floor((Date.parse(HOJE) - Date.parse(i)) / 864e5) : null;
const somaDias = (i, n) => { const d = new Date(Date.parse(i) + n * 864e5); return d.toISOString().slice(0, 10); };
const hhmm = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function toast(t, bad) { const b = $('#toast'); b.textContent = t; b.classList.toggle('bad', !!bad); b.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { b.hidden = true; }, bad ? 9000 : 5000); }

/* ===================== motor de dados (acervo, gravação no procs-muta, ficha e importadores) ===================== */
const frame = D.createElement('iframe'); frame.id = 'cmt-motor'; frame.title = 'Motor de dados do acervo'; frame.src = '/init/motor/index.html'; D.body.appendChild(frame);
const M = () => { try { return frame.contentWindow; } catch (e) { return null; } };
const core = () => (M() && M().__painelCentralComponent) || null;
const SES = () => (M() && M().CMTSessao) || null;
const PM = () => (M() && M().ProcsMuta) || null;
setInterval(() => { let pede = false; try { const w = M(); pede = !!(w && w.document.querySelector('#procsmuta-token, form input[type=password]')); } catch (e) {} D.body.classList.toggle('tk', pede); }, 400);

/* ===================== regras (as mesmas do Monitor, sobre a fonte do acervo) ===================== */
const CLS = [[/^APELA[CÇ][AÃ]O \/ REMESSA/, 'ApRemNec'], [/^APELA[CÇ][AÃ]O C[IÍ]VEL/, 'ApCiv'], [/^AGRAVO DE INSTRUMENTO/, 'AI'], [/^REMESSA NECESS/, 'RemNec'], [/^EMBARGOS DE DECLARA/, 'ED'], [/^AGRAVO INTERNO/, 'AgInt'], [/^MANDADO DE SEGURAN/, 'MS'], [/^PEDIDO DE EFEITO SUSPENSIVO/, 'PESAp'], [/^PETI[CÇ][AÃ]O/, 'Pet'], [/^TUTELA CAUTELAR/, 'TutCautAnt'], [/^RESTAURA/, 'RestAut'], [/^CONFLITO DE COMPET/, 'CC'], [/^A[CÇ][AÃ]O RESCIS/, 'AR']];
const abrev = (c) => { const u = String(c || '').toUpperCase().trim(); if (!u) return '—'; for (const [rx, a] of CLS) if (rx.test(u)) return a; return u.split(/\s+/).map((w) => w[0]).join('').slice(0, 6); };
const SEC_RX = /^[123]ª Seção$/;
const etqDe = (r) => String(r.Etiquetas || r.etiquetas || r['Etiquetas Originais'] || '').split(/[;,|]/).map((s) => s.trim()).filter(Boolean);
/* escopo (apoio/regras/escopo-triagem.json): entra só a tarefa do PJe listada em "triar"; tarefa não listada fica à parte */
let ESCOPO = { triar: [['Analisar tipo de decisão a proferir', 'decisão sobre o destino'], ['Triagem de Gabinete', 'ainda não triado'], ['Recebidos com Embargos de Declaração', 'embargos: sessão ou decisão monocrática'], ['Recebidos da unidade processante', 'voltou ao gabinete sem destino'], ['Minutar ato judicial', 'a tarefa também recebe processos ainda não triados'], ['Minutar ato judicial - Processo sobrestado', 'retomada após o julgamento do tema'], ['[Sessão] Processos retirados e adiados', 'repautar']], ignorar: {} , lido: false };
const nzT = (t) => nz(t).replace(/[\s\u2013\u2014-]+/g, ' ').trim();
let TRIAR = new Map(), IGN = new Map();
function montaEscopo() { TRIAR = new Map(ESCOPO.triar.map((x) => [nzT(x[0]), x])); IGN = new Map(); Object.keys(ESCOPO.ignorar || {}).forEach((g) => ((ESCOPO.ignorar[g] || {}).tarefas || []).forEach((t) => IGN.set(nzT(t), g))); }
montaEscopo();
const ehAptoE = (e) => /\bapto(s)?\b|apto para julgamento/i.test(e) && !/inapt/i.test(e);
const DEST = [
  ['ret', 'Retirado ou adiado: repautar', '#b0524a', (o) => /retirados e adiados/i.test(o.tarefa) || o.etq.some((e) => /retirad|retirar de pauta|\badiad/i.test(e))],
  ['apc', 'Apto: pautar (colegiado)', '#3b7150', (o) => o.apto && !o.monoE],
  ['apm', 'Apto: decisão do relator provável', '#24506f', (o) => o.apto && o.monoE],
  ['edr', 'Embargos de declaração recebidos: sessão ou monocrática', '#2f6690', (o) => /Recebidos com Embargos/i.test(o.tarefa)],
  ['msob', 'Retomada após o julgamento do tema', '#8a70c0', (o) => /Processo sobrestado/i.test(o.tarefa)],
  ['ai', 'Agravo de instrumento antigo: verificar perda de objeto', '#a6545e', (o) => o.cl === 'AI' && o.dist && +o.dist.slice(0, 4) < ANO],
  ['min', 'Em “Minutar ato judicial”: conferir se já triado', '#4b7fa8', (o) => /^Minutar ato judicial/i.test(o.tarefa)],
  ['rec', 'Voltou da unidade processante', '#8a948f', (o) => /Recebidos da unidade/i.test(o.tarefa)],
  ['tri', 'Indefinido: definir na triagem', '#a57829', (o) => /Triagem de Gabinete|Analisar tipo de decis/i.test(o.tarefa)],
  ['out', 'Outros: conferir', '#9aa3ad', () => true]
];
const CAND = [
  ['ai', 'Agravo de instrumento com risco de perda de objeto', 'autuado antes do ano corrente: consultar o andamento na origem (CPC, art. 932, III)', (o) => o.cl === 'AI' && o.dist && +o.dist.slice(0, 4) < ANO],
  ['rem', 'Remessa necessária sem apelação', 'conferir o valor da condenação (CPC, art. 496, § 3º; Súmula 253/STJ)', (o) => o.cl === 'RemNec' || o.etq.some((e) => /apenas remessa/i.test(e))],
  ['ed', 'Embargos de declaração recebidos', 'ver se a decisão embargada é monocrática (CPC, art. 1.024, § 2º)', (o) => /Recebidos com Embargos/i.test(o.tarefa) || o.cl === 'ED'],
  ['etm', 'Já etiquetados como monocrática', 'mover para “Minutar ato judicial”', (o) => o.etq.some((e) => /monocr/i.test(e))],
  ['prec', 'Precedente qualificado indicado na etiqueta', 'confirmar se a tese foi firmada (CPC, art. 932, IV e V)', (o) => o.etq.some((e) => /\btema\b|s[uú]mula|repetitiv|\birdr\b/i.test(e) && !/1433/.test(e))],
  ['comp', 'Competência e prevenção', 'decidir a competência antes do mérito', (o) => o.etq.some((e) => /decl[ií]n|incompet|preven[cç][aã]o (pendente|a verificar)/i.test(e))],
  ['ped', 'Pedidos de competência do relator', 'efeito suspensivo, petição, tutela cautelar, restauração de autos', (o) => /^(PESAp|Pet|TutCautAnt|RestAut)$/.test(o.cl)]
];
function pendDe(o) { const t = o.etq.map(nz), has = (rx) => t.some((x) => rx.test(x)), L = [];
  if (has(/ag\. parecer|aguardando parecer|intimar mpf/)) L.push('parecer do MPF'); if (has(/ag\. contrarraz|ag\. contraminuta/)) L.push('contrarrazões');
  if (has(/preparo/) && !has(/custas ok/)) L.push('preparo'); if (has(/liminar pendente/)) L.push('liminar'); if (has(/aguardar novos precedentes|tema 1433/)) L.push('precedente'); if (has(/nao pautar/)) L.push('não pautar'); return L; }

/* ===================== estado ===================== */
let FONTE = null, FONTE_EM = '', U = [], NOVAS = [], ALL = [], IDX = new Map(), ROWS_REF = null, ROWS_N = 0, PRONTO = false;
const ESC_ARQ = 'acervo/triagem/escaninhos.json';
let ESC = { schema: 'gabcmt.escaninhos', versao: 1, atualizadoEm: '', escaninhos: [] }, ESC_V = 0, ESC_GRAV = 0;
const PEND = new Map(); let GRAVANDO = false, ERRO = '', ULT = '', TENT = 0, T_GRAVA = null;
const DESF = [];
let ABA = 'inicio', ABERTAS = LS.get('tri_abas', []);
const SEL = new Set();
const CORES = [['Ocre', '#a57829'], ['Azul', '#4b7fa8'], ['Verde', '#3b7150'], ['Vinho', '#8a2f22'], ['Cinza', '#8a948f'], ['Roxo', '#6a4fb3']];
const GRUPOS = [['triar', 'Em triagem', '#a57829'], ['nc', 'Não classificadas', '#8a2f22'], ['pauta', 'Já na pauta', '#173f3d'], ['producao', 'Em produção', '#4b7fa8'], ['sobrestados', 'Sobrestados', '#8a70c0'], ['distribuicao', 'Análise da distribuição', '#3b7150'], ['secretaria', 'Com a secretaria', '#8a948f'], ['sem', 'Sem tarefa do gabinete', '#b3ab9c']];
const PRESETS = [['triagem', 'Em triagem', ['triar']], ['gabinete', 'Em tarefa do gabinete', ['triar', 'nc', 'pauta', 'producao', 'sobrestados', 'distribuicao', 'secretaria']], ['fora', 'Fora da triagem', ['nc', 'pauta', 'producao', 'sobrestados', 'distribuicao', 'secretaria', 'sem']], ['todos', 'Todos na fonte', GRUPOS.map((g) => g[0])]];
const PJ0 = () => ({ num: '', obj: '', ass: '', cla: '', parte: '', doc: '', orgao: '', col: '', ordem: '', prior: '', etq: '', autDe: '', autAte: '', minut: '', cargo: '', sig: false, lim: false, top: false });
const F = { pje: PJ0(), pjeAberto: false, base: LS.get('tri_base', ['triar']), etqAberto: LS.get('tri_etqp', true), etqQ: '', modo: 'texto', q: '', lote: '', crit: [], fac: { secao: [], classe: [], assunto: [], tarefa: [], prior: [] }, etIn: [], etOut: [], conj: null, ver: 'lista', ord: 'cnj', dir: 1, lim: 100, statsAberto: LS.get('tri_stats', true), statsX: null, rail: LS.get('tri_rail', { secao: 1, classe: 1, etq: 1 }) };
const FE = { q: '', lim: 100, ver: 'lista' };

function escDe(d) { for (const e of ESC.escaninhos) if (e._set && e._set.has(d)) return e; return null; }
function indexEsc() { ESC.escaninhos.forEach((e) => { e.processos = (e.processos || []).map(fmtCnj); e._set = new Set(e.processos.map(dg)); }); }
function destinoAtual(o) { const r = o.row;
  if (r['Seleção Prévia'] === 'SELECIONADO PREVIAMENTE' && r['Sessão Destino']) return { k: 'pauta', t: 'pauta ' + String(r['Sessão Destino']).slice(0, 5), s: r['Sessão Destino'] };
  if (r.Destino === 'Monocrática') return { k: 'mono', t: 'monocrática' };
  const e = escDe(o.d); if (e) return { k: 'esc', t: e.titulo, e };
  return { k: '', t: 'sem destino' }; }
function proc(f, r) {
  r = r || f;
  const etq = etqDe(f), classe = f.classe_judicial || f.Classe || r.classe_judicial || '', cl = abrev(classe), tarefa = String(f.tarefa_atual || '').trim();
  const sc = String(f['Seção Competente'] || r['Seção Competente'] || '').trim(), se = etq.find((e) => SEC_RX.test(e)) || '';
  const o = { row: r, d: dg(f.processo || f.Processo), cnj: fmtCnj(f.processo || f.Processo), classe, cl, assunto: String(f.assunto_judicial || f.Assunto || f.Assunto_Principal || '').trim() || '—',
    tarefa, desde: iso(f.data_entrada_tarefa), secao: SEC_RX.test(sc) ? sc : (se || 'Sem seção'), secEtq: se, secComp: SEC_RX.test(sc) ? sc : '', prior: /^(sim|s)$/i.test(String(f.prioridade || '').trim()), etq,
    partes: [f.polo_ativo || f.Polo_Ativo, f.polo_passivo || f.Polo_Passivo].filter((x) => x && x !== '####').join(' x '), dist: iso(f['data_distribuição'] || f['Data_Distribuição']) };
  const sim = (v) => /^(sim|s|true|1)$/i.test(String(v == null ? '' : v).trim());
  o.orgao = String(f['Órgão Julgador'] || f['DataJud · Órgão Julgador'] || '').trim(); o.colegiado = String(f.Colegiado || '').trim(); o.cargo = String(f['Cargo Judicial'] || '').trim();
  o.sigiloso = sim(f.Sigiloso) || !!f['Nível_Sigilo'] || f.Consta_Acervo_Sigiloso === 'Sim';
  o.liminar = sim(f['Liminar Pendente']) || etq.some((e) => /liminar pendente/i.test(e));
  o.minutante = String(r.SERVIDOR || '').trim(); o.topico = !!String(r['Tópico-síntese'] || '').trim();
  o.objeto = [o.assunto, f['DataJud · Assuntos'], f.Assuntos_do_Processo, f.ultimo_movimento].filter(Boolean).join(' ');
  o.apto = etq.some(ehAptoE) || /Aptos para julgamento/i.test(tarefa);
  o.monoE = etq.some((e) => /monocr/i.test(e)) || r.Destino === 'Monocrática';
  o.prov = DEST.find((x) => x[3](o))[0];
  o.pend = pendDe(o);
  o.cand = '';
  if (o.prov !== 'ret') { const c = CAND.find((x) => x[3](o)); if (c) o.cand = c[0]; }
  o.div = !!(o.secEtq && o.secComp && o.secEtq !== o.secComp);
  return o; }
function construir() {
  const c = core(); const R = (c && c.rows) || []; ROWS_REF = R; ROWS_N = R.length;
  indexEsc();
  /* o paradeiro (tarefa, etiquetas, prioridade) vem da fonte do procs-muta, não da cópia do navegador; da cópia vem só o trabalho do gabinete */
  const MR = new Map(); R.forEach((r) => { const d = dg(r.Processo || r.processo); if (d) MR.set(d, r); });
  const F0 = FONTE || R;
  U = []; NOVAS = []; ALL = [];
  F0.forEach((f) => { const t = String(f.tarefa_atual || '').trim(), d = dg(f.processo || f.Processo); if (d.length !== 20) return; let r = MR.get(d); if (!r) { r = { Processo: fmtCnj(d) }; }
    const k = nzT(t), o = proc(f, r);
    o.grupo = !t ? 'sem' : TRIAR.has(k) ? 'triar' : IGN.has(k) ? IGN.get(k) : (ESCOPO.lido ? 'nc' : 'sem');
    ALL.push(o); if (o.grupo === 'triar') U.push(o); else if (o.grupo === 'nc') { o.nova = true; NOVAS.push(o); } });
  IDX = new Map(ALL.map((o) => [o.d, o]));
  ALL.forEach((o) => { o.dest = destinoAtual(o); o.hay = nz([o.cnj, o.d, o.classe, o.cl, o.assunto, o.tarefa, o.secao, o.partes, o.etq.join(' '), o.dest.t].join(' ')); });
  for (const d of [...SEL]) if (!IDX.has(d)) SEL.delete(d); }
function refazDest(o) { o.dest = destinoAtual(o); o.hay = nz([o.cnj, o.d, o.classe, o.cl, o.assunto, o.tarefa, o.secao, o.partes, o.etq.join(' '), o.dest.t].join(' ')); }
const DLAB = Object.fromEntries(DEST.map((x) => [x[0], x[1]])), CLAB = Object.fromEntries(CAND.map((x) => [x[0], x[1]]));

/* ===================== sessões (calendário, pelo motor) ===================== */
function sessoes() { const s = SES(); let L = []; try { L = ((s && s.estado && s.estado().sessoes) || []).slice(); } catch (e) {} return L.filter((x) => x.data && x.data >= HOJE).sort((a, b) => a.data.localeCompare(b.data)); }
const nomeSes = (ss) => br(ss.data);

/* ===================== gravação (acervo/operacional.json + escaninhos), com fila e nova tentativa ===================== */
function estadoDe(o) { const r = o.row; return { sp: r['Seleção Prévia'] === 'SELECIONADO PREVIAMENTE' ? 'SELECIONADO PREVIAMENTE' : '', sd: r['Seleção Prévia'] === 'SELECIONADO PREVIAMENTE' ? (r['Sessão Destino'] || '') : '', mono: r.Destino === 'Monocrática' ? 'Monocrática' : '', esc: ESC.escaninhos.filter((e) => e._set.has(o.d)).map((e) => e.id) }; }
function poeEstado(o, st) {
