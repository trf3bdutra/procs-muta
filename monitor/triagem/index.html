(async function arrancar() {

  const pEscopo = PM().ler('apoio/regras/escopo-triagem.json').then((t) => { const j = JSON.parse(t); if (j && Array.isArray(j.triar)) { ESCOPO = { triar: j.triar.map((x) => [x.tarefa, x.motivo || '']), ignorar: j.ignorar || {}, lido: true }; montaEscopo(); } ETAPA.escopo = 1; }).catch((e) => { console.warn('[Triagem] escopo', e); ETAPA.escopo = 2; });

  ETAPA.motor = 1; etapas();

  setInterval(() => { if (!PRONTO || D.body.classList.contains('cmt-ficha-on') || $('#gaveta') || $('.pop') || $('#rg')) return; const c = core(); if (!c || !c.rows) return; if (c.rows !== ROWS_REF || c.rows.length !== ROWS_N) { construir(); render(); } }, 4000);
  /* fonte nova no procs-muta (carga do painel, lista de tarefa, DataJud): relê e redesenha, para a tarefa atual estar sempre em dia */
  let FONTE_SHA = ''; const vigia = async () => { if (!PRONTO || D.hidden || $('#gaveta') || $('#rg') || $('.pop')) return; try { const P = PM(), k = P && P.atual; if (!k) return;
      const r = await fetch('https://api.github.com/repos/trf3bdutra/procs-muta/commits?path=acervo/fonte.json&per_page=1', { cache: 'no-store', headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + k } }); if (!r.ok) return;
      const j = await r.json(), sha = j[0] && j[0].sha; if (!sha) return; if (!FONTE_SHA) { FONTE_SHA = sha; return; } if (sha === FONTE_SHA) return; FONTE_SHA = sha;

<script>

(function (W, D) {

    const resto = a.slice(vis.length).reduce((z, x) => z + x[1], 0);

  const tipoTarefa = (t) => /\[(Sessão - )?ED\]/i.test(t || '') ? 'ED' : /\[Ag\.? ?Int\]/i.test(t || '') ? 'AgInt' : /retrata/i.test(t || '') ? 'JR' : '';

  /* ---------- cabeçalho, marcos, esteira ---------- */

  function sessoes(ss) {

  /* ---------- listagem e prontuário ---------- */
  function filtrar(lines) {

  function prontuario(d) {

    const it = d.raw.get(est.sel) || {}, p = d.planMap.get(est.sel) || {}, r = d.acv(x.cnj) || {};
    const k = [['Tarefa no PJe', x.tarefa || '—'], ['Seção', x.secao || '—'], ['Distribuição', x.dist ? A.br(x.dist) : '—'], ['Apreciação', p['Apreciação'] || '—'], ['Meta', p.Meta || (x.metas || []).join(' ') || '—'], ['Etapa', p.Etapa || situacao(x)], ['Minutante', x.servidor || '—'], ['Corretor', x.corretor || '—'], ['Tempestividade', p.Tempestividade || '—'], ['Preparo', p.Preparo || '—'], ['Intervenção do MPF', p['Intervenção MPF'] || '—'], ['Etiquetas', r.Etiquetas || r.etiquetas || '—'], ['Pautas anteriores', (x.anteriores || []).join(' · ') || '—'], ['Pendências', p['Pendências'] || 'nenhuma']];

  /* 3 · A · conversões de etiquetas */
  function convDados(ss, d) { try { return d.s?.conversoes?.(ss.id) || []; } catch (er) { return []; } }
  function etapa3(ss, d) {

      t.regras.forEach((r) => { const k = r.rot + (r.v ? ' · ' + r.v : ''); if (!grp.has(k)) grp.set(k, { rot: r.rot, v: r.v, rows: [], regras: new Set() }); const g = grp.get(k); g.rows.push({ item: p.item, cnj: p.cnj, e: t.e, id: r.nome || r.id }); g.regras.add(r.nome || r.id); }); }));

      const chips = p.tags.map((t) => t.ign ? `<span class="cwe-chp ign"><span>${e(t.e)}</span><i>→</i><b>ignorada</b></span>` : t.regras.length ? `<span class="cwe-chp cv"><span>${e(t.e)}</span><i>→</i><b>${e(t.regras.map((r) => r.rot + (r.v ? ' ' + r.v : '')).join(' · '))}</b><small>${e(t.regras.map((r) => r.nome || r.id).join(' · '))}</small></span>` : `<span class="cwe-chp"><span>${e(t.e)}</span></span>`).join('') || '<span class="cwe-chp vazio">sem etiquetas no PJe</span>';
      const ap = pr ? pr.ap : (p.tipoManual || p.tipo || '—');
      const campos = [['APRECIAÇÃO', AP_T[ap] || ap, tipoTarefa(p.tarefa) ? 'pela tarefa no PJe' : pr?.dif.includes('ap') ? 'pela etiqueta · a aplicar' : p.tipoManual ? 'fixado' : 'padrão'], ['TAREFA NO PJe', p.tarefa || '—', ''], ['META', (pr?.meta || p.meta || (p.c.metas || []).join(' ') || '—'), pr?.dif.includes('meta') ? 'a aplicar' : ''], ['MPF', pr?.mpf || p.mpf || (p.c.mpf || []).join(' · ') || '—', pr?.dif.includes('mpf') ? 'a aplicar' : ''], ['SUBASSUNTO', (p.c.tema || []).join(' · ') || '—', ''], ['ESPECIFICIDADE', (p.c.esp || []).join(' · ') || '—', '']];
      const nc = p.tags.filter((t) => t.regras.length && !t.ign).length;
      return `<article class="cwe-pc ${pr?.dif.length ? 'dif' : ''}"><div class="t">${ck('etq', dg)}<span class="it">item ${e(p.item || '—')}</span><button type="button" class="cwe-mono cwe-lnk" data-cwt="ficha" data-p="${e(dg)}">${e(A.cnj(p.cnj))}</button><span class="as">${e(p.assunto || '—')} · ${e(p.recurso || p.classe || '')}</span><span class="ct">${p.tags.length} etiqueta(s) · ${nc} convertida(s)</span></div>
        <div class="chs">${chips}</div>
        ${pr?.man.length ? `<p class="cf"><b>CONFERIR</b><span>O valor fixado à mão difere do que a regra daria (${e(pr.man.map((x) => ({ ap: 'apreciação', meta: 'meta', mpf: 'MPF' }[x])).join(', '))}). A aplicação não mexe no que foi fixado.</span></p>` : ''}
        <div class="cps">${campos.map(([k, v, o]) => `<div><span>${e(k)}</span><b>${e(v)}</b>${o ? `<small>${e(o)}</small>` : ''}</div>`).join('')}</div></article>`; };
    const semL = [...semM.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    return `<section class="cwe-st"><h2>3 · Preparar · A · Regras de etiquetas</h2>${tabs}
      <p>Cada processo mostra todas as etiquetas do PJe. O tipo de julgamento sai primeiro da tarefa em que o processo está no PJe; a etiqueta confirma ou, sem indicação na tarefa, sugere. A etiqueta convertida aponta o resultado e a regra que a converteu.</p>
      <div class="cwe-fil" role="group" aria-label="Filtrar os processos"><span class="cwe-k">METAS E TIPO DE JULGAMENTO</span>${F.map(([k, t, n]) => `<button type="button" data-cwe="etq-f" data-v="${k}" aria-pressed="${fl === k}">${e(t)}<span>${n}</span></button>`).join('')}</div>
      <div class="cwe-kpis cwe-k4">${kpi(tot, 'Etiquetas na pauta', 'em ' + C.length + ' processos')}<button type="button" data-cwe="conv-ab" aria-expanded="${est.convAb}"><b>${conv}</b>Convertidas ${est.convAb ? '▴' : '▾'}<small>${est.convAb ? 'recolher a lista' : 'ver todas as conversões'}</small></button>${kpi(ign, 'Ignoradas por regra', 'APTO, SESSÃO, origem…')}<button type="button" data-cwe="etq-f" data-v="${fl === 'sem' ? 'todos' : 'sem'}" aria-pressed="${fl === 'sem'}"><b>${sem}</b>Sem regra<small>${fl === 'sem' ? 'mostrar todos' : 'filtrar os processos'}</small></button></div>
      ${painel}
      <div class="cwe-2col"><div class="cwe-lst"><div class="cwe-lst-h"><span><b>${aplic} de ${C.filter((p) => p.proposta?.dif.length).length} com conversão a aplicar</b> · desmarque o processo que não deve receber as conversões</span><button type="button" class="pri" data-cwe="etq-aplicar" ${aplic ? '' : 'disabled'}>Aplicar as conversões</button><button type="button" class="cwe-lnk2" data-cwe="prep" data-n="1">Próximo: designação e correção →</button></div>
        ${vis.map(card).join('') || '<p class="cwe-vazio">Nenhum processo neste filtro.</p>'}
        <div class="cwe-mostra"><span>mostrando ${vis.length} de ${L.length}</span>${L.length > vis.length ? `<button type="button" data-cwe="etq-mais">Mostrar mais 50</button><button type="button" data-cwe="etq-todos">Mostrar todos</button>` : ''}</div></div>
      <div class="cwe-lado">${boxRegrasPauta(ss, d)}
        <section class="cwe-box"><div class="h"><span><b>Pela tarefa no PJe</b></span><small>fixas · valem antes das etiquetas · o tipo de julgamento sai daqui</small></div>
          <div class="rb"><code>[Sessão - ED] …  ·  [ED] …</code><b>→ ED</b></div><div class="rb"><code>[Ag. Int] …</code><b>→ AgInt</b></div><div class="rb"><code>tarefa com "retratação"</code><b>→ JR</b></div><div class="rb"><code>… Processos retirados e adiados</code><b>→ Retirado ou adiado</b></div>
          <p>A etiqueta de ED só informa. Remessa necessária vem da classe. Para outra regra por tarefa, use "Nova regra" acima com a condição "Tarefa atual no PJe".</p></section>
        ${boxRegrasPadrao(ss, d)}
        <aside class="cwe-box"><div class="h"><span><b>Sem regra, mais frequentes</b></span><small>na pauta de ${e(A.br(ss.data).slice(0, 5))} · escolha a regra de cada etiqueta (vale só nesta pauta)</small></div>
          ${semL.map(([t, n]) => `<div class="sr"><b>${n}</b><span>${e(t)}</span><select data-cwe-rbsel="${e(t)}" aria-label="Criar regra para a etiqueta ${e(t)}"><option value="">Criar regra…</option>${efeitosRb(d).map((x) => `<option value="${e(x.k)}">${e(x.t)}</option>`).join('')}</select></div>`).join('') || '<p>Todas as etiquetas têm regra.</p>'}</aside></div></div></section>`;
  }

  /* ===== regras de etiquetas por pauta: criadas aqui valem só nesta sessão (gravadas no arquivo dela); "Tornar padrão" leva às regras gerais ===== */
  function efeitosRb(d) { try { return d.s?.efeitosEtiqueta?.() || []; } catch (er) { return []; } }
  function boxRegrasPauta(ss, d) { let R = null; try { R = d.s?.regrasPauta?.(ss.id) || null; } catch (er) { R = null; } if (!R) return '';
    const rb = est.rb, opt = (L, v) => L.map((x) => `<option value="${e(x.k)}"${x.k === v ? ' selected' : ''}>${e(x.t)}</option>`).join('');
    let form = '';
    if (rb) { const ef = R.efeitos.find((x) => x.k === rb.ef) || R.efeitos[0]; let prev = []; try { prev = d.s?.previaRegraPauta?.(ss.id, rb) || []; } catch (er) { prev = []; }
      const temCond = rb.conds.some((c) => c.op === 'vazio' || String(c.val || '').trim());
      const tarefas = [...new Set((convDados(ss, d) || []).map((p) => p.tarefa).filter(Boolean))].sort();
      form = `<div class="cwe-rb"><div class="rbl"><span class="cwe-k">QUANDO</span><span class="rbg"><button type="button" data-cwe="rb-liga" data-v="E" aria-pressed="${rb.liga !== 'OU'}">E</button><button type="button" data-cwe="rb-liga" data-v="OU" aria-pressed="${rb.liga === 'OU'}">OU</button></span></div>
        ${rb.conds.map((c, i) => `<div class="rbc"><select data-rb="campo" aria-label="Campo">${opt(R.campos, c.campo)}</select><select data-rb="op" aria-label="Operador">${opt(R.ops, c.op)}</select><button type="button" data-cwe="rb-tira" data-i="${i}" aria-label="Tirar a condição" title="Tirar a condição">×</button><input data-rb="val" value="${e(c.val || '')}" placeholder="${c.campo === 'tarefa' ? 'ex.: [Sessão - ED] ou retratação' : c.campo === 'item' ? 'ex.: 12 ou 40-60' : 'texto'}"${c.campo === 'tarefa' ? ' list="rb-tarefas"' : ''}></div>`).join('')}
        <datalist id="rb-tarefas">${tarefas.map((t) => `<option value="${e(t)}"></option>`).join('')}</datalist>
        <button type="button" class="cwe-lnk" data-cwe="rb-mais">+ condição</button>
        <div class="rbl"><span class="cwe-k">ENTÃO</span></div><select data-rb="ef" aria-label="Efeito">${opt(R.efeitos, rb.ef)}</select>${ef && ef.v ? `<input data-rb="v" value="${e(rb.v || '')}" placeholder="${e(ef.v)}">` : ''}
        <p class="rbp"><b>${temCond ? prev.length + ' processo(s) desta pauta' : 'Preencha uma condição'}</b>${prev.slice(0, 4).map((x) => `<span>item ${e(x.item || '—')} · ${e(A.cnj(x.cnj))}</span>`).join('')}${prev.length > 4 ? `<span>… e mais ${prev.length - 4}</span>` : ''}<button type="button" class="cwe-lnk" data-cwe="rb-previa">atualizar a prévia</button></p>
        <span class="cwe-acoes"><button type="button" class="pri" data-cwe="rb-salvar">Salvar nesta pauta</button><button type="button" data-cwe="rb-x">Cancelar</button></span><small>Vale só para a pauta de ${e(A.br(ss.data))} e fica gravada com ela. "Tornar padrão" leva a regra às configurações.</small></div>`; }
    return `<section class="cwe-box"><div class="h"><span><b>Regras desta pauta</b><button type="button" class="cwe-lnk" data-cwe="rb-abre">${rb ? 'Fechar' : '+ Nova regra'}</button></span><small>por tarefa atual, etiqueta, assunto, classe, meta ou item · valem só em ${e(A.br(ss.data).slice(0, 5))}</small></div>
      ${form}${R.sessao.map((r) => `<div class="rb rbs"><code>${e(r.quando)}</code><b>→ ${e(r.ef)}</b><small>${r.n} proc.</small><span><button type="button" class="cwe-lnk" data-cwe="rb-pad" data-id="${e(r.id)}" title="Levar às regras padrão (configurações): passa a valer em todas as sessões">Tornar padrão</button><button type="button" class="cwe-lnk x" data-cwe="rb-del" data-id="${e(r.id)}" title="Excluir a regra desta pauta">Excluir</button></span></div>`).join('') || (rb ? '' : '<p>Nenhuma regra própria desta pauta.</p>')}</section>`; }
  function boxRegrasPadrao(ss, d) { let R = null; try { R = d.s?.regrasPauta?.(ss.id) || null; } catch (er) { R = null; } if (!R || !R.padrao.length) return '';
    const L = est.rbTodas ? R.padrao : R.padrao.slice(0, 8), off = R.padrao.filter((r) => r.off).length;
    return `<section class="cwe-box"><div class="h"><span><b>Regras padrão</b><button type="button" class="cwe-lnk" data-cwe="cfg-2">Configurações</button></span><small>vêm das configurações e valem em todas as sessões · aqui só se desligam nesta pauta${off ? ' · ' + off + ' desligada(s)' : ''}</small></div>
      ${L.map((r) => `<div class="rb${r.off ? ' off' : ''}"><code>${e(r.nome ? r.nome + ' · ' : '')}${e(r.quando)}</code><b>→ ${e(r.ef)}</b><button type="button" class="cwe-lnk" data-cwe="rb-off" data-id="${e(r.id)}" data-on="${r.off ? 1 : 0}" title="${r.off ? 'Voltar a aplicar nesta pauta' : 'Não aplicar só nesta pauta; nas demais continua'}">${r.off ? 'religar' : 'desligar aqui'}</button></div>`).join('')}
      ${R.padrao.length > 8 ? `<p><button type="button" class="cwe-lnk" data-cwe="rb-todas">${est.rbTodas ? 'mostrar menos' : 'ver as ' + R.padrao.length}</button></p>` : ''}</section>`; }
  function rbSync(view) { const f = view.querySelector('.cwe-rb'); if (!f || !est.rb) return;
    est.rb.conds = [...f.querySelectorAll('.rbc')].map((r) => ({ campo: r.querySelector('[data-rb="campo"]').value, op: r.querySelector('[data-rb="op"]').value, val: r.querySelector('[data-rb="val"]').value }));
    const ef = f.querySelector('[data-rb="ef"]'), v = f.querySelector('[data-rb="v"]'); if (ef) est.rb.ef = ef.value; est.rb.v = v ? v.value : ''; }

  /* criar regra sem sair da esteira */
  function formEtq(d, t) { let E = []; try { E = d.s?.efeitosEtiqueta?.() || []; } catch (er) { E = []; }
    return `<div class="cwe-nr" data-nr="etq"><span class="cwe-k">NOVA REGRA · ETIQUETA "${e(t)}"</span><label>Converte em<select data-nr-ef>${E.map((x) => `<option value="${e(x.k)}" data-v="${e(x.v)}">${e(x.t)}</option>`).join('')}</select></label>
      <label>Valor <small>(tema, especificidade, hipótese ou nº da meta)</small><input data-nr-v placeholder="só para os efeitos que pedem valor"></label>
      <span class="cwe-acoes"><button type="button" class="pri" data-cwe="nr-salvar">Salvar a regra</button><button type="button" data-cwe="nr-x">Cancelar</button></span><small>Vale para a etiqueta exatamente com este texto, nesta e nas próximas pautas.</small></div>`; }
  function formAss(Z, t) { const op = (P) => `<option value="">— manter —</option>${P.map((m) => `<option>${e(m.nome)}</option>`).join('')}`;
    return `<div class="cwe-nr" data-nr="ass"><span class="cwe-k">NOVA REGRA · ASSUNTO "${e(t)}"</span><label>Minutante<select data-nr-d>${op(Z.minutantes)}</select></label><label>Corretor<select data-nr-c>${op(Z.corretores)}</select></label>
      <span class="cwe-acoes"><button type="button" class="pri" data-cwe="nr-salvar">Salvar a regra</button><button type="button" data-cwe="nr-x">Cancelar</button></span><small>Entra no critério "Tema ou assunto"${Z.escopo === 'sessao' ? ', no ajuste desta sessão' : ', nas regras gerais'}.</small></div>`; }

  /* 3 · B · designação e correção */
  function etapa3b(ss, d, tabs) {
    let Z = null; try { Z = d.s?.designacao?.(ss.id) || null; } catch (er) { Z = null; }
    if (!Z) return `<section class="cwe-st"><h2>3 · Preparar · B · Designação e correção</h2>${tabs}<p class="cwe-nota">Designação indisponível: motor não carregado.</p></section>`;
    const Ls = Z.linhas, esc = est.dsg;
    const vD = (p) => esc[A.digits(p.cnj)]?.d ?? (p.servidor || p.sugD?.nome || ''), vC = (p) => esc[A.digits(p.cnj)]?.c ?? (p.corretor || p.sugC?.nome || '');
    const porRegD = Ls.filter((p) => p.sugD).length, porRegC = Ls.filter((p) => p.sugC).length;
    const brD = Ls.filter((p) => !p.servidor && !p.sugD).length, brC = Ls.filter((p) => !p.corretor && !p.sugC).length;
    const aus = Z.minutantes.concat(Z.corretores).filter((m) => m.ausente).map((m) => m.nome);
    const semAss = new Map(); Ls.filter((p) => (!p.servidor && !p.sugD) || (!p.corretor && !p.sugC)).forEach((p) => { const k = p.assunto || '—'; const o = semAss.get(k) || { n: 0, d: 0, c: 0 }; o.n++; if (!p.servidor && !p.sugD) o.d++; if (!p.corretor && !p.sugC) o.c++; semAss.set(k, o); });
    const semA = [...semAss.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 8);
    const quadro = (t, P, kind) => { const mx = Math.max(1, ...P.map((m) => m.atual + Ls.filter((p) => (kind === 'd' ? p.sugD : p.sugC)?.nome === m.nome).length));
      return `<div class="q"><div class="h"><span class="cwe-k">${e(t)}</span><small>só informação · já designados <i class="a"></i> · por regra agora <i class="b"></i></small></div>${P.map((m) => { const nv = Ls.filter((p) => (kind === 'd' ? p.sugD : p.sugC)?.nome === m.nome).length;
        return `<div class="p ${m.ausente ? 'aus' : ''}"><b>${e(m.nome)}</b><span class="cwe-br"><span class="a" style="width:${100 * m.atual / mx}%"></span><span class="b" style="width:${100 * nv / mx}%"></span></span><span>${m.atual}${nv ? ' + ' + nv : ''}${m.ausente ? ' · ausente' : ''}</span></div>`; }).join('')}</div>`; };
    const F = [['todos', 'Todos'], ['regra', 'Por regra agora'], ['branco', 'Em branco'], ['feitos', 'Já designados']];
    const fl = est.desF;
    const L = Ls.filter((p) => fl === 'todos' ? true : fl === 'regra' ? (p.sugD || p.sugC) : fl === 'branco' ? ((!p.servidor && !p.sugD) || (!p.corretor && !p.sugC)) : (p.servidor && p.corretor));
    const vis = L.slice(0, est.desTake);
    const sel = (kind, p) => { const atual = kind === 'd' ? p.servidor : p.corretor, sug = kind === 'd' ? p.sugD : p.sugC, P = kind === 'd' ? Z.minutantes : Z.corretores, v = kind === 'd' ? vD(p) : vC(p);
      if (atual) return `<span class="v">${e(atual)}</span><small>${e((kind === 'd' ? p.porD : p.porC) || 'já designado')}</small>`;
      return `<select data-cwe-esc="${kind}" data-p="${e(A.digits(p.cnj))}" class="${v ? (sug && v === sug.nome ? 'reg' : 'man') : 'vz'}"><option value="">— escolher —</option>${P.map((m) => `<option ${m.nome === v ? 'selected' : ''}>${e(m.nome)}</option>`).join('')}</select><small>${e(sug && v === sug.nome ? 'por regra: ' + sug.por : v ? 'escolha manual' : 'nenhuma regra casa')}</small>`; };
    const aplicN = Ls.filter((p) => marcado('dsg', A.digits(p.cnj)) && ((!p.servidor && vD(p)) || (!p.corretor && vC(p)))).length;
    return `<section class="cwe-st"><h2>3 · Preparar · B · Designação e correção</h2>${tabs}
      <p>Regras de designação do gabinete${Z.escopo === 'sessao' ? ', com o ajuste desta sessão' : ''}, na ordem cadastrada. Só se preenche quem está sem minutante ou sem corretor. Onde nenhuma regra casa, o campo fica em branco para escolha.</p>
      <div class="cwe-kpis cwe-k4">${kpi(Ls.length, 'Processos na pauta', `${Ls.filter((p) => p.servidor).length} com minutante · ${Ls.filter((p) => p.corretor).length} com corretor`)}${kpi(`${porRegD} · ${porRegC}`, 'Preenchidos por regra', 'minutantes · corretores')}${kpi(`${brD} · ${brC}`, 'Sem regra que case', 'minutantes · corretores, a escolher', brD + brC ? 'a' : '')}${kpi(aus.length, 'Ausências no período', aus.length ? aus.join(', ') : `nenhuma cadastrada entre ${A.br(Z.periodo.de).slice(0, 5)} e ${A.br(Z.periodo.ate).slice(0, 5)}`)}</div>
      <div class="cwe-2eq"><section class="cwe-box"><div class="h"><span><span class="cwe-k">REGRAS DE DESIGNAÇÃO · NESTA ORDEM</span><button type="button" class="cwe-lnk" data-cwe="cfg-3">Editar regras</button></span></div>
          ${Z.criterios.map((k, i) => `<div class="cr ${k.d || k.c ? '' : 'off'}"><b>${i + 1}</b><span><b>${e(k.t)}</b></span><span>${e([k.d ? 'minuta' : '', k.c ? 'correção' : ''].filter(Boolean).join(' · ') || 'desligada')}</span></div>`).join('')}
          <p>A primeira regra que casa decide, separadamente para minuta e para correção. Ausência cadastrada tira a pessoa do período.${Z.equilibrar ? ' Equilibrar a carga · ligado.' : ''}</p></section>
        <section class="cwe-box"><div class="h"><span><span class="cwe-k">ASSUNTOS SEM REGRA NESTA PAUTA</span></span><small>Uma regra por assunto resolve todos os processos dele, nesta e nas próximas pautas.</small></div>
          ${semA.map(([t, o]) => `<div class="sr"><b>${o.n}</b><span>${e(t)}<small>${[o.d ? o.d + ' sem minutante' : '', o.c ? o.c + ' sem corretor' : ''].filter(Boolean).join(' · ')}</small></span><button type="button" data-cwe="nr" data-t="ass" data-v="${e(t)}" aria-expanded="${est.nr?.t === 'ass' && est.nr.v === t}">Criar regra</button></div>${est.nr?.t === 'ass' && est.nr.v === t ? formAss(Z, t) : ''}`).join('') || '<p>Todos os assuntos têm regra que casa.</p>'}</section></div>
      <section class="cwe-carga">${quadro('MINUTA · EQUIPE', Z.minutantes, 'd')}${quadro('CORREÇÃO · ASSESSORIA', Z.corretores, 'c')}</section>
      <div class="cwe-lst"><div class="cwe-lst-h"><span class="cwe-segs">${F.map(([k, t]) => `<button type="button" data-cwe="des-f" data-v="${k}" aria-pressed="${fl === k}">${e(t)}</button>`).join('')}</span><span><b>${aplicN} a preencher</b> · o que veio por regra pode ser trocado; o que está em branco espera escolha</span><button type="button" class="pri" data-cwe="des-aplicar" ${aplicN ? '' : 'disabled'}>Aplicar à pauta</button><button type="button" class="cwe-lnk2" data-cwe="etapa" data-n="4">Próximo: publicar a pauta →</button></div>
        ${vis.map((p) => { const dg = A.digits(p.cnj); return `<article class="cwe-pc"><div class="t">${ck('dsg', dg)}<span class="it">item ${e(p.item || '—')}</span><button type="button" class="cwe-mono cwe-lnk" data-cwt="ficha" data-p="${e(dg)}">${e(A.cnj(p.cnj))}</button><span class="as">${e(p.assunto || '—')} · ${e(p.recurso || p.classe || '')} · ${e(p.secao || '')}</span><span class="ct">${e(AP_T[p.tipo] || p.tipo || '1º julgamento')}</span></div>
          <div class="ds"><div><span>MINUTANTE</span>${sel('d', p)}</div><div><span>CORRETOR</span>${sel('c', p)}</div></div></article>`; }).join('') || '<p class="cwe-vazio">Nenhum processo neste filtro.</p>'}

      else if (k === 'des-todos') est.desTake = 1e5;
      else if (k === 'cf') est.cf = est.cf === b.dataset.v ? '' : b.dataset.v;
      else if (k === 'm-ed') est.mEd = !est.mEd;
      else if (k === 'm-sug') { const s = A.getSes(), ss = A.selectedSession(); const g = s?.sugerirMarcos?.(ss && ss.id); if (!g) { A.msg('Motor indisponível para sugerir os marcos.', true); return; }
        const f = ss.fases || {}, mud = [];
        if (g.liberacao && g.liberacao !== f.liberacao && (!f.liberacao || W.confirm('Trocar a liberação de ' + A.br(f.liberacao) + ' para ' + A.br(g.liberacao) + ' (regra: dias úteis antes da sessão)?'))) { s.fase(ss.id, 'liberacao', g.liberacao); mud.push('liberação ' + A.br(g.liberacao)); }
        if (g.minutas && g.minutas !== f.minutas && (!f.minutas || W.confirm('Trocar a entrega das minutas de ' + A.br(f.minutas) + ' para ' + A.br(g.minutas) + ' (' + String(g.pontos).replace('.', ',') + ' pontos pendentes, ' + g.minutantes + ' minutante(s))?'))) { s.fase(ss.id, 'minutas', g.minutas); mud.push('entrega ' + A.br(g.minutas)); }
        A.msg(mud.length ? 'Marcos pelas regras: ' + mud.join(' · ') + '.' : 'Nada mudou' + (g.minutas ? '' : ' (sem processos pendentes ou sem minutantes para calcular a entrega)') + '.'); }
      else if (/^rb-/.test(k)) { rbSync(view); const s = A.getSes(); if (!s) return;
        if (k === 'rb-abre') est.rb = est.rb ? null : { conds: [{ campo: 'tarefa', op: 'contem', val: '' }], liga: 'E', ef: 'ED', v: '' };
        else if (k === 'rb-x') est.rb = null;
        else if (k === 'rb-mais') est.rb.conds.push({ campo: 'etiqueta', op: 'contem', val: '' });
        else if (k === 'rb-tira') { est.rb.conds.splice(+b.dataset.i, 1); if (!est.rb.conds.length) est.rb.conds.push({ campo: 'tarefa', op: 'contem', val: '' }); }
        else if (k === 'rb-liga') est.rb.liga = b.dataset.v;
        else if (k === 'rb-todas') est.rbTodas = !est.rbTodas;
        else if (k === 'rb-salvar') { if (!s.salvarRegraPauta?.(ss.id, est.rb)) { A.msg('Preencha ao menos uma condição e, se o efeito pedir, o valor (tema, especificidade, hipótese ou nº da meta).', true); return; } est.rb = null; A.msg('Regra salva nesta pauta. Gravação automática no procs-muta em instantes.'); }
        else if (k === 'rb-del') { if (!W.confirm('Excluir esta regra da pauta de ' + A.br(ss.data) + '?')) return; s.excluirRegraPauta?.(ss.id, b.dataset.id); A.msg('Regra excluída desta pauta.'); }
        else if (k === 'rb-pad') { if (!W.confirm('Tornar esta regra padrão?\n\nEla sai da pauta de ' + A.br(ss.data) + ' e passa às regras gerais (configurações), valendo em todas as sessões.')) return; s.tornarPadrao?.(ss.id, b.dataset.id); A.msg('Regra levada às regras padrão. Gravação automática no procs-muta em instantes.'); }
        else if (k === 'rb-off') { s.padraoNaPauta?.(ss.id, b.dataset.id, b.dataset.on === '1'); A.msg(b.dataset.on === '1' ? 'Regra padrão religada nesta pauta.' : 'Regra padrão desligada só nesta pauta.'); } }
      else if (k === 'nr') est.nr = est.nr?.t === b.dataset.t && est.nr.v === b.dataset.v ? null : { t: b.dataset.t, v: b.dataset.v };
      else if (k === 'nr-x') est.nr = null;
      else if (k === 'nr-salvar') { const f = b.closest('.cwe-nr'), s = A.getSes(); if (!f || !est.nr || !s) return;
        let ok = false;
        if (f.dataset.nr === 'etq') { const ef = f.querySelector('[data-nr-ef]').value, v = f.querySelector('[data-nr-v]').value; ok = !!s.criarRegraEtiqueta?.(est.nr.v, ef, v); if (!ok) { A.msg('Este efeito pede um valor (tema, especificidade, hipótese ou número da meta).', true); return; } }
        else { const dd = f.querySelector('[data-nr-d]').value, cc = f.querySelector('[data-nr-c]').value; ok = !!s.regraAssunto?.(ss.id, est.nr.v, dd, cc); if (!ok) { A.msg('Escolha o minutante, o corretor ou os dois.', true); return; } }
        est.nr = null; A.msg('Regra criada. A lista já reflete a regra; gravação automática no procs-muta em instantes.'); }
      else if (acao(k, b, ss)) return;
      else if (k === 'triagem') { W.location.hash = 'fila'; return; }
      else if (k === 'm-ed-cfg') { est.cfg = false; est.mEd = true; }
      A.render();
    });
    view.addEventListener('change', (ev) => {
      const t = ev.target;
      if (t.dataset.cweCk) { const k = t.dataset.cweCk, dg = t.dataset.p, S0 = est.desm[k] || (est.desm[k] = new Set()); if (t.checked) S0.delete(dg); else S0.add(dg); A.render(); return; }
      if (t.dataset.cweMk === 'data') { const s = A.getSes(), ss = A.selectedSession(); if (!s?.data || !ss || !t.value) return; const r = s.data(ss.id, t.value); if (r && r.erro) { A.msg(r.erro, true); t.value = ss.data; return; } A.msg('Data da sessão alterada para ' + A.br(t.value) + '. Gravação automática no procs-muta em instantes.'); A.render(); return; }
      if (t.dataset.cweMk) { const s = A.getSes(), ss = A.selectedSession(); if (s?.fase && ss) { s.fase(ss.id, t.dataset.cweMk, t.value); A.msg('Marco atualizado. Gravação automática no procs-muta em instantes.'); } return; }
      if (t.dataset.cweEq) { const s = A.getSes(); if (s?.equipeDefinir?.(t.dataset.cweEq, t.dataset.k, t.checked)) { A.msg('Equipe atualizada. Gravando no procs-muta…'); clearTimeout(ligar.tq); ligar.tq = setTimeout(() => W.CMTPautas?.gravarAgora?.(false), 1200); A.render(); } return; }
      if (t.dataset.cweRbsel != null) { if (!t.value) return; const et = t.dataset.cweRbsel, ef = t.value; est.rb = { conds: [{ campo: 'etiqueta', op: 'igual', val: et }], liga: 'E', ef, v: /^(tema|esp)$/.test(ef) ? et : '' }; A.render(); const f = view.querySelector('.cwe-rb'); if (f) f.scrollIntoView({ block: 'nearest' }); return; }
      if (t.dataset.cweEsc) { const dg = t.dataset.p; est.dsg[dg] = { ...(est.dsg[dg] || {}), [t.dataset.cweEsc]: t.value }; A.render(); }
    });
    /* PDF da pauta arrastado para o quadro da etapa 2 */
    view.addEventListener('dragover', (ev) => { const z = ev.target.closest?.('.cwe-drop'); if (!z) return; ev.preventDefault(); z.classList.add('on'); });
    view.addEventListener('dragleave', (ev) => { const z = ev.target.closest?.('.cwe-drop'); if (z && !z.contains(ev.relatedTarget)) z.classList.remove('on'); });
    view.addEventListener('drop', (ev) => {
      const z = ev.target.closest?.('.cwe-drop'); if (!z) return; ev.preventDefault(); z.classList.remove('on');
      const f = [...(ev.dataTransfer?.files || [])].find((x) => /\.pdf$/i.test(x.name) || x.type === 'application/pdf');
      if (!f) { A.msg('Arraste o PDF do resumo do espelho de pauta.', true); return; }
      const inp = view.querySelector('#cwt-pdf-file'); if (!inp) return;
      try { const dt = new DataTransfer(); dt.items.add(f); inp.files = dt.files; inp.dispatchEvent(new Event('change', { bubbles: true })); } catch (er) { A.msg('Não foi possível ler o arquivo arrastado; use o botão Importar PDF.', true); }
    });
    view.addEventListener('input', (ev) => {
      if (ev.target.dataset.cweInput !== 'q') return;
      est.q = ev.target.value; est.take = 60; const pos = ev.target.selectionStart; A.render();
      const n = view.querySelector('[data-cwe-input="q"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} }
    });
    D.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && (est.cfg || est.exp)) { est.cfg = false; est.exp = false; A.render(); } });
  }

  function render(api) {
    A = api; const view = api.view; ligar(view);
    const ss = api.selectedSession();
    if (!ss) { view.innerHTML = `<div class="cwe"><div class="cwe-top"><div><span class="cwe-k">PAUTAS · SESSÃO</span><h1>Nenhuma sessão cadastrada</h1><p>Cadastre a data do julgamento para começar a seleção prévia.</p></div><div class="cwe-tools"><button type="button" class="pri" data-cwt="create-session">Cadastrar sessão</button></div></div></div>`; return; }
    if (est.ses !== ss.id) { est.ses = ss.id; est.etapa = 0; est.prep = 0; est.sel = ''; est.q = ''; est.filtro = 'all'; est.take = 60; est.desm = {}; est.c2 = {}; est.etqF = 'todos'; est.etqTake = 50; est.convAb = false; est.convG = new Set(); est.desF = 'todos'; est.desTake = 50; est.dsg = {}; est.cf = ''; est.nr = null; est.mEd = false; }
    const d = dados(ss);
    const corpo = [null, etapa1, etapa2, etapa3, etapa4, etapa5][d.cur](ss, d);
    view.innerHTML = `<div class="cwe">${cabecalho(ss, d)}${marcos(ss)}<div class="cwe-grid"><nav class="cwe-nav">${sessoes(ss)}<span class="cwe-k cwe-k2">ESTEIRA · ${e(A.br(ss.data))}</span>${esteira(d)}</nav><div class="cwe-main">${corpo}</div></div>${est.cfg ? config(ss, d) : ''}</div>`;
  }

  W.CMTEsteira = { render, estado: () => ({ ...est }) };
})(window, document);

</script>
<script>
/* ===== Pautas: ligação com o motor (acervo, sessões, regras, equipe) e comandos da página ===== */
(function (W, D) {
  'use strict';
  const $ = (s, r = D) => r.querySelector(s);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const digits = (v) => String(v || '').replace(/\D/g, '');
  const cnj = (v) => { const x = digits(v); return x.length === 20 ? x.replace(/^(\d{7})(\d{2})(\d{4})(\d)(\d{2})(\d{4})$/, '$1-$2.$3.$4.$5.$6') : String(v || ''); };
  const br = (iso) => /^\d{4}-\d{2}-\d{2}/.test(iso || '') ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : String(iso || '');
  const norm = (v) => String(v == null ? '' : v).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const view = $('#pt-view');
  const settings = { sessId: (() => { try { return sessionStorage.getItem('pt-ses') || ''; } catch (e) { return ''; } })() };
  const frame = D.getElementById('cmt-motor'); /* o mesmo motor da Triagem */
  const getMotor = () => { try { return frame.contentWindow; } catch (e) { return null; } };
  const getCore = () => getMotor()?.__painelCentralComponent || null;
  const getSes = () => getMotor()?.CMTSessao || null;
  function msg(t, bad) { if (!t) return; const b = $('#cwt-toast'); b.textContent = t; b.classList.toggle('bad', !!bad); b.hidden = false; clearTimeout(msg.t); msg.t = setTimeout(() => { b.hidden = true; }, 5500); }
  function sessionData() { return (getSes()?.estado()?.sessoes || []).slice().sort((a, b) => (a.data || '').localeCompare(b.data || '')); }
  function selectedSession() { const L = sessionData(); if (!L.length) return null; const c = L.find((x) => x.id === settings.sessId); if (c) return c; const h = new Date().toISOString().slice(0, 10); return L.find((x) => x.data >= h) || L[L.length - 1]; }
  function sesInfo(ss) { const s = getSes(); const of = (ss.itens || []).length > 0; let lines = []; try { lines = s?.linhas?.(ss.id, of ? 'pos' : 'pre') || []; } catch (e) { console.warn('[Pautas] sessão', e); } return { lines, total: lines.length, isOfficial: of }; }
  let pronto = false;
  function render() {
    if (!pronto) return;
    const ss = selectedSession(); settings.sessId = ss?.id || ''; try { sessionStorage.setItem('pt-ses', settings.sessId); } catch (e) {}
    W.CMTEsteira.render(api);
  }
  function abrirFicha(p) { if (digits(p).length !== 20) return msg('Número CNJ inválido para abrir a ficha.', true); try { const ss = selectedSession(); W.CMTProntuario.abrir(p, ss ? sesInfo(ss).lines.map((x) => digits(x.cnj)) : []); } catch (e) { msg('Falha ao abrir a ficha: ' + e.message, true); } }
  const api = { view, settings, getMotor, getCore, getSes, sessionData, selectedSession, sesInfo, openFicha: abrirFicha, msg, render, esc, br, cnj, digits, norm };
  W.CMTPautas = api;
  /* comandos de página (data-cwt), sessão (data-cwt-ses) e importação do PDF da pauta */
  view.addEventListener('click', (ev) => {
    const b = ev.target.closest?.('[data-cwt],[data-cwt-ses]'); if (!b) return;
    if (b.dataset.cwtSes) { ev.preventDefault(); settings.sessId = b.dataset.cwtSes; render(); if (scrollY > 240) scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const k = b.dataset.cwt; ev.preventDefault();
    if (k === 'ficha') abrirFicha(b.dataset.p);
    else if (k === 'import-pdf') $('#cwt-pdf-file', view)?.click();
    else if (k === 'create-session') { const d = W.prompt('Data do julgamento (AAAA-MM-DD):', new Date().toISOString().slice(0, 10)); if (d === null) return; const s = getSes(); if (!s?.novaSessao) return msg('Serviço de sessões indisponível.', true); const r = s.novaSessao(d.trim()); if (r.erro) return msg(r.erro, true); settings.sessId = r.id; render(); msg('Sessão cadastrada. Configure os marcos antes de importar a pauta.'); }
  });
  view.addEventListener('change', (ev) => {
    if (ev.target.id !== 'cwt-pdf-file' || !ev.target.files?.length) return;
    const f = ev.target.files[0], ss = selectedSession(), s = getSes(); ev.target.value = '';
    if (!ss || !s?.importar) return msg('Selecione uma sessão existente antes de importar.', true);
    msg('Importando o resumo da pauta…');
    Promise.resolve(s.importar(f, ss.id)).then((r) => {
      if (r && r.ok) { if (r.id) settings.sessId = r.id; render(); msg(r.n + ' processos importados na sessão de ' + br(r.data) + (r.fora ? ' · ' + r.fora + ' fora do acervo' : '') + '.'); }
      else { render(); msg((r && r.erro) || 'O PDF não trouxe itens da pauta.', !(r && r.cancelado)); }
    }).catch((e) => msg('Importação não concluída: ' + e.message, true));
  });
  /* ===== Gravação: automática alguns segundos depois de cada alteração; o botão grava na hora e mostra o estado ===== */
  const G = { ultima: '', erro: '', desde: 0, tentativa: 0, prox: 0 };
  async function gravarAgora(manual) {
    const s = getSes(); if (!s?.gravar) { if (manual) msg('O motor ainda está carregando.', true); return; }
    if (s.repoLido && !s.repoLido()) { if (manual) msg('Aguarde: o procs-muta ainda está sendo lido.', true); return; }
    if (!(s.pendentes?.() || []).length) { if (manual) msg('Tudo gravado no procs-muta.'); pend(); return; }
    G.gravando = true; pend();
    let r; try { r = await s.gravar(); } catch (e) { r = { ok: false, erro: e.message }; }
    G.gravando = false;
    if (r && r.ok) { G.erro = ''; G.tentativa = 0; G.desde = 0; G.ultima = new Date().toTimeString().slice(0, 5); if (manual || !r.nada) msg('Gravado no procs-muta' + (r.partes && r.partes.length ? ': ' + r.partes.join(', ') : '') + '.'); }
    else if (r && r.ocupado) { /* outra gravação em curso: tenta em seguida */ }
    else { G.erro = (r && r.erro) || 'falha desconhecida'; G.tentativa++; G.prox = Date.now() + Math.min(120000, 10000 * G.tentativa); msg('Não gravou no procs-muta: ' + G.erro + '. As alterações seguem neste navegador; nova tentativa automática em instantes.', true); }
    pend();
  }
  function pend() {
    const s = getSes(), b = $('#pt-gravar'); if (!s?.pendentes || !b) return;
    const n = s.pendentes().length;
    b.classList.toggle('pend', !!n); b.classList.toggle('erro', !!(n && G.erro));
    b.textContent = G.gravando || s.gravando?.() ? 'Gravando…' : n ? (G.erro ? 'Não gravado (' + n + ') · tentar' : 'Gravar (' + n + ')') : (G.ultima ? 'Gravado ' + G.ultima : 'Gravado');
    b.title = n ? 'Há ' + n + ' parte(s) com alteração ainda não gravada no procs-muta' + (G.erro ? ' · último erro: ' + G.erro : ' · grava sozinho em instantes') : 'Tudo gravado no procs-muta';
    /* gravação automática: 4 s depois da primeira alteração pendente (ou na hora da nova tentativa, após erro) */
    if (n && !G.gravando && pronto) { if (!G.desde) G.desde = Date.now(); if (Date.now() - G.desde > 4000 && Date.now() >= G.prox) gravarAgora(false); }
    if (!n) G.desde = 0;
  }
  api.gravarAgora = gravarAgora;
  $('#pt-gravar').addEventListener('click', () => { G.prox = 0; gravarAgora(true); });
  setInterval(pend, 1500);
  /* fechar a aba com alteração não gravada pede confirmação do navegador */
  W.addEventListener('beforeunload', (ev) => { const s = getSes(); if (s?.pendentes && s.pendentes().length) { ev.preventDefault(); ev.returnValue = ''; } });
  /* sem alteração pendente, relê o procs-muta de tempos em tempos: o que a equipe gravou na Ex Officio aparece aqui */
  setInterval(() => { const s = getSes(); if (!pronto || !s?.recarregar || G.gravando || (s.pendentes?.() || []).length || D.hidden) return; s.recarregar().then((ok) => { if (ok) render(); }).catch(() => {}); }, 120000);
  function abrirRegras(aba) { if (!W.CMTRegrasGerais) return msg('As regras gerais ainda estão carregando.', true); W.CMTRegrasGerais.abrir({ motor: getMotor, abrirMotor: W.__telaMotor, pagina: 'pautas', aba: aba || 'equipe' }); }
  W.__abrirRegras = abrirRegras;
  ($('#pt-regras') || { addEventListener() {} }).addEventListener('click', () => abrirRegras());
  ($('#pt-tema') || { addEventListener() {} }).addEventListener('click', () => { const dk = D.documentElement.getAttribute('data-theme') === 'dark'; if (dk) D.documentElement.removeAttribute('data-theme'); else D.documentElement.setAttribute('data-theme', 'dark'); try { localStorage.setItem('cmt-theme', dk ? 'light' : 'dark'); } catch (e) {} });
  /* pedido de token do GitHub (aparece dentro do motor): enquanto aberto, o motor fica à vista */
  /* o pedido de token é mostrado pela Triagem (body.tk) */
  /* espera o motor carregar o acervo e as sessões */
  let n = 0; const t = setInterval(() => {
    const w = getMotor();
    if (w && w.__painelCentralComponent && w.CMTSessao && w.CMTSessao.estado) { clearInterval(t); pronto = true; render(); return; }
    if (++n === 240) { clearInterval(t); $('#pt-carga').innerHTML = '<b>O motor de dados não carregou.</b><span>Recarregue a página. Se persistir, abra a Triagem e confira a conexão com o procs-muta.</span>'; }
  }, 250);
  /* o motor avisa mudanças (gravação, importação): a página redesenha */
  setInterval(() => { if (!pronto || D.body.classList.contains('cmt-ficha-on')) return; const s = getSes(); const sig = JSON.stringify((s?.estado()?.sessoes || []).map((x) => [x.id, (x.itens || []).length, (x.previa || []).length, x.publicada || ''])); if (sig !== render.sig) { render.sig = sig; if (!D.activeElement?.closest?.('#pt-view input,#pt-view select,#pt-view textarea')) render(); } }, 1500);
})(window, document);
</script>
