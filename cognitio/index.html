<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caput · Central do Gabinete</title>
<meta name="description" content="Caput · Central do Gabinete CMT: triagem, pautas, equipe, comunicação, inteligência, regras e administração.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/init/assets/css/95-ficha-unica.css">
<style>
:root{--bg:#fcfbf8;--p:#fbfaf5;--w:#fff;--tx:#203b39;--m:#5c6b67;--m2:#4f5a57;--b:#d8d3c6;--b2:#c8c3b6;--l:#e3ded2;--l2:#f0ece2;--v:#173f3d;--v2:#235a55;--g:#805b18;--g2:#a57829;--ok:#1f5a4a;--ok2:#3b7150;--az:#24506f;--az2:#4b7fa8;--r:#8a2f22;--r2:#e2b3aa;--cz:#8a948f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Figtree,system-ui,sans-serif}
a{color:var(--v2)}
button{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.k{font:500 10px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.btn{height:34px;padding:0 13px;border:1px solid var(--b2);background:var(--w);color:var(--tx);font:700 13px Figtree,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border-radius:6px;white-space:nowrap}
.btn:hover{border-color:var(--v2)}
.btn.pri{background:var(--v);border-color:var(--v);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:28px;font-size:12px;padding:0 10px}
.lk{border:0;background:transparent;color:var(--v2);font:600 12.5px Figtree,sans-serif;cursor:pointer;padding:0;white-space:nowrap}
.lk:hover{text-decoration:underline;text-underline-offset:3px}
.x{border:0;background:transparent;color:var(--m);font-size:15px;cursor:pointer;padding:0 0 0 4px;line-height:1}
.tg{display:inline-block;font:500 10px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--b);color:var(--m);border-radius:4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tg.d-pauta{border-color:#9cc0b4;color:var(--ok);background:#eaf3ef}
.tg.d-mono{border-color:#a9bfd0;color:var(--az);background:#eaf1f6}

    PR.sel=PR.sel.filter(function(n){return T[n];});
    var cor={};S.forEach(function(n,i){cor[n]=PAL[i%PAL.length];});
    var r1=function(v){return Math.round(v*10)/10;}, fmtv=function(v){return String(r1(v)).replace('.',',');};

    document.getElementById('pr-chips').innerHTML=S.map(function(n){var on=PR.sel.indexOf(n)>=0;return '<button type="button" class="prc'+(on?' on':'')+'" data-pr-s="'+esc(n)+'" aria-pressed="'+on+'" style="--c:'+cor[n]+'"><i></i>'+esc(n)+(cad(n)?'':' <small>(saiu)</small>')+' <b>'+fmtv(tot[n])+'</b></button>';}).join('');

    var var_=PR.sel.map(function(n){var a=soma(n,ant),u=soma(n,ult);return {n:n,a:a,u:u,d:a>=5&&u+a>=10?(u-a)/a:null};});  /* base pequena não vira tendência */
    var alta=var_.filter(function(v){return v.d!=null;}).sort(function(a,b){return b.d-a.d;})[0];
    var totalSel=PR.sel.reduce(function(a,n){return a+tot[n];},0);
    var unid=med==='p'?'pontos':(PAPEL==='c'?'correções':'minutas');
    document.getElementById('pr-kpis').innerHTML=[
      [fmtv(totalSel),unid+' dos selecionados'],
      [P.length,(PR.grupo==='mes'?'meses':'pautas')+' no período'],

    else if(!P.length||!PR.sel.length){box.innerHTML='<p class="vazio">Escolha ao menos um servidor.</p>';}
    else{
      var W=Math.max(640,box.clientWidth||900),H=360,m={t:16,r:20,b:34,l:44};
      var x=d3.scalePoint().domain(P).range([m.l,W-m.r]).padding(0.3);
      var ymax=d3.max(PR.sel,function(n){return d3.max(P,function(p){return (T[n]||{})[p]||0;});})||1;
      var y=d3.scaleLinear().domain([0,ymax]).nice().range([H-m.b,m.t]);
      var svg=d3.create('svg').attr('width',W).attr('height',H).attr('viewBox',[0,0,W,H]).attr('class','prg');
      svg.append('g').attr('class','gy').attr('transform','translate('+m.l+',0)').call(d3.axisLeft(y).ticks(5).tickSize(-(W-m.l-m.r)).tickFormat(function(v){return String(v).replace('.',',');})).call(function(g){g.select('.domain').remove();});
      svg.append('g').attr('class','gx').attr('transform','translate(0,'+(H-m.b)+')').call(d3.axisBottom(x).tickFormat(rotPer).tickSizeOuter(0));
      var fut=P.filter(function(p){return (PR.grupo==='mes'?p+'-01':p)>HOJE;});
      if(fut.length){var x0=x(fut[0])-x.step()/2;svg.append('rect').attr('class','fut').attr('x',x0).attr('y',m.t).attr('width',W-m.r-x0).attr('height',H-m.b-m.t);svg.append('text').attr('class','futl').attr('x',x0+6).attr('y',m.t+12).text('pautas futuras: designação, ainda em produção');}
      var line=d3.line().x(function(d){return x(d[0]);}).y(function(d){return y(d[1]);}).curve(d3.curveMonotoneX);
      PR.sel.forEach(function(n){var d=P.map(function(p){return [p,(T[n]||{})[p]||0];});
        svg.append('path').attr('class','ln').attr('d',line(d)).attr('stroke',cor[n]);
        svg.append('g').selectAll('circle').data(d).join('circle').attr('cx',function(v){return x(v[0]);}).attr('cy',function(v){return y(v[1]);}).attr('r',3).attr('fill',cor[n]);
        var u=d[d.length-1];svg.append('text').attr('class','lb').attr('x',x(u[0])+6).attr('y',y(u[1])).attr('dy','0.35em').attr('fill',cor[n]).text(n);});
      var guia=svg.append('line').attr('class','guia').attr('y1',m.t).attr('y2',H-m.b).style('display','none');
      var tip=document.getElementById('pr-tip')||Object.assign(document.createElement('div'),{id:'pr-tip',className:'prtip',hidden:true});
      svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',H-m.t-m.b).attr('fill','transparent')
        .on('mousemove',function(e){var mx=d3.pointer(e)[0],p=P.reduce(function(a,b){return Math.abs(x(b)-mx)<Math.abs(x(a)-mx)?b:a;});guia.attr('x1',x(p)).attr('x2',x(p)).style('display',null);
          var linhas=PR.sel.map(function(n){return [n,(T[n]||{})[p]||0];}).sort(function(a,b){return b[1]-a[1];});
          tip.innerHTML='<b>'+(PR.grupo==='mes'?rotPer(p):'Pauta de '+p.slice(8,10)+'/'+p.slice(5,7)+'/'+p.slice(0,4))+'</b>'+linhas.map(function(l){return '<span><i style="background:'+cor[l[0]]+'"></i>'+esc(l[0])+'<em>'+fmtv(l[1])+'</em></span>';}).join('')+'<small>Total da '+(PR.grupo==='mes'?'mês':'pauta')+': '+fmtv(nPer[p]||0)+'</small>';
          tip.hidden=false;var bx=box.getBoundingClientRect();tip.style.left=Math.min(bx.width-200,Math.max(0,x(p)+14-box.scrollLeft))+'px';tip.style.top='20px';})
        .on('mouseleave',function(){guia.style('display','none');tip.hidden=true;});
      box.innerHTML='';box.appendChild(svg.node());box.appendChild(tip);
    }
    // tabela
    var maxc=0;S.forEach(function(n){P.forEach(function(p){maxc=Math.max(maxc,(T[n]||{})[p]||0);});});
    var h='<thead><tr><th>Servidor</th>'+P.map(function(p){var f=(PR.grupo==='mes'?p+'-01':p)>HOJE;return '<th'+(f?' class="fu" title="pauta futura"':'')+'>'+esc(rotPer(p))+'</th>';}).join('')+'<th>Total</th><th title="média nas '+(PR.grupo==='mes'?'meses':'pautas')+' já realizadas desde a primeira em que aparece">Média</th><th title="3 últimas × 3 anteriores; só com base de 5 ou mais">Tendência</th><th>Participação</th></tr></thead><tbody>';
    var TT=Object.keys(tot).reduce(function(a,n){return a+tot[n];},0)||1;

      var a=soma(n,ant),u=soma(n,ult),d=a>=5&&u+a>=10?(u-a)/a:null,seta=d==null?'—':(d>0.1?'▲ ':d<-0.1?'▼ ':'● ')+(d>=0?'+':'')+Math.round(d*100)+'%';

    h+='<tr><td><b>Total</b></td>'+P.map(function(p){return '<td class="tot">'+fmtv(nPer[p]||0)+'</td>';}).join('')+'<td class="tot">'+fmtv(TT)+'</td><td></td><td></td><td></td></tr>';
    document.getElementById('pr-tab').innerHTML=h+'</tbody>';
    document.getElementById('pr-nota').textContent='Conta '+(PAPEL==='c'?'correções':'minutas')+' registradas por pauta'+(med==='p'?', em pontos: tipo (voto '+pv(PVOTO)+'; ED e agravo interno '+pv(PESO['Embargos de declaração'])+'; monocrática '+pv(PESO['Decisão monocrática'])+') × complexidade (Ω '+pv(PCX[1])+', Α '+pv(PCX[2])+', Σ '+pv(PCX[3])+'), pesos de apoio/regras/produtividade.json':'')+'. Complexidade informada: '+(function(){var c={1:0,2:0,3:0},inf=0;L.forEach(function(x){c[x.cx]=(c[x.cx]||0)+1;});var tot=L.length;return 'Ω '+nf(c[1])+' · Α '+nf(c[2])+' · Σ '+nf(c[3])+(c[2]+c[3]?'':' (nenhum processo com Α ou Σ marcado: sem nível, conta como Ω)');})()+'. É volume registrado, não produtividade aferida: não desconta férias, ausências nem complexidade, e cada processo conta uma vez, na pauta mais recente em que apareceu. '+(INCL_H?'Inclui o histórico de produção, que não comprova correção nem liberação.':'Sem o histórico, só há pautas de abril, outubro e novembro.')+' A pauta de 20/07 tem registro parcial.';
  }

  /* a matriz fica dentro de Produção (abaixo da evolução); no Caput, Perfis é a seção própria da Coordenação */
  function vista(v){if(v==='matriz')v='prod';if(v==='perfis'&&noCaput)v='mapa';['mapa','perfis','matriz','rank','prod'].forEach(function(k){var on=k===v||(v==='prod'&&k==='matriz');document.getElementById('v-'+k).hidden=!on;document.getElementById('tab-'+k).setAttribute('aria-selected',String(k===v));});if(v==='mapa')mapa();if(v==='rank')ranking();if(v==='prod')producao();}

      return '<div class="srvr'+(oculto(nm)?' fora':'')+'"><span><b>'+esc(nm)+'</b><small>'+(m?(m.cargo||(m.papel==='assessoria'?'Assessoria':'Equipe')):nm==='CM'?'Relator':'saiu do gabinete')+' · '+nf(nomes[nm])+' registros</small></span>'+
        '<button type="button" data-oc="'+esc(nm)+'" aria-pressed="'+oc+'"'+(OC.saiu&&!m&&nm!=='CM'?' disabled title="Oculto por “quem saiu do gabinete”"':'')+'>'+(oc?'Mostrar':'Ocultar')+'</button>'+
        (m?'<button type="button" data-dis="'+esc(nm)+'" aria-pressed="'+dis+'">'+(dis?'Religar':'Dissociar')+'</button>':'<span></span>')+'</div>';}).join('');
  }
  function redesenha(){aplicaPapel();PR.sel=null;FM.s='';painelServidores();lista();perfil();var vv=['mapa','rank','prod','matriz'].find(function(k){return !document.getElementById('v-'+k).hidden;});if(vv==='mapa')mapa();else if(vv==='matriz')matriz();else if(vv==='rank')ranking();else if(vv==='prod')producao();}
  function dissociar(nm){var m=membroDe(nm);if(!m)return;var vai=m.matriz!==false;if(vai)m.matriz=false;else delete m.matriz;
    if(VIVO){if(VIVO.CMTSessao.equipeMatriz&&VIVO.CMTSessao.equipeMatriz(m.nome,!vai))gravarJa(m.nome+(vai?' dissociado da matriz.':' de volta à matriz.'));else toast('O motor do Caput não aceitou a mudança.');}
    else{ED[m.nome]=Object.assign({},ED[m.nome]||{},{exp:m.exp,pref:m.pref,nao:m.nao,matriz:m.matriz});try{localStorage.setItem(LS,JSON.stringify(ED));}catch(e){}toast(m.nome+(vai?' dissociado nesta cópia.':' de volta à matriz.'));}
    redesenha();}
  function tudo(){painelServidores();lista();perfil();if(!document.getElementById('v-mapa').hidden)arvore();}
  function abrir(n){if(!n)return;if(noCaput){try{window.parent.postMessage({tipo:'cmt:comp-perfil',nome:n},location.origin);}catch(e){}return;}sel=n;vista('perfis');tudo();try{location.hash='perfis';}catch(e){}window.scrollTo(0,0);}

  document.addEventListener('click',function(e){
    var q=e.target.closest('[data-eqh]');if(q){OC.saiu=q.dataset.eqh==='atual';guardaOC();redesenha();return;}
    var t=e.target.closest('[data-oc],[data-dis],[data-aplicar],[data-pr-grupo],[data-pr-med],[data-pr-s],[data-pr-linha],[data-papel],[data-s],[data-vista],[data-tira],[data-mv],[data-acao],[data-dim],[data-fm],[data-arvk],[data-arv]');if(!t)return;
    var m=EQ.find(function(x){return x.nome===sel;});
    if(t.dataset.oc!=null){var nm=t.dataset.oc,i=OC.nomes.indexOf(nm);if(i>=0)OC.nomes.splice(i,1);else OC.nomes.push(nm);guardaOC();redesenha();return;}

    if(t.dataset.fm){if(t.dataset.fm==='*')FM={secao:'',ramo:'',s:'',tipo:''};else FM[t.dataset.fm]='';mapa();return;}
    if(t.dataset.arvk){ABERTO[t.dataset.arvk]=!ABERTO[t.dataset.arvk];arvore();return;}

    if(t.dataset.acao==='limpar'){MT.secao=MT.ramo=MT.tipo=MT.busca='';document.getElementById('f-busca').value='';matriz();return;}

      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('JSON copiado.');},function(){toast('O navegador não deixou copiar.');});else toast('O navegador não deixou copiar.');}
  });
  document.addEventListener('submit',function(e){var f=e.target.closest('[data-poe]');if(!f)return;e.preventDefault();var k=f.dataset.poe,i=f.querySelector('input'),v=(i.value||'').trim();if(!v)return;var m=EQ.find(function(x){return x.nome===sel;});if(!casa(m[k],v)){m[k]=(m[k]||[]).concat([v]);guardar(m);}tudo();var ni=document.getElementById('add-'+k);if(ni)ni.focus();});

  }
})();

<script>
(function () {
'use strict';
const D = document, W = window;
const $ = (s, r) => (r || D).querySelector(s), $$ = (s, r) => [...(r || D).querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nz = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const dg = (v) => String(v || '').replace(/\D/g, '');
const fmtCnj = (v) => { const d = dg(v); return d.length === 20 ? d.replace(/^(\d{7})(\d{2})(\d{4})(\d)(\d{2})(\d{4})$/, '$1-$2.$3.$4.$5.$6') : String(v || ''); };
const nf = (n) => Number(n || 0).toLocaleString('pt-BR');
const iso = (v) => { const s = String(v || '').trim(); let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (m) return m[1] + '-' + m[2] + '-' + m[3]; m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s); if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); return ''; };
const br = (i) => i ? i.slice(8, 10) + '/' + i.slice(5, 7) + '/' + i.slice(0, 4) : '';
const HOJE = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
const ANO = +HOJE.slice(0, 4);
const dias = (i) => i ? Math.floor((Date.parse(HOJE) - Date.parse(i)) / 864e5) : null;
const somaDias = (i, n) => { const d = new Date(Date.parse(i) + n * 864e5); return d.toISOString().slice(0, 10); };
const hhmm = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  function etapaEtq(ss, d) { if (!d.pauta) return `<section class="cwe-st"><header class="cwe-et"><p class="k">03 / tipo de julgamento, meta e MPF</p><h2>Etiquetagem</h2></header><p class="cwe-nota">As conversões de etiquetas se aplicam depois da pauta oficial.</p></section>`; return etapa3a(ss, d, ''); }

  function etapa3a(ss, d, tabs) {

      t.regras.forEach((r) => { const k = r.rot + (r.v ? ' · ' + r.v : ''); if (!grp.has(k)) grp.set(k, { rot: r.rot, v: r.v, rows: [], regras: new Set() }); const g = grp.get(k); g.rows.push({ item: p.item, cnj: p.cnj, e: t.e, id: r.nome || r.id }); g.regras.add(r.nome || r.id); }); }));

    const fl = est.etqF;
    const L = C.filter((p) => fl === 'todos' ? true : fl === 'dif' ? p.proposta?.dif.length : fl === 'conf' ? p.proposta?.man.length : fl === 'META' ? (p.c.metas || []).length : fl === 'ret' ? retirado(p.tarefa) : fl === 'sem' ? p.tags.some((t) => !t.ign && !t.regras.length) : tipo(p) === fl);
    const vis = L.slice(0, est.etqTake);

        ${ab ? `<table><thead><tr><th>Item</th><th>Processo</th><th>Etiqueta no PJe</th><th>Regra</th></tr></thead><tbody>${g.rows.map((r) => `<tr><td>${e(r.item || '')}</td><td class="cwe-mono">${e(A.cnj(r.cnj))}</td><td>${e(r.e)}</td><td class="m">${e(r.id)}</td></tr>`).join('')}</tbody></table>` : ''}</div>`; }).join('')}</section>` : '';
    const card = (p) => { const dg = A.digits(p.cnj), pr = p.proposta;

      const campos = [['APRECIAÇÃO', AP_T[ap] || ap, (p.porRegra || []).some((g) => ['ED', 'AgInt', 'JR', '1julg'].includes(g.ef)) ? 'pela regra' : p.c.porTarefa || tipoTarefa(p.tarefa) ? 'pela tarefa no PJe' : pr?.dif.includes('ap') ? 'pela etiqueta · a aplicar' : p.tipoManual ? 'fixado' : 'padrão'], ['TAREFA NO PJe', p.tarefa || '—', ''], ['META', (pr?.meta || p.meta || (p.c.metas || []).join(' ') || '—'), pr?.dif.includes('meta') ? 'a aplicar' : ''], ['MPF', pr?.mpf || p.mpf || (p.c.mpf || []).join(' · ') || '—', pr?.dif.includes('mpf') ? 'a aplicar' : ''], ['SUBASSUNTO', (p.c.tema || []).join(' · ') || '—', ''], ['ESPECIFICIDADE', (p.c.esp || []).join(' · ') || '—', '']];
      const nc = p.tags.filter((t) => t.regras.length && !t.ign).length;

      ${painel}
      <div class="cwe-2col"><div class="cwe-lst"><div class="cwe-lst-h"><span><b>${aplic} de ${C.filter((p) => p.proposta?.dif.length).length} com conversão a aplicar</b> · desmarque o processo que não deve receber as conversões</span><button type="button" class="pri" data-cwe="etq-aplicar" ${aplic ? '' : 'disabled'}>Aplicar as conversões</button>${fl === 'conf' ? `<button type="button" data-cwe="etq-forcar" title="Troca o valor fixado à mão pelo que as regras dão, nos processos marcados deste filtro">Substituir o fixado pelas regras (${C.filter((p) => p.proposta?.man.length && marcado('etq', A.digits(p.cnj))).length})</button>` : ''}<button type="button" class="cwe-lnk2" data-cwe="etapa" data-n="4">Próximo: designação e correção →</button></div>

  /* ===== regras de etiquetas por pauta: criadas aqui valem só nesta sessão (gravadas no arquivo dela); "Tornar padrão" leva às regras gerais ===== */
  function efeitosRb(d) { try { return d.s?.efeitosEtiqueta?.() || []; } catch (er) { return []; } }
  /* onde: 'top' = caixa "Regras desta pauta"; 'form' = só o formulário, aberto junto da etiqueta escolhida em "Sem regra" */
  function boxRegrasPauta(ss, d, onde = 'top') { let R = null; try { R = d.s?.regrasPauta?.(ss.id) || null; } catch (er) { R = null; } if (!R) return '';
