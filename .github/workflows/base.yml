# Base gabcmt (padrão 1.0): a cada gravação, valida a base, atualiza o manifesto e reconstrói o Vade Mecum.
# Commits feitos por este fluxo (GITHUB_TOKEN) não disparam o fluxo de novo.
name: Base gabcmt
on:
  push:
    branches: [main]
    paths:
      - "precedentes/precedentes.jsonl"
      - "precedentes/inteiros-teores/**"
      - "modelos/**"
      - "apoio/**"
      - "padrao/esquema.json"
      - "padrao/paradigmas.js"
      - "padrao/lia/Prompt_Minuta_CMT_v3.txt"
      - "padrao/lia/campos-prontuario.json"
      - "padrao/vocabulario.json"
      - "scripts/vocabulario/**"
      - "scripts/lia/**"
      - "gerar.py"
      # dados que a equipe grava pelo app não mudam o Vade Mecum nem o manifesto: sem commit do Base e sem nova publicação a cada clique
      - "!apoio/equipe*.json"
      - "!apoio/sustentacoes.json"
      - "!apoio/regras/**"
      - "!apoio/ex-officio/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: base-gabcmt
  cancel-in-progress: false
jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Valida e atualiza o manifesto
        run: python3 gerar.py
      - name: Vocabulário único nas telas (padrao/vocabulario.json)
        run: python3 scripts/vocabulario/aplicar.py
      - name: Prompts e catálogos da LIA (padrao/lia)
        run: python3 scripts/lia/gerar_prompts.py
      - name: Reconstrói o Vade Mecum (leitura e editor)
        run: python3 apoio/modus-operandi/fonte/build.py
      - name: Grava
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "base-gabcmt[bot]"
            git config user.email "base-gabcmt@users.noreply.github.com"
            git add -A
            git commit -m "Base: validação e manifesto (${GITHUB_SHA::7})"
            # alguém pode ter gravado no main durante a montagem: traz o que entrou e tenta de novo
            for i in 1 2 3 4; do git push && break; sleep $((i*3)); git pull --rebase -q origin main; done
          fi
