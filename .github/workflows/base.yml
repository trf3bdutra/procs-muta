# Base gabcmt (padrão 1.0): a cada gravação, valida a base e atualiza o manifesto.
# Commits feitos por este fluxo (GITHUB_TOKEN) não disparam o fluxo de novo.
name: Base gabcmt
on:
  push:
    branches: [main]
    paths: ["precedentes/precedentes.jsonl", "precedentes/inteiros-teores/**", "modelos/**", "apoio/**", "padrao/esquema.json", "padrao/paradigmas.js", "gerar.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: base-gabcmt
  cancel-in-progress: false
jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Valida e atualiza o manifesto
        run: python3 gerar.py
      - name: Grava
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "base-gabcmt[bot]"
            git config user.email "base-gabcmt@users.noreply.github.com"
            git add -A
            git commit -m "Base: validação e manifesto (${GITHUB_SHA::7})"
            git push
          fi
