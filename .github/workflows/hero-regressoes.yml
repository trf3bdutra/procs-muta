name: HERO · regressões
on:
  push:
    branches: [main]
    paths: ["extensao/**", "scripts/extensao/**", "apoio/ex-officio/tests/extensao*.test.js", "apoio/ex-officio/tests/prontuario-extensao.test.js", ".github/workflows/hero-regressoes.yml"]
  pull_request:
    branches: [main]
    paths: ["extensao/**", "scripts/extensao/**", "apoio/ex-officio/tests/extensao*.test.js", "apoio/ex-officio/tests/prontuario-extensao.test.js", ".github/workflows/hero-regressoes.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hero-regressoes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arquitetura:
      - name: Preservar diagnóstico arquitetura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-hero-arquitetura
          path: hero-arquitetura.log
          if-no-files-found: ignore

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Paridade da extensão, prévia e web
        run: node --test --test-reporter=tap --test-name-pattern="arquitetura HERO" apoio/ex-officio/tests/extensao-previa.test.js 2>&1 | tee hero-arquitetura.log
  codigo:
      - name: Preservar diagnóstico codigo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-hero-codigo
          path: hero-codigo.log
          if-no-files-found: ignore

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Testes de código e integração
        run: node --test --test-reporter=tap apoio/ex-officio/tests/extensao-muta.test.js apoio/ex-officio/tests/prontuario-extensao.test.js 2>&1 | tee hero-codigo.log
  navegador:
      - name: Preservar diagnóstico navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-hero-navegador
          path: hero-navegador.log
          if-no-files-found: ignore

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Instala Playwright
        run: |
          npm install --prefix /tmp/hero-ci --no-audit --no-fund playwright
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Comportamento no Chrome sem janela
        env:
          NODE_PATH: /tmp/hero-ci/node_modules
          HERO_TEST_REQUIRED: "1"
        run: node --test --test-reporter=tap apoio/ex-officio/tests/extensao-comportamento.test.js 2>&1 | tee hero-navegador.log
