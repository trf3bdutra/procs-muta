name: HERO · regressões
on:
  push:
    branches: [main]
    paths: ["extensao/**", "scripts/extensao/**", "apoio/ex-officio/tests/extensao*.test.js", "apoio/ex-officio/tests/prontuario-extensao.test.js", ".github/workflows/hero-regressoes.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hero-regressoes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codigo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Testes de código e integração
        run: node --test apoio/ex-officio/tests/extensao-muta.test.js apoio/ex-officio/tests/prontuario-extensao.test.js
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Instala Playwright
        run: |
          npm install --prefix /tmp/hero-ci --no-audit --no-fund playwright
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Comportamento no Chrome sem janela
        env:
          NODE_PATH: /tmp/hero-ci/node_modules
          HERO_TEST_REQUIRED: "1"
        run: node --test apoio/ex-officio/tests/extensao-comportamento.test.js
