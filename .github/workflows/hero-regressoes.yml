name: HERO · regressões
on:
  push:
    branches: [main]
    paths: ["extensao/**", "scripts/extensao/**", "apoio/ex-officio/tests/extensao*.test.js", "apoio/ex-officio/tests/prontuario-extensao.test.js", ".github/workflows/hero-regressoes.yml"]
  pull_request:
    branches: [main]
    paths: ["extensao/**", "scripts/extensao/**", "apoio/ex-officio/tests/extensao*.test.js", "apoio/ex-officio/tests/prontuario-extensao.test.js", ".github/workflows/hero-regressoes.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hero-regressoes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Um job só, em sequência (cada job cobra no mínimo um minuto; antes eram três).
  # Cada bloco roda mesmo que o anterior falhe, e o job falha se qualquer um falhar.
  regressoes:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Paridade da extensão, prévia e web
        run: set -o pipefail; node --test --test-reporter=tap --test-name-pattern="arquitetura HERO" apoio/ex-officio/tests/extensao-previa.test.js 2>&1 | tee hero-arquitetura.log
      - name: Testes de código e integração
        if: ${{ !cancelled() }}
        run: set -o pipefail; node --test --test-reporter=tap apoio/ex-officio/tests/extensao-muta.test.js apoio/ex-officio/tests/prontuario-extensao.test.js 2>&1 | tee hero-codigo.log
      - name: Instala Playwright
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix /tmp/hero-ci --no-audit --no-fund playwright
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Comportamento no Chrome sem janela
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: /tmp/hero-ci/node_modules
          HERO_TEST_REQUIRED: "1"
        run: set -o pipefail; node --test --test-reporter=tap apoio/ex-officio/tests/extensao-comportamento.test.js 2>&1 | tee hero-navegador.log
      - name: Preservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-hero
          path: hero-*.log
          if-no-files-found: ignore
