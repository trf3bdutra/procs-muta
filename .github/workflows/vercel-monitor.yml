# Publica o CMT-monitor no projeto trf3-muta da Vercel (trf3-muta.vercel.app).
# Vão para a Vercel: o Ab Initio modular (/monitor/: index.html, assets/ e motor/ juntos),
# ATENÇÃO: as Rotas do projeto no painel da Vercel valem antes deste vercel.json: "/", "/equipe" e "/hub" → /office/ (Ex Officio)
# e "/init" → /monitor/index.html, que agora só redireciona para /triagem/ (o Ab Initio antigo foi aposentado em 16/11/2026; o motor e os arquivos comuns da ficha e das regras gerais continuam em /init/motor e /init/assets).
# o Modus Operandi público (/modus/, com /compendio/ mantido), a Ex Officio (/equipe/), o painel de lotes (/lotes/) e as funções /api/* (login da equipe e leitura/gravação
# das pautas no procs-muta, com o GH_TOKEN guardado na Vercel), o editor do Modus Operandi (/editor/)
# e a Enciclopédia, servida só pelo /api/compendio a quem tem o modo avançado (apoio/acessos.json).
# Requer o segredo VERCEL_TOKEN (Settings › Secrets and variables › Actions).
name: CMT-monitor na Vercel
on:
  push:
    branches: [main]
    paths: ["monitor/**", "apoio/modus-operandi/modus-operandi.html", "apoio/modus-operandi/modus-operandi-editor.html", "apoio/enciclopedia.json", "apoio/ex-officio/**", ".github/workflows/vercel-monitor.yml", "padrao/acervo-fonte.js", "precedentes/jurisprudencia/**", "scripts/jurisprudencia/**"]
  # o commit do Base (feito com o GITHUB_TOKEN) não dispara outros workflows: publica de novo quando ele termina
  workflow_run:
    workflows: ["Base gabcmt"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  VERCEL_ORG_ID: team_nyqcxKFhethUSdW52fbXcWpZ
  VERCEL_PROJECT_ID: prj_RvxAJtVYRZd6rouWDzxewAyFE3bR
jobs:
  # Depois do Base: só publica se ele gravou alguma coisa (o commit "Base: validação e manifesto (<sha>)").
  # Sem isso, cada gravação da equipe virava uma publicação nova, que ainda cancelava a publicação em curso.
  verificar:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30
      - id: v
        env:
          EVENTO: ${{ github.event_name }}
          SHA_BASE: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENTO" != "workflow_run" ]; then echo "publicar=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git log -30 --format=%s | grep -qF "Base: validação e manifesto (${SHA_BASE:0:7})"; then echo "publicar=1" >> "$GITHUB_OUTPUT"
          else echo "publicar=0" >> "$GITHUB_OUTPUT"; echo "O Base não gravou nada: nada novo a publicar."; fi
  publicar:
    needs: verificar
    if: needs.verificar.outputs.publicar == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-monitor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Monta a pasta publicada
        run: |
          # O monitor antigo (cmt-monitor.html) está aposentado: fica no repositório, fora do site.
          mkdir -p site/public
          # O Modus Operandi atende em /modus/; /compendio/ continua servido para os links antigos.
          mkdir -p site/public/modus && cp apoio/modus-operandi/modus-operandi.html site/public/modus/index.html
          mkdir -p site/public/compendio && cp apoio/modus-operandi/modus-operandi.html site/public/compendio/index.html
          mkdir -p site/public/equipe site/api && cp apoio/ex-officio/index.html site/public/equipe/index.html && cp apoio/ex-officio/api/*.js site/api/
          # /cmt/ é o endereço próprio do painel do relator (mesma página da Ex Officio).
          mkdir -p site/public/cmt && cp apoio/ex-officio/index.html site/public/cmt/index.html
          mkdir -p site/public/editor && cp apoio/modus-operandi/modus-operandi-editor.html site/public/editor/index.html
          # Painel de lotes (/lotes/): página própria, fora da navegação do Ex Officio, com o mesmo login; dados por /api/lote
          mkdir -p site/public/lotes && cp apoio/ex-officio/lotes/index.html site/public/lotes/index.html
          cp apoio/enciclopedia.json site/api/_enciclopedia.json
          # A aplicação modular precisa manter todos os assets e o motor sob o mesmo prefixo.
          mkdir -p site/public/monitor
          cp monitor/index.html site/public/monitor/index.html
          cp -R monitor/assets monitor/motor site/public/monitor/
          # Triagem: /triagem/ e /pautas/ (rotas da Vercel → /monitor/triagem/index.html; /pautas/ abre na aba Pautas)
          mkdir -p site/public/monitor/triagem && cp monitor/triagem/index.html site/public/monitor/triagem/index.html
          # Módulo comum "Atualizar acervo fonte" (planilhas → carga → Action acervo-fonte.yml), para qualquer página do site
          mkdir -p site/public/padrao && cp padrao/acervo-fonte.js site/public/padrao/acervo-fonte.js
          # Série histórica do Relator (precedentes/jurisprudencia): índice e arquivos de busca em texto integral,
          # gerados aqui (não ficam no Git); lidos pelo ementário do Compendium em /jurisprudencia/
          python3 scripts/jurisprudencia/gerar_busca.py
          mkdir -p site/public/jurisprudencia && cp precedentes/jurisprudencia/indice.json.gz site/public/jurisprudencia/ && cp -R precedentes/jurisprudencia/busca site/public/jurisprudencia/
          printf '{"framework":null,"buildCommand":"","installCommand":"","outputDirectory":"public","functions":{"api/pauta.js":{"maxDuration":60},"api/editor.js":{"maxDuration":60},"api/acesso.js":{"maxDuration":60}},"redirects":[{"source":"/","destination":"/monitor/index.html","permanent":false},{"source":"/monitor","destination":"/monitor/index.html","permanent":false},{"source":"/monitor/","destination":"/monitor/index.html","permanent":false}]}\n' > site/vercel.json
      - name: Publica
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Falta o segredo VERCEL_TOKEN."; exit 1; }
          npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"
