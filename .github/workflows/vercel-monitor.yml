# Publica o CMT-monitor no projeto trf3-muta da Vercel (trf3-muta.vercel.app).
# Vão para a Vercel: o cmt-monitor.html (raiz), o CMT Compêndio público (/compendio/), a Pauta da equipe (/equipe/) e as funções
# /api/* (login da equipe e leitura/gravação das pautas no procs-muta, com o GH_TOKEN guardado na Vercel). O Compêndio avançado não é publicado.
# Requer o segredo VERCEL_TOKEN (Settings › Secrets and variables › Actions).
name: CMT-monitor na Vercel
on:
  push:
    branches: [main]
    paths: ["cmt-monitor.html", "apoio/cmt-compendio/cmt-compendio.html", "apoio/pauta-equipe/**", ".github/workflows/vercel-monitor.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-monitor
  cancel-in-progress: true
env:
  VERCEL_ORG_ID: team_nyqcxKFhethUSdW52fbXcWpZ
  VERCEL_PROJECT_ID: prj_RvxAJtVYRZd6rouWDzxewAyFE3bR
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Monta a pasta publicada
        run: |
          mkdir -p site/public
          cp cmt-monitor.html site/public/index.html
          mkdir -p site/public/compendio && cp apoio/cmt-compendio/cmt-compendio.html site/public/compendio/index.html
          mkdir -p site/public/equipe site/api && cp apoio/pauta-equipe/index.html site/public/equipe/index.html && cp apoio/pauta-equipe/api/*.js site/api/
          printf '{"framework":null,"buildCommand":"","installCommand":"","outputDirectory":"public","rewrites":[{"source":"/((?!api/|equipe|compendio).*)","destination":"/index.html"}]}\n' > site/vercel.json
      - name: Publica
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Falta o segredo VERCEL_TOKEN."; exit 1; }
          npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"
