# Publicação do Ab Initio em /monitor (integrações legadas preservadas).
# O layout atual / e /equipe permanece até migração autorizada do Hub.
name: CMT-monitor na Vercel
on:
  push:
    branches: [main]
    paths: ["cmt-monitor.html", "monitor/**", "apoio/cmt-compendio/cmt-compendio.html", "apoio/cmt-compendio/cmt-editor.html", "apoio/enciclopedia.json", "apoio/pauta-equipe/**", ".github/workflows/vercel-monitor.yml"]
  workflow_run:
    workflows: ["Base gabcmt"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-monitor
  cancel-in-progress: true
env:
  VERCEL_ORG_ID: team_nyqcxKFhethUSdW52fbXcWpZ
  VERCEL_PROJECT_ID: prj_RvxAJtVYRZd6rouWDzxewAyFE3bR
jobs:
  publicar:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Monta a pasta publicada
        run: |
          mkdir -p site/public
          cp cmt-monitor.html site/public/index.html
          mkdir -p site/public/compendio && cp apoio/cmt-compendio/cmt-compendio.html site/public/compendio/index.html
          mkdir -p site/public/equipe site/api && cp apoio/pauta-equipe/index.html site/public/equipe/index.html && cp apoio/pauta-equipe/api/*.js site/api/
          mkdir -p site/public/editor && cp apoio/cmt-compendio/cmt-editor.html site/public/editor/index.html
          cp apoio/enciclopedia.json site/api/_enciclopedia.json
          # A aplicação modular precisa manter todos os assets e o motor sob o mesmo prefixo.
          mkdir -p site/public/monitor
          cp monitor/index.html site/public/monitor/index.html
          cp -R monitor/assets monitor/motor site/public/monitor/
          printf '{"framework":null,"buildCommand":"","installCommand":"","outputDirectory":"public","functions":{"api/pauta.js":{"maxDuration":60},"api/editor.js":{"maxDuration":60}},"rewrites":[{"source":"/monitor","destination":"/monitor/index.html"},{"source":"/((?!api/|equipe|monitor|compendio|editor).*)","destination":"/index.html"}]}\n' > site/vercel.json
      - name: Publica
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Falta o segredo VERCEL_TOKEN."; exit 1; }
          npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"
