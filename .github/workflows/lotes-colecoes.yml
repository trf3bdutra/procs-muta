name: Lotes · coleções (escaninhos e seleção prévia)
# Mantém as coleções do Collectio em dia com o Caput (scripts/lotes/colecoes.py):
#  - escaninhos da triagem do Caput = lotes avulsos acervo/lotes/esc-<id>.json (migra o arquivo antigo, uma vez);
#  - Seleção prévia: um lote selecao-AAAA-MM-DD por sessão futura do calendário, com os processos marcados
#    "SELECIONADO PREVIAMENTE" para a data; quando a pauta oficial entra (acervo/sessoes/AAAA-MM-DD.json com itens),
#    o lote é arquivado e a sessão segue na coleção Pautas;
#  - acervo/lotes/colecoes.json, o índice das coleções.
# Mesmo grupo de concorrência do alimentar: um commit por vez na main. Se a main andar no meio, refaz (até 3 vezes).
on:
  push:
    branches: [main]
    paths:
      - "acervo/operacional.json"
      - "acervo/sessoes/**"
      - "acervo/triagem/escaninhos.json"
      - "scripts/lotes/colecoes.py"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lotes-alimentar
  cancel-in-progress: false
jobs:
  colecoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Atualizar coleções e gravar
        run: |
          git config user.name 'lotes-colecoes[bot]'
          git config user.email 'lotes-colecoes[bot]@users.noreply.github.com'
          for tentativa in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/lotes/colecoes.py
            if git diff --quiet -- acervo/lotes acervo/triagem && [ -z "$(git ls-files --others --exclude-standard acervo/lotes)" ]; then echo 'Coleções em dia.'; exit 0; fi
            git add acervo/lotes acervo/triagem/escaninhos.json
            git commit -q -m "Coleções: escaninhos (avulsos) e seleção prévia em dia com o Caput"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main andou; refazendo ($tentativa)"; sleep 5
          done
          exit 1
