name: Lotes · alimentar ficha e prontuários
# Cada edição das tabelas de um lote no Collectio (/amicus/collectio/) grava acervo/lotes/<id>.json na main.
# Este fluxo leva essas informações à ficha única (acervo/operacional.json) e aos cartões das pautas
# (acervo/sessoes/*.json) com scripts/lotes/alimentar.py. Campos do lote são sobrescritos; campos que a
# equipe já preencheu na ficha ou no prontuário não são tocados. Se a main andar no meio, refaz (até 3 vezes).
# Economia de minutos do GitHub Actions: em vez de um job por gravação (centenas por dia), roda de hora em hora
# das 06h às 23h (Cuiabá) e no botão; o mesmo job recalcula a matriz de minutas da equipe (antes, outro fluxo a cada gravação).
on:
  schedule:
    - cron: '7 10-23 * * *'
    - cron: '7 0-3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lotes-alimentar
  cancel-in-progress: false
jobs:
  alimentar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Alimentar, recalcular a matriz e gravar
        run: |
          git config user.name 'lotes-alimentar[bot]'
          git config user.email 'lotes-alimentar[bot]@users.noreply.github.com'
          for tentativa in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/lotes/alimentar.py
            python3 scripts/equipe/matriz_minutas.py --gravar
            if git diff --quiet -- acervo/operacional.json acervo/sessoes apoio/equipe-matriz.json; then echo 'Nada a gravar.'; exit 0; fi
            git add acervo/operacional.json acervo/sessoes apoio/equipe-matriz.json
            git commit -q -m "Lotes: ficha única, prontuários e matriz de minutas"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main andou; refazendo ($tentativa)"; sleep 5
          done
          exit 1
