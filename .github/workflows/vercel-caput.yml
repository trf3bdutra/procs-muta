# Publica o Caput no projeto trf3-muta da Vercel (trf3-muta.vercel.app).
# Caput (/caput/) é a central do gabinete: triagem, pautas, regras, equipe, chefia, comunicação e inteligência.\n# O motor legado permanece sob /init/ e /monitor/ para compatibilidade com integrações.
# ATENÇÃO: as Rotas do projeto no painel da Vercel valem antes deste vercel.json: "/", "/equipe" e "/hub" → /office/ (Ex Officio)
# e "/init" → /monitor/index.html, que agora só redireciona para /triagem/ (o Ab Initio antigo foi aposentado em 16/11/2026; o motor e os arquivos comuns da ficha e das regras gerais continuam em /init/motor e /init/assets).
# o Modus Operandi público (/modus/, com /compendio/ mantido), a Ex Officio (/equipe/), o Amicus Curiae · Index (/lote/) e as funções /api/* (login da equipe e leitura/gravação
# das pautas no procs-muta, com o GH_TOKEN guardado na Vercel), o editor do Modus Operandi (/editor/)
# e a Enciclopédia, servida só pelo /api/compendio a quem tem o modo avançado (apoio/acessos.json).
# Também publica o pacote da extensão Muta (/extensao/muta-pje.zip) e o ementário curado resumido que ela lê (/jurisprudencia/curados*.json.gz).
# Requer o segredo VERCEL_TOKEN (Settings › Secrets and variables › Actions).
name: Caput na Vercel
on:
  push:
    branches: [main]
    paths: ["caput/**", "cognitio/**", "apoio/modus-operandi/modus-operandi.html", "apoio/modus-operandi/modus-operandi-editor.html", "apoio/enciclopedia.json", "apoio/ex-officio/**", "apoio/amicus/**", "apoio/modus-operandi/fonte/**", "apoio/vade-mecum.json", "modelos/modelos.json", "modelos/paragrafos.json", "apoio/repertorio-normativo-complemento.json", "scripts/repertorio/**", ".github/workflows/vercel-caput.yml", "padrao/acervo-fonte.js", "padrao/favicon/**", "padrao/loading/**", "precedentes/jurisprudencia/**", "precedentes/collegium/**", "apoio/modus-operandi/collegium.html", "scripts/jurisprudencia/**", "precedentes/precedentes.jsonl", "precedentes/inteiros-teores/**", "extensao/**", "scripts/extensao/**", "!apoio/ex-officio/tests/**", "!cognitio/tests/**"]
  # o commit do Base (feito com o GITHUB_TOKEN) não dispara outros workflows: publica de novo quando ele termina
  workflow_run:
    workflows: ["Base gabcmt"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'brndutras-projects' }}
  VERCEL_NAME: ${{ vars.VERCEL_NAME || 'gabinete-cmt' }}
jobs:
  # Um job só (cada job cobra no mínimo um minuto). Depois do Base: só publica se ele gravou alguma coisa (o commit "Base: validação e manifesto (<sha>)").
  # Sem isso, cada gravação da equipe virava uma publicação nova, que ainda cancelava a publicação em curso.
  publicar:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: vercel-caput
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 30
      - id: v
        env:
          EVENTO: ${{ github.event_name }}
          SHA_BASE: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENTO" != "workflow_run" ]; then echo "publicar=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git log -30 --format=%s | grep -qF "Base: validação e manifesto (${SHA_BASE:0:7})"; then echo "publicar=1" >> "$GITHUB_OUTPUT"
          else echo "publicar=0" >> "$GITHUB_OUTPUT"; echo "O Base não gravou nada: nada novo a publicar."; fi
      - uses: actions/setup-node@v5
        if: steps.v.outputs.publicar == '1'
        with:
          node-version: "20"
      # Trava do CORTEX: se lotes/previa.html perder o que os testes cobrem (por exemplo, gravado por cima com uma cópia
      # antiga, como em 3e4f452), a publicação para aqui e o site continua na versão anterior.
      - name: Confere o CORTEX
        if: steps.v.outputs.publicar == '1'
        working-directory: apoio/ex-officio
        run: node --test tests/collectio-previa.test.js tests/collectio-matriz.test.js
      - name: Gerar Editorial e Compendium da ficha atual
        if: steps.v.outputs.publicar == '1'
        run: |
          python3 scripts/repertorio/test_atualizar_normas.py
          python3 apoio/modus-operandi/fonte/build.py
      - name: Validar prontuário ampliado e montagem da prévia
        if: steps.v.outputs.publicar == '1'
        run: node --test apoio/ex-officio/tests/prontuario-ampliado.test.js apoio/ex-officio/tests/extensao-previa.test.js apoio/ex-officio/tests/abertura-editorial.test.js apoio/ex-officio/tests/compendio-contrato-redacional.test.js apoio/ex-officio/tests/breviario-canhoto.test.js
      - name: Validar Cognitio e a sessão do Office
        if: steps.v.outputs.publicar == '1'
        run: node --test cognitio/tests/cognitio.test.js apoio/ex-officio/tests/ementario-prontuario.test.js apoio/ex-officio/tests/mural-command.test.js apoio/ex-officio/tests/ementario-busca.test.js
      - name: Monta a pasta publicada
        if: steps.v.outputs.publicar == '1'
        run: |
          # O monitor antigo (cmt-monitor.html) está aposentado: fica no repositório, fora do site.
          mkdir -p site/public
          # O Modus Operandi atende em /modus/; /compendio/ continua servido para os links antigos.
          mkdir -p site/public/modus && cp apoio/modus-operandi/modus-operandi.html site/public/modus/index.html
          mkdir -p site/public/compendio && cp apoio/modus-operandi/modus-operandi.html site/public/compendio/index.html
          mkdir -p site/public/equipe site/public/exofficio site/api
          cp apoio/ex-officio/index.html site/public/equipe/index.html
          cp apoio/ex-officio/index.html site/public/exofficio/index.html
          cp apoio/ex-officio/api/*.js site/api/
          # Referenciais compartilham uma função; os URLs antigos e suas autorizações continuam iguais.
          for r in compendio rapidas impedimentos; do mv "site/api/$r.js" "site/api/_$r.js"; done
          cat > site/api/referencias.js <<'JS'
          const handlers = Object.freeze({compendio: require('./_compendio'), rapidas: require('./_rapidas'), impedimentos: require('./_impedimentos')});
          module.exports = (req, res) => {
            const k = req.query && req.query.recurso;
            if (typeof k !== 'string' || !Object.prototype.hasOwnProperty.call(handlers, k)) return res.status(404).json({erro:'Referência não encontrada'});
            return handlers[k](req, res);
          };
          JS
          node --check site/api/referencias.js
          n=$(find site/api -maxdepth 1 -type f -name '*.js' ! -name '_*' | wc -l)
          echo "Funções de API publicáveis: $n"
          test "$n" -le 12 || { echo "Mais de 12 funções: agrupe as rotas antes de publicar."; exit 1; }
          # /cmt/ é o endereço próprio do painel do relator (mesma página da Ex Officio).
          mkdir -p site/public/cmt && cp apoio/ex-officio/index.html site/public/cmt/index.html
          mkdir -p site/public/editor && cp apoio/modus-operandi/modus-operandi-editor.html site/public/editor/index.html
          # Amicus Curiae: CORTEX e Compendium são ferramentas irmãs do projeto.
          # CORTEX: /amicus/cortex/ (Geral) e /amicus/cortex/cg/ (controle e gestão). /cmt/ e /gc/ ficam só para links antigos:
          # a própria página troca o endereço para o canônico (o Desembargador vê a página geral com o que foi liberado para ele).
          mkdir -p site/public/amicus/cortex/cg site/public/amicus/cortex/cmt site/public/amicus/cortex/gc site/public/amicus/compendium
          cp apoio/amicus/index.html site/public/amicus/index.html
          # /amicus/cortex/ é o CORTEX novo (fluxo da minuta, matriz construível, versões entre coleções); o anterior segue em
          # /amicus/cortex/classico/ (registrar versão, conformidade, Compendium e a visão do Relator) e é a página da gestão (cg)
          cp apoio/ex-officio/lotes/previa.html site/public/amicus/cortex/index.html
          mkdir -p site/public/amicus/collectio && cp apoio/modus-operandi/collectio.html site/public/amicus/collectio/index.html
          mkdir -p site/public/amicus/cortex/classico && cp apoio/ex-officio/lotes/index.html site/public/amicus/cortex/classico/index.html
          cp apoio/ex-officio/lotes/index.html site/public/amicus/cortex/cg/index.html
          cp apoio/ex-officio/lotes/index.html site/public/amicus/cortex/cmt/index.html
          cp apoio/ex-officio/lotes/index.html site/public/amicus/cortex/gc/index.html
          # motor da conformidade da extensão Muta, usado também pelas versões da minuta no CORTEX
          cp extensao/conformidade-motor.js site/public/amicus/cortex/conformidade-motor.js
          # ponte para registrar no CORTEX as minutas lidas no editor do PJe (janela aberta pelo PJe, com código da importação)
          cp apoio/ex-officio/lotes/pje.html site/public/amicus/cortex/pje.html
          # prévia do CORTEX melhorado (/amicus/cortex/previa/): página só de leitura, com os mesmos dados e o mesmo login
          mkdir -p site/public/amicus/cortex/previa && cp apoio/ex-officio/lotes/previa.html site/public/amicus/cortex/previa/index.html
          cp apoio/modus-operandi/modus-operandi.html site/public/amicus/compendium/index.html
          # Collegium (/amicus/collegium/): o ementário do Compendium com os julgados dos demais gabinetes da Turma Regional de MS
          mkdir -p site/public/amicus/collegium && cp apoio/modus-operandi/collegium.html site/public/amicus/collegium/index.html
          cp apoio/enciclopedia.json site/api/_enciclopedia.json
          # A aplicação modular precisa manter todos os assets e o motor sob o mesmo prefixo.
          mkdir -p site/public/monitor
          cp caput/index.html site/public/monitor/index.html
          # Recursos canônicos do Caput; aliases antigos apenas para consumidores ainda não migrados.
          mkdir -p site/public/caput
          cp -R caput/assets caput/motor site/public/caput/
          cp -R caput/assets caput/motor site/public/monitor/
          # Caput: interface única para inteligência, triagem, pautas, coordenação, comunicação e chefia.
          # Usa os mesmos scripts, APIs e motor da Triagem; as URLs antigas permanecem compatíveis.
          # Uma página só em /caput/; /caput/triagem, /caput/pautas, /caput/coordenacao, /caput/comunicacao, /caput/inteligencia,
          # /caput/chefia e /caput/escaninhos[/<id>] são reescritas para ela (vercel.json › rewrites) e a aba sai do caminho.
          mkdir -p site/public/caput site/public/monitor/triagem
          cp caput/triagem/index.html site/public/caput/index.html
          mkdir -p site/public/cognitio && cp cognitio/index.html cognitio/auth.js site/public/cognitio/
          # Cabeçalho compartilhado: Cognitio, CORTEX, Compendium, Collegium, editor e portal Amicus.
          python3 apoio/amicus/references.py site/public/amicus/index.html
          python3 apoio/amicus/header.py site/public
          cp caput/triagem/index.html site/public/monitor/triagem/index.html
          # Competências da equipe: moldura da Coordenação do Caput (lê e grava pelo motor do Caput)
          mkdir -p site/public/caput/competencias && cp caput/competencias/index.html site/public/caput/competencias/index.html
          # Mesa de designação da pauta: moldura sobre Pautas › Preparar › B do Caput (lê e grava pelo motor do Caput)
          mkdir -p site/public/caput/designacao && cp caput/designacao/index.html site/public/caput/designacao/index.html
          mkdir -p site/public/caput/etiquetas && cp caput/etiquetas/index.html site/public/caput/etiquetas/index.html
          # Módulo comum "Atualizar acervo fonte" (planilhas → carga → Action acervo-fonte.yml), para qualquer página do site
          mkdir -p site/public/padrao && cp padrao/acervo-fonte.js site/public/padrao/acervo-fonte.js
          # Série histórica do Relator (precedentes/jurisprudencia): índice e arquivos de busca em texto integral,
          # gerados aqui (não ficam no Git); lidos pelo ementário do Compendium em /jurisprudencia/
          python3 scripts/jurisprudencia/gerar_busca.py
          mkdir -p site/public/jurisprudencia && cp precedentes/jurisprudencia/indice.json.gz site/public/jurisprudencia/ && cp -R precedentes/jurisprudencia/busca site/public/jurisprudencia/
          # Ementário curado resumido (curados.json.gz e curados-texto.json.gz), lido pela extensão Muta junto com a série histórica
          python3 scripts/jurisprudencia/gerar_curados.py --saida site/public/jurisprudencia
          # Collegium: índice e busca dos julgados dos Gabs. B e C da Turma Regional de MS (precedentes/collegium), em /collegium/
          python3 scripts/jurisprudencia/gerar_busca.py --pasta precedentes/collegium
          # o Collegium publica a Turma inteira: os Gabs. B e C mais a série do Relator (índice, resumo e busca unificados)
          python3 scripts/jurisprudencia/collegium_turma.py --saida site/public/collegium/
          # Extensão Muta (painel lateral ao lado do PJe): pacote para instalar sem compactação, em /extensao/muta-pje.zip
          mkdir -p site/public/extensao && python3 scripts/extensao/pacote.py --saida site/public/extensao/muta-pje.zip  # painel lateral = prontuário universal (fonte: scripts/extensao/previa/)
          # Versão publicada: a extensão compara com a instalada e avisa que há atualização (atualizar-muta.cmd baixa e troca os arquivos)
          node -e "const v=require('./extensao/manifest.json').version;require('fs').writeFileSync('site/public/extensao/versao.json',JSON.stringify({versao:v,zip:'/extensao/muta-pje.zip'}))"
          # Dados da extensão (comparativos e conformidade): modelos, minutas-matriz, matriz do 28,86%, parágrafos-padrão e regras de redação
          python3 scripts/extensao/dados.py --saida site/public/extensao/dados
          # Prévia do painel da extensão (/extensao/previa/): o painel de verdade, com os mesmos arquivos, ao lado de um PJe simulado (nada é gravado)
          python3 scripts/extensao/previa.py --saida site/public/extensao/previa
          printf '{"framework":null,"buildCommand":"","installCommand":"","outputDirectory":"public","functions":{"api/pauta.js":{"maxDuration":60},"api/editor.js":{"maxDuration":60},"api/acesso.js":{"maxDuration":60}},"rewrites":[{"source":"/api/compendio","destination":"/api/referencias?recurso=compendio"},{"source":"/api/rapidas","destination":"/api/referencias?recurso=rapidas"},{"source":"/api/impedimentos","destination":"/api/referencias?recurso=impedimentos"},{"source":"/caput/:aba(triagem|pautas|coordenacao|comunicacao|inteligencia|chefia|escaninhos)","destination":"/caput/index.html"},{"source":"/caput/escaninhos/:id","destination":"/caput/index.html"}],"redirects":[{"source":"/amicus/collectio/cg","destination":"/amicus/cortex/cg/","permanent":false},{"source":"/amicus/collectio/cg/","destination":"/amicus/cortex/cg/","permanent":false},{"source":"/amicus/collectio/gc","destination":"/amicus/cortex/gc/","permanent":false},{"source":"/amicus/collectio/gc/","destination":"/amicus/cortex/gc/","permanent":false},{"source":"/amicus/collectio/cmt","destination":"/amicus/cortex/cmt/","permanent":false},{"source":"/amicus/collectio/cmt/","destination":"/amicus/cortex/cmt/","permanent":false},{"source":"/amicus/collectio/classico","destination":"/amicus/cortex/classico/","permanent":false},{"source":"/amicus/collectio/classico/","destination":"/amicus/cortex/classico/","permanent":false},{"source":"/amicus/collectio/previa","destination":"/amicus/cortex/previa/","permanent":false},{"source":"/amicus/collectio/previa/","destination":"/amicus/cortex/previa/","permanent":false},{"source":"/amicus/collectio/pje.html","destination":"/amicus/cortex/pje.html","permanent":false},{"source":"/amicus/collectio/conformidade-motor.js","destination":"/amicus/cortex/conformidade-motor.js","permanent":false},{"source":"/","destination":"/monitor/index.html","permanent":false},{"source":"/monitor","destination":"/monitor/index.html","permanent":false},{"source":"/monitor/","destination":"/monitor/index.html","permanent":false},{"source":"/index","destination":"/amicus/cortex/","permanent":true},{"source":"/index/","destination":"/amicus/cortex/","permanent":true},{"source":"/index/cm","destination":"/amicus/cortex/","permanent":true},{"source":"/index/cm/","destination":"/amicus/cortex/","permanent":true},{"source":"/index/cmt","destination":"/amicus/cortex/","permanent":true},{"source":"/index/cmt/","destination":"/amicus/cortex/","permanent":true},{"source":"/index/cg","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/index/cg/","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/index/gc","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/index/gc/","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/gc","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/gc/","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/lotes","destination":"/amicus/cortex/","permanent":true},{"source":"/lotes/","destination":"/amicus/cortex/","permanent":true},{"source":"/cmt/lotes","destination":"/amicus/cortex/","permanent":true},{"source":"/cmt/lotes/","destination":"/amicus/cortex/","permanent":true},{"source":"/cg/lotes","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/cg/lotes/","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/lote","destination":"/amicus/cortex/","permanent":true},{"source":"/lote/","destination":"/amicus/cortex/","permanent":true},{"source":"/lote/cmt","destination":"/amicus/cortex/","permanent":true},{"source":"/lote/cmt/","destination":"/amicus/cortex/","permanent":true},{"source":"/lote/cg","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/lote/cg/","destination":"/amicus/cortex/cg/","permanent":true},{"source":"/amicus/cognitio","destination":"/cognitio/","permanent":false},{"source":"/collegium","destination":"/amicus/collegium/","permanent":false},{"source":"/collegium/","destination":"/amicus/collegium/","permanent":false},{"source":"/amicus/cognitio/","destination":"/cognitio/","permanent":false},{"source":"/amicus-curiae","destination":"/amicus/","permanent":true},{"source":"/amicus-curiae/","destination":"/amicus/","permanent":true},{"source":"/amicus/index","destination":"/amicus/cortex/","permanent":false},{"source":"/amicus/index/","destination":"/amicus/cortex/","permanent":false},{"source":"/amicus/index/cmt","destination":"/amicus/cortex/","permanent":false},{"source":"/amicus/index/cmt/","destination":"/amicus/cortex/","permanent":false},{"source":"/amicus/index/cg","destination":"/amicus/cortex/cg/","permanent":false},{"source":"/amicus/index/cg/","destination":"/amicus/cortex/cg/","permanent":false},{"source":"/amicus/index/gc","destination":"/amicus/cortex/cg/","permanent":false},{"source":"/amicus/index/gc/","destination":"/amicus/cortex/cg/","permanent":false},{"source":"/office","destination":"/exofficio/","permanent":false},{"source":"/office/","destination":"/exofficio/","permanent":false},{"source":"/hub","destination":"/exofficio/","permanent":false},{"source":"/hub/","destination":"/exofficio/","permanent":false},{"source":"/equipe","destination":"/exofficio/","permanent":false},{"source":"/equipe/","destination":"/exofficio/","permanent":false},{"source":"/triagem","destination":"/caput/triagem","permanent":false},{"source":"/triagem/","destination":"/caput/triagem","permanent":false},{"source":"/pautas","destination":"/caput/pautas","permanent":false},{"source":"/pautas/","destination":"/caput/pautas","permanent":false},{"source":"/caput/:aba(triagem|pautas|coordenacao|comunicacao|inteligencia|chefia|escaninhos)/","destination":"/caput/:aba","permanent":false},{"source":"/init","destination":"/caput/","permanent":false},{"source":"/init/","destination":"/caput/","permanent":false}]}\n' > site/vercel.json
      - name: Instala identidade visual GAB.18810
        if: steps.v.outputs.publicar == '1'
        run: |
          python3 -m pip install cairosvg
          python3 padrao/favicon/publicar-identidade.py site/public
      - name: Publica
        if: steps.v.outputs.publicar == '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Falta o segredo VERCEL_TOKEN."; exit 1; }
          # A equipe Pro atual foi confirmada no painel da Vercel. Não publique em outra equipe por aproximação.
          API=https://api.vercel.com; H="Authorization: Bearer $VERCEL_TOKEN"
          SCOPE="${VERCEL_SCOPE:-brndutras-projects}"
          NAME="${VERCEL_NAME:-gabinete-cmt}"
          HTTP=$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' -H "$H" "$API/v9/projects/$NAME?slug=$SCOPE")
          if [ "$HTTP" != 200 ]; then
            echo "::error::Vercel HTTP $HTTP ao consultar $SCOPE/$NAME. Verifique se VERCEL_TOKEN tem acesso à equipe Pro atual."
            exit 1
          fi
          ORG=$(jq -er '.accountId // .teamId' /tmp/vercel-project.json)
          PRJ=$(jq -er '.id' /tmp/vercel-project.json)
          # Confirma domínio antes de enviar qualquer arquivo ao projeto.
          curl -fsS -H "$H" "$API/v9/projects/$PRJ/domains?teamId=$ORG" | jq -e 'any(.domains[]?; .name == "gabinete-cmt.com" or .name == "www.gabinete-cmt.com")' >/dev/null || { echo "::error::O projeto não possui o domínio institucional esperado."; exit 1; }
          echo "Publicando no projeto $NAME da equipe $SCOPE"
          VERCEL_ORG_ID="$ORG" VERCEL_PROJECT_ID="$PRJ" npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"
