# Publica o Caput no projeto trf3-muta da Vercel (trf3-muta.vercel.app).
# Caput (/caput/) é a central do gabinete: triagem, pautas, regras, equipe, chefia, comunicação e inteligência.\n# O motor legado permanece sob /init/ e /monitor/ para compatibilidade com integrações.
# ATENÇÃO: as Rotas do projeto no painel da Vercel valem antes deste vercel.json: "/", "/equipe" e "/hub" → /office/ (Ex Officio)
# e "/init" → /monitor/index.html, que agora só redireciona para /triagem/ (o Ab Initio antigo foi aposentado em 16/11/2026; o motor e os arquivos comuns da ficha e das regras gerais continuam em /init/motor e /init/assets).
# o Modus Operandi público (/modus/, com /compendio/ mantido), a Ex Officio (/equipe/), o Amicus Curiae · Index (/lote/) e as funções /api/* (login da equipe e leitura/gravação
# das pautas no procs-muta, com o GH_TOKEN guardado na Vercel), o editor do Modus Operandi (/editor/)
# e a Enciclopédia, servida só pelo /api/compendio a quem tem o modo avançado (apoio/acessos.json).
# Também publica o pacote da extensão Muta (/extensao/muta-pje.zip) e o ementário curado resumido que ela lê (/jurisprudencia/curados*.json.gz).
# Requer o segredo VERCEL_TOKEN (Settings › Secrets and variables › Actions).
name: Caput na Vercel
on:
  push:
    branches: [main]
    paths: ["caput/**", "apoio/modus-operandi/modus-operandi.html", "apoio/modus-operandi/modus-operandi-editor.html", "apoio/enciclopedia.json", "apoio/ex-officio/**", "apoio/amicus/**", ".github/workflows/vercel-caput.yml", "padrao/acervo-fonte.js", "precedentes/jurisprudencia/**", "scripts/jurisprudencia/**", "precedentes/precedentes.jsonl", "precedentes/inteiros-teores/**", "extensao/**", "scripts/extensao/**"]
  # o commit do Base (feito com o GITHUB_TOKEN) não dispara outros workflows: publica de novo quando ele termina
  workflow_run:
    workflows: ["Base gabcmt"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  VERCEL_ORG_ID: team_qybhS0eH5w9TNuZIApQncd9L
  VERCEL_PROJECT_ID: prj_RvxAJtVYRZd6rouWDzxewAyFE3bR
jobs:
  # Um job só (cada job cobra no mínimo um minuto). Depois do Base: só publica se ele gravou alguma coisa (o commit "Base: validação e manifesto (<sha>)").
  # Sem isso, cada gravação da equipe virava uma publicação nova, que ainda cancelava a publicação em curso.
  publicar:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: vercel-caput
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30
      - id: v
        env:
          EVENTO: ${{ github.event_name }}
          SHA_BASE: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENTO" != "workflow_run" ]; then echo "publicar=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git log -30 --format=%s | grep -qF "Base: validação e manifesto (${SHA_BASE:0:7})"; then echo "publicar=1" >> "$GITHUB_OUTPUT"
          else echo "publicar=0" >> "$GITHUB_OUTPUT"; echo "O Base não gravou nada: nada novo a publicar."; fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.publicar == '1'
        with:
          node-version: "20"
      # Trava do Collectio: se lotes/previa.html perder o que os testes cobrem (por exemplo, gravado por cima com uma cópia
      # antiga, como em 3e4f452), a publicação para aqui e o site continua na versão anterior.
      - name: Confere o Collectio
        if: steps.v.outputs.publicar == '1'
        working-directory: apoio/ex-officio
        run: node --test tests/collectio-previa.test.js tests/collectio-matriz.test.js
      - name: Monta a pasta publicada
        if: steps.v.outputs.publicar == '1'
        run: |
          # O monitor antigo (cmt-monitor.html) está aposentado: fica no repositório, fora do site.
          mkdir -p site/public
          # O Modus Operandi atende em /modus/; /compendio/ continua servido para os links antigos.
          mkdir -p site/public/modus && cp apoio/modus-operandi/modus-operandi.html site/public/modus/index.html
          mkdir -p site/public/compendio && cp apoio/modus-operandi/modus-operandi.html site/public/compendio/index.html
          mkdir -p site/public/equipe site/public/exofficio site/api
          cp apoio/ex-officio/index.html site/public/equipe/index.html
          cp apoio/ex-officio/index.html site/public/exofficio/index.html
          cp apoio/ex-officio/api/*.js site/api/
          # /cmt/ é o endereço próprio do painel do relator (mesma página da Ex Officio).
          mkdir -p site/public/cmt && cp apoio/ex-officio/index.html site/public/cmt/index.html
          mkdir -p site/public/editor && cp apoio/modus-operandi/modus-operandi-editor.html site/public/editor/index.html
          # Amicus Curiae: Collectio e Compendium são ferramentas irmãs do projeto.
          # Collectio: /amicus/collectio/ (Geral) e /amicus/collectio/cg/ (controle e gestão). /cmt/ e /gc/ ficam só para links antigos:
          # a própria página troca o endereço para o canônico (o Desembargador vê a página geral com o que foi liberado para ele).
          mkdir -p site/public/amicus/collectio/cg site/public/amicus/collectio/cmt site/public/amicus/collectio/gc site/public/amicus/compendium
          cp apoio/amicus/index.html site/public/amicus/index.html
          # /amicus/collectio/ é o Collectio novo (fluxo da minuta, matriz construível, versões entre coleções); o anterior segue em
          # /amicus/collectio/classico/ (registrar versão, conformidade, Compendium e a visão do Relator) e é a página da gestão (cg)
          cp apoio/ex-officio/lotes/previa.html site/public/amicus/collectio/index.html
          mkdir -p site/public/amicus/collectio/classico && cp apoio/ex-officio/lotes/index.html site/public/amicus/collectio/classico/index.html
          cp apoio/ex-officio/lotes/index.html site/public/amicus/collectio/cg/index.html
          cp apoio/ex-officio/lotes/index.html site/public/amicus/collectio/cmt/index.html
          cp apoio/ex-officio/lotes/index.html site/public/amicus/collectio/gc/index.html
          # motor da conformidade da extensão Muta, usado também pelas versões da minuta no Collectio
          cp extensao/conformidade-motor.js site/public/amicus/collectio/conformidade-motor.js
          # ponte para registrar no Collectio as minutas lidas no editor do PJe (janela aberta pelo PJe, com código da importação)
          cp apoio/ex-officio/lotes/pje.html site/public/amicus/collectio/pje.html
          # prévia do Collectio melhorado (/amicus/collectio/previa/): página só de leitura, com os mesmos dados e o mesmo login
          mkdir -p site/public/amicus/collectio/previa && cp apoio/ex-officio/lotes/previa.html site/public/amicus/collectio/previa/index.html
          cp apoio/modus-operandi/modus-operandi.html site/public/amicus/compendium/index.html
          cp apoio/enciclopedia.json site/api/_enciclopedia.json
          # A aplicação modular precisa manter todos os assets e o motor sob o mesmo prefixo.
          mkdir -p site/public/monitor
          cp caput/index.html site/public/monitor/index.html
          cp -R caput/assets caput/motor site/public/monitor/
          # Caput: interface única para inteligência, triagem, pautas, coordenação, comunicação e chefia.
          # Usa os mesmos scripts, APIs e motor da Triagem; as URLs antigas permanecem compatíveis.
          # Uma página só em /caput/; /caput/triagem, /caput/pautas, /caput/coordenacao, /caput/comunicacao, /caput/inteligencia,
          # /caput/chefia e /caput/escaninhos[/<id>] são reescritas para ela (vercel.json › rewrites) e a aba sai do caminho.
          mkdir -p site/public/caput site/public/monitor/triagem
          cp caput/triagem/index.html site/public/caput/index.html
          cp caput/triagem/index.html site/public/monitor/triagem/index.html
          # Competências da equipe: moldura da Coordenação do Caput (lê e grava pelo motor do Caput)
          mkdir -p site/public/caput/competencias && cp caput/competencias/index.html site/public/caput/competencias/index.html
          # Mesa de designação da pauta: moldura sobre Pautas › Preparar › B do Caput (lê e grava pelo motor do Caput)
          mkdir -p site/public/caput/designacao && cp caput/designacao/index.html site/public/caput/designacao/index.html
          # Módulo comum "Atualizar acervo fonte" (planilhas → carga → Action acervo-fonte.yml), para qualquer página do site
          mkdir -p site/public/padrao && cp padrao/acervo-fonte.js site/public/padrao/acervo-fonte.js
          # Série histórica do Relator (precedentes/jurisprudencia): índice e arquivos de busca em texto integral,
          # gerados aqui (não ficam no Git); lidos pelo ementário do Compendium em /jurisprudencia/
          python3 scripts/jurisprudencia/gerar_busca.py
          mkdir -p site/public/jurisprudencia && cp precedentes/jurisprudencia/indice.json.gz site/public/jurisprudencia/ && cp -R precedentes/jurisprudencia/busca site/public/jurisprudencia/
          # Ementário curado resumido (curados.json.gz e curados-texto.json.gz), lido pela extensão Muta junto com a série histórica
          python3 scripts/jurisprudencia/gerar_curados.py --saida site/public/jurisprudencia
          # Extensão Muta (painel lateral ao lado do PJe): pacote para instalar sem compactação, em /extensao/muta-pje.zip
          mkdir -p site/public/extensao && (cd extensao && zip -qr -X ../site/public/extensao/muta-pje.zip . -x 'README.md')
          # Versão publicada: a extensão compara com a instalada e avisa que há atualização (atualizar-muta.cmd baixa e troca os arquivos)
          node -e "const v=require('./extensao/manifest.json').version;require('fs').writeFileSync('site/public/extensao/versao.json',JSON.stringify({versao:v,zip:'/extensao/muta-pje.zip'}))"
          # Dados da extensão (comparativos e conformidade): modelos, minutas-matriz, matriz do 28,86%, parágrafos-padrão e regras de redação
          python3 scripts/extensao/dados.py --saida site/public/extensao/dados
          # Prévia do painel da extensão (/extensao/previa/): o painel de verdade, com os mesmos arquivos, ao lado de um PJe simulado (nada é gravado)
          python3 scripts/extensao/previa.py --saida site/public/extensao/previa
          printf '{"framework":null,"buildCommand":"","installCommand":"","outputDirectory":"public","functions":{"api/pauta.js":{"maxDuration":60},"api/editor.js":{"maxDuration":60},"api/acesso.js":{"maxDuration":60}},"rewrites":[{"source":"/caput/:aba(triagem|pautas|coordenacao|comunicacao|inteligencia|chefia|escaninhos)","destination":"/caput/index.html"},{"source":"/caput/escaninhos/:id","destination":"/caput/index.html"}],"redirects":[{"source":"/","destination":"/monitor/index.html","permanent":false},{"source":"/monitor","destination":"/monitor/index.html","permanent":false},{"source":"/monitor/","destination":"/monitor/index.html","permanent":false},{"source":"/index","destination":"/amicus/collectio/","permanent":true},{"source":"/index/","destination":"/amicus/collectio/","permanent":true},{"source":"/index/cm","destination":"/amicus/collectio/","permanent":true},{"source":"/index/cm/","destination":"/amicus/collectio/","permanent":true},{"source":"/index/cmt","destination":"/amicus/collectio/","permanent":true},{"source":"/index/cmt/","destination":"/amicus/collectio/","permanent":true},{"source":"/index/cg","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/index/cg/","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/index/gc","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/index/gc/","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/gc","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/gc/","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/lotes","destination":"/amicus/collectio/","permanent":true},{"source":"/lotes/","destination":"/amicus/collectio/","permanent":true},{"source":"/cmt/lotes","destination":"/amicus/collectio/","permanent":true},{"source":"/cmt/lotes/","destination":"/amicus/collectio/","permanent":true},{"source":"/cg/lotes","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/cg/lotes/","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/lote","destination":"/amicus/collectio/","permanent":true},{"source":"/lote/","destination":"/amicus/collectio/","permanent":true},{"source":"/lote/cmt","destination":"/amicus/collectio/","permanent":true},{"source":"/lote/cmt/","destination":"/amicus/collectio/","permanent":true},{"source":"/lote/cg","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/lote/cg/","destination":"/amicus/collectio/cg/","permanent":true},{"source":"/amicus-curiae","destination":"/amicus/","permanent":true},{"source":"/amicus-curiae/","destination":"/amicus/","permanent":true},{"source":"/amicus/index","destination":"/amicus/collectio/","permanent":false},{"source":"/amicus/index/","destination":"/amicus/collectio/","permanent":false},{"source":"/amicus/index/cmt","destination":"/amicus/collectio/","permanent":false},{"source":"/amicus/index/cmt/","destination":"/amicus/collectio/","permanent":false},{"source":"/amicus/index/cg","destination":"/amicus/collectio/cg/","permanent":false},{"source":"/amicus/index/cg/","destination":"/amicus/collectio/cg/","permanent":false},{"source":"/amicus/index/gc","destination":"/amicus/collectio/cg/","permanent":false},{"source":"/amicus/index/gc/","destination":"/amicus/collectio/cg/","permanent":false},{"source":"/office","destination":"/exofficio/","permanent":false},{"source":"/office/","destination":"/exofficio/","permanent":false},{"source":"/hub","destination":"/exofficio/","permanent":false},{"source":"/hub/","destination":"/exofficio/","permanent":false},{"source":"/equipe","destination":"/exofficio/","permanent":false},{"source":"/equipe/","destination":"/exofficio/","permanent":false},{"source":"/triagem","destination":"/caput/triagem","permanent":false},{"source":"/triagem/","destination":"/caput/triagem","permanent":false},{"source":"/pautas","destination":"/caput/pautas","permanent":false},{"source":"/pautas/","destination":"/caput/pautas","permanent":false},{"source":"/caput/:aba(triagem|pautas|coordenacao|comunicacao|inteligencia|chefia|escaninhos)/","destination":"/caput/:aba","permanent":false},{"source":"/init","destination":"/caput/","permanent":false},{"source":"/init/","destination":"/caput/","permanent":false}]}\n' > site/vercel.json
      - name: Publica
        if: steps.v.outputs.publicar == '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Falta o segredo VERCEL_TOKEN."; exit 1; }
          # O projeto pode mudar de equipe (ex.: equipe Pro): procura, com a própria chave, a equipe em que ele está;
          # se o identificador do projeto também mudou, procura pelo domínio gabinete-cmt.com.
          API=https://api.vercel.com; H="Authorization: Bearer $VERCEL_TOKEN"
          acha() { curl -s -o /dev/null -w '%{http_code}' -H "$H" "$API/v9/projects/$VERCEL_PROJECT_ID?teamId=$1"; }
          ORG="$VERCEL_ORG_ID"; PRJ="$VERCEL_PROJECT_ID"
          if [ "$(acha "$ORG")" != "200" ]; then
            ORG=""
            for t in $(curl -s -H "$H" "$API/v2/teams?limit=50" | jq -r '.teams[]?.id'); do
              if [ "$(acha "$t")" = "200" ]; then ORG="$t"; break; fi
              p=$(curl -s -H "$H" "$API/v9/projects?teamId=$t&limit=100" | jq -r '[.projects[]? | select([(.targets.production.alias // [])[], (.alias // [] | map(.domain? // .))[]] | map(tostring) | any(test("gabinete-cmt\\.com$")))][0].id // empty')
              if [ -n "$p" ]; then ORG="$t"; PRJ="$p"; break; fi
            done
            test -n "$ORG" || { echo "Projeto não encontrado em nenhuma equipe acessível pela chave VERCEL_TOKEN."; exit 1; }
          fi
          echo "Publicando no projeto $PRJ da equipe $ORG"
          VERCEL_ORG_ID="$ORG" VERCEL_PROJECT_ID="$PRJ" npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"
