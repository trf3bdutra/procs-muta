# Matriz de minutas por servidor (apoio/equipe-matriz.json): experiência de cada um pelo histórico das pautas e da ficha.
# Recalcula quando muda uma pauta, a ficha ou o cadastro da equipe. Commits deste fluxo (GITHUB_TOKEN) não disparam fluxos.
name: Equipe · matriz de minutas
on:
  push:
    branches: [main]
    paths:
      - "acervo/sessoes/**"
      - "acervo/operacional.json"
      - "acervo/planilhas/**"
      - "apoio/equipe.json"
      - "scripts/equipe/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: equipe-matriz
  cancel-in-progress: true
jobs:
  matriz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recalcula a matriz
        run: python3 scripts/equipe/matriz_minutas.py --gravar
      - name: Grava
        run: |
          if [ -n "$(git status --porcelain apoio/equipe-matriz.json)" ]; then
            git config user.name "equipe-matriz[bot]"
            git config user.email "equipe-matriz@users.noreply.github.com"
            git add apoio/equipe-matriz.json
            git commit -m "Equipe: matriz de minutas recalculada (${GITHUB_SHA::7})"
            for i in 1 2 3 4; do git push && break; sleep $((i*3)); git pull --rebase -q origin main; done
          fi
