<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Calendário de sessões · painel do Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.ti{font-style:normal;line-height:1;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",sans-serif}.ti-send::before{content:"➤"}.ti-pencil::before{content:"✎"}.ti-file-text::before{content:"▤"}.ti-lock-open::before{content:"⚿"}.ti-gavel::before{content:"⚖"}.ti-chevron-left::before{content:"‹"}.ti-chevron-right::before{content:"›"}.ti-chevron-up::before{content:"˄"}.ti-chevron-down::before{content:"˅"}.ti-alert-triangle::before{content:"⚠"}.ti-clock::before{content:"◷"}.ti-calendar-question::before{content:"?"}
button{font-family:inherit}
body{margin:0;background:#e9edf0;font-family:Figtree,sans-serif;color:#13242f;padding:20px}
/* ===== painel cmt-cal (pronto para o Monitor: tudo prefixado .cc-) ===== */
.cc{background:#fff;border:1px solid #d4dce2;border-radius:12px;overflow:hidden;position:relative}
.cc-h{background:#eef1f4;border-bottom:1px solid #d4dce2;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cc-h b{font-size:15px}.cc-h small{font-size:12px;color:#56656e}
.cc-sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.cc-pill{font:600 11.5px Figtree;padding:4px 10px;border-radius:999px;border:1px solid #c9d3da;background:#fff;color:#13242f;cursor:pointer}
.cc-pill.on{background:#e3f0f7;border-color:#006291;color:#005982}
.cc-ib{width:28px;height:28px;border-radius:6px;border:1px solid #c9d3da;background:#fff;cursor:pointer;font-size:15px;color:#13242f;display:flex;align-items:center;justify-content:center}
.cc-ses{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid #eef1f4}
.cc-sc{display:flex;align-items:center;gap:6px;font:600 12px Figtree;border:1.5px solid;border-radius:8px;padding:4px 9px;background:#fff;cursor:pointer}
.cc-sc.off{opacity:.35}.cc-sc i.dot{width:9px;height:9px;border-radius:50%}
.cc-sc em{font-style:normal;font-weight:500;color:#56656e}
.cc-al{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid #eef1f4;flex-wrap:wrap}
.cc-a{flex:1;min-width:230px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid;border-radius:8px;padding:6px 10px;cursor:pointer}
.cc-a.r{border-color:#c0392b;background:#fdecea;color:#8e2a20}.cc-a.y{border-color:#d9a046;background:#fbf3e4;color:#854f0b}.cc-a.g{border-color:#1a8a6a;background:#e8f5ef;color:#0f5e48}
.cc-body{position:relative;padding:6px 14px 10px}
.cc-lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#56656e;padding:8px 14px;border-top:1px solid #eef1f4}
.cc-lg span{display:inline-flex;gap:4px;align-items:center}
/* semanas */
.cc-c{cursor:pointer}.cc-c.cc-sw{box-shadow:inset 0 3px 0 #006291;background:#f2f8fc}
.cc-wt{display:flex;align-items:center;gap:10px;margin:14px 0 6px}.cc-wt b{font-size:14px}.cc-wt small{font-size:11.5px;color:#56656e}
.cc-wg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cc-wc{border:1px solid #e1e7ec;border-radius:8px;padding:6px;min-height:110px;display:flex;flex-direction:column;gap:5px;background:#fff}
.cc-wc.cc-fds{background:#f7f9fa}.cc-wc.cc-fe{background:#fbf3e4}.cc-wc.cc-hoje{border:2px solid #c0392b}
.cc-wh{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px}.cc-wh small{font-size:9.5px;color:#854f0b;width:100%}
.cc-hb{font-size:9.5px;font-weight:800;color:#fff;background:#c0392b;border-radius:3px;padding:0 5px;text-transform:uppercase}
.cc-we{display:flex;gap:6px;align-items:center;border:1.5px solid;border-radius:7px;padding:5px;cursor:pointer}
.cc-we .cc-m{position:static;transform:none;flex:none}.cc-we b{display:block;font-size:11.5px}.cc-we span{font-size:10.5px;color:#56656e}
.cc-wr{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#56656e;border-left:3px solid;padding-left:5px}.cc-wr i{display:none}
.cc-wv{font-size:10.5px;color:#8a98a3;font-style:italic}
.cc-tl{position:relative}
.cc-tk{position:absolute;top:0;bottom:0;border-left:1px dashed #e1e7ec}
.cc-tkl{position:absolute;top:4px;font-size:10px;color:#8a98a3}
.cc-fr{position:absolute;top:20px;bottom:0;width:3px;background:#f3d9a4}
.cc-frl{position:absolute;top:20px;font-size:9.5px;color:#854f0b;white-space:nowrap}
.cc-rec{position:absolute;top:20px;bottom:0;right:0;background:repeating-linear-gradient(45deg,#f6efe2 0 6px,#fff 6px 12px)}
.cc-hj{position:absolute;top:0;bottom:0;border-left:2px solid #c0392b;z-index:3}
.cc-hjl{position:absolute;top:-1px;transform:translateX(-50%);font-size:9.5px;font-weight:800;color:#fff;background:#c0392b;border-radius:3px;padding:1px 5px;z-index:3}
.cc-lab{position:absolute;left:0;width:138px;font-size:10.5px;color:#56656e;line-height:1.3}
.cc-lab b{display:flex;align-items:center;gap:6px;font-size:13px;color:#13242f}
.cc-cd{margin-left:auto;font-size:10.5px;font-weight:700}.cc-pb{display:block;height:4px;background:#eef1f4;border-radius:2px;margin-top:3px}.cc-pb i{display:block;height:4px;border-radius:2px}.cc-hjc{position:absolute;top:20px;bottom:0;background:rgba(192,57,43,.05)}
.cc-ln{position:absolute;height:3px}
.cc-m{position:absolute;transform:translate(-50%,-50%);border:2px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;transition:transform .12s}
.cc-m:hover{transform:translate(-50%,-50%) scale(1.18)}
.cc-m.nx{animation:ccp 1.8s infinite}
@keyframes ccp{0%,100%{box-shadow:0 0 0 0 var(--c)}50%{box-shadow:0 0 0 6px transparent}}
.cc-md{position:absolute;transform:translateX(-50%);font-size:10px;color:#56656e;white-space:nowrap}
/* mês */
.cc-g{display:grid;grid-template-columns:repeat(5,1fr);border-left:1px solid #eef1f4;border-top:1px solid #eef1f4}
.cc-wd{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#56656e;padding:6px 8px;border-right:1px solid #eef1f4;border-bottom:1px solid #e1e7ec;background:#fafbfc}
.cc-c{min-height:88px;border-right:1px solid #eef1f4;border-bottom:1px solid #eef1f4;padding:4px 0;overflow:hidden}
.cc-c.cc-o{background:#f3f5f7}.cc-c.cc-fds{background:#f7f9fa}.cc-c.cc-fe{background:#fbf3e4}.cc-c.cc-hoje{outline:2px solid #c0392b;outline-offset:-2px}
.cc-n{font-size:12px;font-weight:700;padding:0 6px;display:block;margin-bottom:2px}.cc-n small{font-size:9.5px;font-weight:600;color:#854f0b}
.cc-lane{position:relative;height:18px}
.cc-lane i.l{position:absolute;top:8px;height:3px}
.cc-lane .cc-m{top:9px;left:50%}
.cc-lane .t{position:absolute;left:calc(50% + 11px);top:3px;font-size:9.5px;font-weight:700;white-space:nowrap}
/* tooltip */
.cc-tip{position:absolute;z-index:10;width:300px;background:#13242f;color:#fff;border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.5;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cc-tip .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9fb3c2}
.cc-tip b{font-size:14px}.cc-tip .bar{height:6px;background:#2c4252;border-radius:3px;margin:6px 0}.cc-tip .bar i{display:block;height:6px;border-radius:3px;background:#5fb3e0}
.cc-tip .go{color:#9fd3f0;font-weight:600}
.cc.min .cc-ses,.cc.min .cc-al,.cc.min .cc-body,.cc.min .cc-lg{display:none}
.cc-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#13242f;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s}

/* ===== tema minimalista ===== */
.cc{border:0;border-radius:16px;box-shadow:0 1px 2px rgba(19,36,47,.06),0 8px 28px rgba(19,36,47,.06)}
.cc-h{background:#fff;border-bottom:0;padding:16px 20px 6px}
.cc-h b{font-size:17px;font-weight:700;letter-spacing:-.01em}.cc-h small{color:#8a98a3}
.cc-ib{border:0;background:transparent;color:#56656e;border-radius:8px}.cc-ib:hover{background:#f1f4f6}
.cc-pill{border:0;background:transparent;color:#56656e;font-weight:600;padding:5px 11px}
.cc-sp{background:#f1f4f6;border-radius:10px;padding:3px;gap:2px}
.cc-pill.on{background:#fff;color:#13242f;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cc-ses{border:0;padding:4px 20px 0;gap:4px}

.cc-al{border:0;padding:8px 20px 4px;gap:6px}

.cc-a.r{background:#fdf0ee}.cc-a.y{background:#fbf5ea}.cc-a.g{background:#ecf6f1}
.cc-body{padding:10px 20px 14px}
.cc-lg{border:0;padding:4px 20px 16px;font-size:11px;color:#a0acb5}
.cc-g{border:0;gap:0}
.cc-wd{background:transparent;border:0;color:#a0acb5;font-weight:700;padding:4px 8px 8px}
.cc-c{border:0;border-top:1px solid #f1f4f6;min-height:76px}
.cc-c.cc-o{background:transparent}.cc-c.cc-fds{background:#fbfcfc}.cc-c.cc-fe{background:#fffaf1}
.cc-c.cc-hoje{outline:0}.cc-c.cc-hoje .cc-n{background:#c0392b;color:#fff;border-radius:999px;display:inline-block;padding:1px 7px;margin-left:4px}
.cc-c.cc-sw{box-shadow:none;background:#f5f9fc}
.cc-n{font-weight:600;color:#56656e}
.cc-lane i.l{height:2px;top:8px;opacity:.75}

.cc-m{border-width:1.5px}
.cc-ln{height:2px}
.cc-tk{border-left:1px solid #f1f4f6}.cc-tkl{color:#a0acb5}
.cc-fr{width:2px;background:#f6e3bd}.cc-rec{background:repeating-linear-gradient(45deg,#fbf6ec 0 5px,#fff 5px 10px)}
.cc-hjc{background:rgba(192,57,43,.035)}
.cc-wt b{font-weight:700}
.cc-wg{gap:8px}
.cc-wc{border:0;background:#fafbfc;border-radius:10px;padding:8px;min-height:100px}
.cc-wc.cc-fds{background:#f6f8f9}.cc-wc.cc-fe{background:#fffaf1}.cc-wc.cc-hoje{border:0;background:#fff;box-shadow:0 0 0 1.5px #c0392b}
.cc-wh b{font-weight:600;color:#56656e}
.cc-we{border:0!important;background:#fff!important;box-shadow:0 1px 2px rgba(19,36,47,.07);border-radius:8px}
.cc-wr{border-left-width:2px;color:#8a98a3}
.cc-c.cc-hoje .cc-n small{color:#fff;font-weight:500}.cc-wr{display:none}.cc-wv{display:none}
.cc-tip{border-radius:12px;background:rgba(19,36,47,.96)}
.cc-lg[hidden]{display:none!important}.cc-help{width:18px;height:18px;border-radius:50%;background:#f1f4f6;color:#8a98a3;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:help}.cc-sc.fo{background:#f1f4f6}.cc-sc{opacity:.75}.cc-sc.fo{opacity:1}.cc-c{min-height:64px}.cc-lane{height:16px}.cc{container-type:inline-size}.cc-top{display:grid;grid-template-columns:250px minmax(0,1fr) 270px;gap:18px;align-items:start}
.cc-c.cc-sel{background:#eef4f8!important}.cc-c.cc-sel .cc-n{color:#13242f;text-decoration:underline 2px;text-underline-offset:3px}
.cc-wc.cc-sel{box-shadow:0 0 0 1.5px #13242f}.cc-wc{cursor:pointer}
.cc-sb{background:#fafbfc;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:10px}
.cc-sb-t{font-size:15px;font-weight:700}.cc-sb-t small{display:block;font-size:11px;font-weight:500;color:#8a98a3}
.cc-sb-s{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 2px rgba(19,36,47,.07);border-top:3px solid var(--c);cursor:pointer}
.cc-sb-h{display:flex;align-items:center;gap:6px;font-size:13px}.cc-sb-h i{width:8px;height:8px;border-radius:50%}.cc-sb-h span{font-size:11px;color:#8a98a3}.cc-sb-h em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;color:var(--c)}

.cc-sb-s li:hover{background:#f4f7f9}.cc-sb-s li b{margin-left:auto;font-weight:600;font-size:11px}

.cc-sb-s li.now{color:#13242f;font-weight:700;background:#f4f7f9}.cc-sb-s li.now .ic{box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--c)}

.cc-ft{padding:0 20px 14px}.cc-ftb{border:0;background:#f1f4f6;border-radius:8px;padding:7px 12px;font:600 12px Figtree;color:#56656e;cursor:pointer;width:100%;text-align:left}

.cc-pc{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;color:#56656e;margin-top:5px}.cc-pc-b{flex:1;height:4px;background:#eef1f4;border-radius:2px;display:flex;overflow:hidden}.cc-pc-b em{display:block;height:4px}
.cc-dir .cc-sb-s{padding:8px 10px}.cc-dir .cc-sb-s ol{margin-top:5px;gap:0}.cc-dir .cc-sb-s li{padding:2px 4px;font-size:11px}.cc-dir .cc-sb-s li .ic{width:16px;height:16px;font-size:8.5px}.cc-dir{gap:8px;padding:10px}
.cc-td{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 2px rgba(19,36,47,.07)}.cc-td-t{font-size:12.5px;font-weight:700;margin-bottom:6px;display:flex}.cc-td-t small{margin-left:auto;color:#8a98a3;font-weight:600}
.cc-td-i{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.4;padding:5px 2px;border-top:1px solid #f1f4f6;cursor:pointer}.cc-td-i input{margin-top:2px;accent-color:#006291}.cc-td-i em{font-style:normal;font-weight:600}.cc-td-i{border-top:0;border-left:3px solid var(--c,#c9d3da);background:#fafbfc;border-radius:0 6px 6px 0;padding:6px 8px;margin-top:5px}.cc-tag{display:inline-block;font-style:normal;font-size:9.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 6px;margin:0 6px 3px 0;letter-spacing:.02em}.cc-td-i.ok .cc-tag{opacity:.5}
.cc-td-nx{font-size:10.5px;font-weight:700;color:#8a98a3;text-transform:uppercase;letter-spacing:.06em;margin:2px 0}.cc-td-i.ok span{text-decoration:line-through;color:#a0acb5}
.cc-wk{background:#f3f6f8;border-radius:14px;padding:4px 14px 14px;margin-top:16px}.cc-wk .cc-wt{margin-top:10px}.cc-wk .cc-wc{background:#fff}.cc-wk .cc-wc.cc-fds{background:#fafbfc}.cc-wk .cc-wc.cc-fe{background:#fffaf1}
.cc-sb .cc-al{flex-direction:column;align-items:stretch;padding:0;gap:5px}.cc-sb .cc-a{border-radius:8px;flex:none}.cc-sb .cc-pill{align-self:flex-start}

.cc-esq{position:relative}.cc-esq-b{display:flex!important;gap:2px;position:absolute;right:10px;top:10px}.cc-tx{font:700 16px Figtree,sans-serif!important;width:28px;height:28px}.cc-hr{color:#13242f}

<script>

(function(){

  const ses=cal.sessoes.map((s,i)=>({...s,cor:CORES[i%CORES.length]}))

  ses.forEach((s,i)=>s.cor=s.date<hoje?'#8a98a3':CORES[i%CORES.length]);
  const focoPad=()=>{const n=ses.find(x=>x.date>=hoje);return n&&n.date};
  const marcos=s=>MK.filter(m=>(m[0]==='date'?s.date:s.marcos[m[0]])).map(([k,n,ic])=>({k,n,ic,d:k==='date'?s.date:s.marcos[k]}));
  const prog=s=>(ex.progresso||{})[s.date]||{minutadas:0,corrigidas:0,liberadas:0};
  function estado(s,m){

  function alertas(){

      const ms=marcos(s), dias=d=>Math.round((P(d)-P(hoje))/DIA);

  function tip(e,s,m){

      ${n?`Pautados ${n} · minutadas ${p.minutadas} · corrigidas ${p.corrigidas} · liberadas ${p.liberadas}`:'Nenhum processo pautado ainda'}

  function semanas(vis){

      const dash=ms.length<=2?`background:repeating-linear-gradient(90deg,${s.cor} 0 7px,transparent 7px 12px)`:`background:${s.cor}`;
      h+=`<div class="cc-ln" style="left:${a}px;width:${Math.max(0,b-a)}px;top:${y-1}px;${dash};${s.date<hoje?'opacity:.45':''}"></div>`;
      if(ms.length<=2) h+=`<div style="position:absolute;left:${(a+b)/2}px;top:${y+8}px;transform:translateX(-50%);font-size:10px;font-style:italic;color:${s.cor};white-space:nowrap">datas intermediárias a definir</div>`;
      ms.forEach(m=>{ if(m.d<ini||m.d>fim) return; const sz=m.k==='date'?32:24;
        h+=`<div style="position:absolute;left:${x(m.d)}px;top:${y}px">${bola(s,m,sz,s.date<hoje?'opacity:.55':'')}</div><div class="cc-md" style="left:${x(m.d)}px;top:${y+18}px">${F(m.d)}</div>`;});

  }
  function mes(vis){
    const base=st.mes||hoje.slice(0,7), [Y,M]=base.split('-').map(Number), d1=new Date(Y,M-1,1,12), n=new Date(Y,M,0).getDate();
    const fer=Object.fromEntries(ex.feriados||[]); const ult=`${base}-${String(n).padStart(2,'0')}`; vis=vis.filter(s=>marcos(s)[0].d<=ult&&s.date>=`${base}-01`); let h=['seg','ter','qua','qui','sex'].map(d=>`<div class="cc-wd">${d}</div>`).join('');
    const pad0=(d1.getDay()+6)%7, pad=pad0>=5?0:pad0; for(let i=0;i<pad;i++) h+='<div class="cc-c cc-o"></div>';

      const d=`${base}-${String(dd).padStart(2,'0')}`, wd=(pad0+dd-1)%7; if(wd>=5) continue;

      const sR0=P(st.semRef||hoje), semR=sR0.getDay()%6?sR0:new Date(+sR0+(sR0.getDay()===6?2:1)*DIA), sg=iso(new Date(+semR-((semR.getDay()+6)%7)*DIA)), sd=iso(new Date(+P(sg)+6*DIA));

  function semanaFaixa(vis){

    return `<div class="cc-wk"><div class="cc-wt"><b>Semana de ${P(dias[0]).getDate()}${dias[0].slice(5,7)!==dias[4].slice(5,7)?' de '+MESL(dias[0]):''} a ${P(dias[4]).getDate()} de ${MESL(dias[4])}</b><small>clique num dia do mês para trocar a semana</small>

  /* Afazeres do dia: regra = [marco, deslocamento em dias úteis, responsável, tarefa]. Ajuste aqui. */

        <ol>${MK.map(([k,nm,ic])=>{const d=k==='date'?s.date:s.marcos[k];

  addEventListener('resize',()=>render());

}
