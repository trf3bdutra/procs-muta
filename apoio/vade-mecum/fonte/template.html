<!doctype html>
<html lang="pt-BR">
<head>

<style>

:root[data-theme="light"]{--bg:#eceff2;--panel:#ffffff;--card:#ffffff;--field:#f3f5f7;--ink:#22313c;--mut:#5f6f7c;--line:#d9e0e6;--gold:#8c6d38;--gold-ink:#ffffff;--gold-soft:rgba(140,109,56,.12);--good:#3b7150;--bad:#93504b;--warn:#956019;--warn-soft:#fff2db;--crit:#a2402f;--crit-soft:#fbe4de;--stf:#8c6d38;--stj:#265f85;--trf:#3b7150;--focus:#8c6d38}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand small{font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.brand b{font-size:19px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--mut)}

.status{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}

.pill2>*{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;font-size:12px;font-weight:700;background:transparent;border:0;color:var(--gold);text-decoration:none;cursor:pointer;white-space:nowrap}

.ramo-t::after{content:"";flex:1;height:1px;background:var(--line)}
.ramo-t:first-child{margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}

.sub{display:flex;gap:4px;flex-wrap:wrap;padding:14px 20px 0}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 64px)}

.content{padding:16px 22px 60px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.list{display:flex;flex-direction:column;gap:10px}

.card.s-resp{border-color:var(--warn)}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:4px;color:var(--gold-ink);background:var(--stf)}
.tb.STJ{background:var(--stj)}.tb.TRF3,.tb.TRF4,.tb.TFR{background:var(--trf)}
.num{font-weight:800;font-size:15px}
.pill{font-size:10.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut)}
.card h3{font-size:14.5px;line-height:1.35;margin:8px 0}
.flag{border-radius:7px;padding:8px 10px;margin:8px 0;font-size:12.5px}
.flag b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.flag.nac{background:var(--crit-soft);color:var(--crit)}
.flag.resp{background:var(--warn-soft);color:var(--warn)}
.flag.sem{background:var(--field);color:var(--mut)}
.k{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 3px}
.k.of{color:var(--good)}.k.rs{color:var(--warn)}
.tx{white-space:pre-line;overflow-wrap:anywhere;margin:0}
.box{background:var(--field);border-radius:7px;padding:8px 10px;margin-top:8px;font-size:12.5px;color:var(--mut);white-space:pre-line;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--mut);margin-top:4px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--gold)}
.ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ft .sp{flex:1}
.usos{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:transparent;cursor:pointer}

.ulist{margin:8px 0 0;padding:0;list-style:none;font-size:12px}
.ulist li{padding:4px 0;border-bottom:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.field{background:var(--field);border-radius:7px;padding:8px 10px;border-left:2px solid var(--line)}
.field.good{border-left-color:var(--good)}.field.bad{border-left-color:var(--bad)}
.field b{display:block;font-size:10px;color:var(--gold);letter-spacing:.05em;margin-bottom:2px}
.field p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
code{font-size:12px;background:var(--field);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.matriz{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:12px 16px;margin-bottom:12px}
.matriz h3{margin:0 0 6px;font-size:14px;color:var(--gold)}
.matriz ol{margin:4px 0 10px 18px;padding:0}
.reg h2.h0{font-size:18px;color:var(--gold);margin:26px 0 6px}
.reg h3.h1{font-size:16px;margin:18px 0 4px}
.reg h4{font-size:14px;margin:14px 0 4px;color:var(--mut)}
.reg .hn{font-size:11.5px;color:var(--mut);margin:0 0 6px}
.art{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:8px 0}
.art.rev{opacity:.55}
.art .tag{font-size:10px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin-left:6px}
.tree button{font-size:12.5px}
.tree .l1{padding-left:18px;font-size:12px;color:var(--mut)}
.strip{border:1px solid var(--crit);background:var(--crit-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.strip b{color:var(--crit)}
.strip a{cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media (max-width:860px){.top{position:static}.layout{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.top{padding:10px 16px}.content{padding:14px 16px 50px}.grid{grid-template-columns:1fr}.right{margin-left:0;width:100%}}
@media print{.top,aside,.ft{display:none}.layout{display:block}body{background:#fff;color:#000}.card{break-inside:avoid}}
</style>
</head>

<script>
(function(){
'use strict';
var SHEET_ID='1xsIhk8jnB77ZbDhZEnuXkh1WPNH79S4VjQ2nnqlHzW0';
var GID={'Temas':1932248620,'Súmulas':1032256767,'Jurisprudência':1552534627,'Normas':2025294528,'Regimento':2097711681,'Diretrizes':1146372858,'Usos no gabinete':1144060948,'Assuntos':750287909,'Matriz PIS-Cofins':1990495082};
var TABS=Object.keys(GID);
var SNAP_DATE='14/11/2026';
var DB=null;
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function fmtN(n){var x=String(n||'').replace(/\D/g,'');return x?x.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):String(n||'');}
function sheetUrl(tab){return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit#gid='+(GID[tab]||0);}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},1600);}
function copy(txt){
  function fb(){var a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Citação copiada');}catch(e){toast('Não foi possível copiar');}a.remove();}
  try{navigator.clipboard.writeText(txt).then(function(){toast('Citação copiada');},fb);}catch(e){fb();}
}
try{var th=localStorage.getItem('vdm-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
$('#theme').addEventListener('click',function(){var r=document.documentElement;var nv=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',nv);try{localStorage.setItem('vdm-theme',nv);}catch(e){}});
$('#openSheet').href=sheetUrl('Temas');

/* ---------- CSV ---------- */
function parseCSV(text){
  var rows=[],row=[],f='',q=false,i=0,c;
  for(;i<text.length;i++){
    c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function toObjs(rows){
  var h=rows[0]||[];
  return rows.slice(1).filter(function(r){return r.some(function(x){return x!=='';});}).map(function(r){var o={};h.forEach(function(k,i){o[k.trim()]=r[i]==null?'':r[i];});return o;});
}
function fetchTab(name){
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(name);
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    var ct=r.headers.get('content-type')||'';
    return r.text().then(function(t){ if(/text\/html/.test(ct)||/^\s*</.test(t)) throw new Error('sem acesso'); return toObjs(parseCSV(t)); });
  });
}
function setStatus(kind,msg){var s=$('#status');s.querySelector('.dot').className='dot '+kind;s.querySelector('span').textContent=msg;s.title=kind==='snap'?'Para ler a planilha ao vivo, ela precisa estar compartilhada como “Qualquer pessoa com o link pode ver”.':'';}
function loadLive(manual){
  return Promise.all(TABS.map(fetchTab)).then(function(res){
    var o={};TABS.forEach(function(t,i){o[t]=res[i];});
    if(!o['Temas'].length) throw new Error('vazio');

      h+='<div class="art'+(rev?' rev':'')+'" id="'+esc(r['Código'])+'"><div class="hd"><span class="num">'+esc(r['Rótulo'])+'</span>'+(rev?'<span class="tag">revogado</span>':'')+'</div><p class="tx" style="margin-top:6px">'+esc(r['Título ou texto'])+'</p>'+(r['Notas de redação']?'<details><summary>Notas de redação</summary><p class="tx meta">'+esc(r['Notas de redação'])+'</p></details>':'')+'<div class="ft"><span class="meta">'+esc(r['Código'])+'</span><span class="sp"></span>'+usosBtn(r['Código'])+'<button class="btn" data-copy="'+esc('RITRF3, '+r['Rótulo'].replace(/^Art\. /,'art. ')+': '+r['Título ou texto'])+'">Copiar</button></div></div>';}
    if(t!=='Artigo'&&r['Notas de redação'])h+='<p class="hn">'+esc(r['Notas de redação'])+'</p>';
  });
  $('#r-out').innerHTML=nA?h+'</div>':'<p class="empty">Nenhum artigo encontrado.</p>';
}

window.VDM_DB=function(){return DB;};
boot();
})();
