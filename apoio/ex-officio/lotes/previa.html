<!-- Prévia do Collectio melhorado (/amicus/collectio/previa/): só leitura. Lê /api/painel?lote=1 (lotes, minutas e versões)
     e /api/pauta?data= (a pauta da sessão, com a designação e as datas da produção) e não grava nada. Mesmo login e mesmo tema
     (cmt-eq-tema) do Collectio. Mostra, por sessão: o fluxo da minuta (minutada · corrigida · no PJe · liberada · versão final),
     a lista com as etapas de cada processo, a fila do dia e o processo aberto com versões, comparação, ajustes e pendências. -->

<script>
(function(){

const hoje=()=>new Date(Date.now()-4*3600e3).toISOString().slice(0,10);
const params=new URLSearchParams(location.search);
const SECS=[['relatorio','Relatório','R'],['voto','Voto','V'],['ementa','Ementa','E'],['acordao','Acórdão','A']];
const ETAPAS_COMPLETO=[['minutar','1 · A minutar','sem minuta','minuta ainda não registrada'],['minutada','2 · Minutada','minutadas','sem correção registrada'],['corrigida','3 · Corrigida','corrigidas','falta colar no PJe e marcar'],['pje','4 · No PJe','no PJe','versão importada, antes da liberação'],['liberada','5 · Liberada','liberadas','e quantas têm a versão final']];
/* "No PJe" e "Versão final" só valem nas minhas correções; na pauta inteira o fluxo é minutada · corrigida · liberada */
const ETAPAS_SIMPLES=[['minutar','1 · A minutar','sem minuta','minuta ainda não registrada'],['minutada','2 · Minutada','minutadas','sem correção registrada'],['corrigida','3 · Corrigida','corrigidas','falta liberar no PJe'],['liberada','4 · Liberada','liberadas','prontas para a sessão']];
const completo=()=>S.vista==='meus';
const etapas=()=>completo()?ETAPAS_COMPLETO:ETAPAS_SIMPLES;
const S={usuario:'',gestor:false,sessoes:[],data:'',itens:[],por:{},lotes:{},vista:'meus',etapa:'',fora:'',q:'',aberto:'',ver:{},fechados:new Set(),minAb:new Set(),colTipo:'pauta',loteSel:'',colTit:'',loteSes:'',mxModo:'ver',mxRasc:{},mxForm:''};

async function get(url){const r=await fetch(url,{credentials:'same-origin',headers:{'Accept':'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.erro||('HTTP '+r.status));e.status=r.status;throw e}return j}
/* o gestor lê os lotes como na gestão (&modo=cg): vê todos os processos, inclusive os ainda ocultos da página da equipe */
const MODO=()=>S.gestor?'&modo=cg':'';
function msg(t){const e=$('#ld-m');if(e)e.textContent=t}

/* ---------- modelo de cada processo: etapas da produção, tiradas da pauta (Ex Officio) e do lote (Collectio) ---------- */
function linha(x,cheio){
  if(cheio===undefined)cheio=completo();
  /* a minuta e as informações registradas numa coleção avulsa valem para o processo em qualquer coleção */
  /* um processo em mais de uma coleção tem uma versão da minuta por coleção; todas entram no histórico dele */
  let z=S.por[x.cnj]||null; const fontes=[];
  if(z&&z.it&&z.it.minuta)fontes.push(z);
  ((S.idxAv&&S.idxAv[x.cnj])||[]).forEach(f=>{if(!fontes.some(q=>q.lote===f.lote))fontes.push(f)});
  if((!z||!(z.it&&z.it.minuta))&&fontes.length)z=Object.assign({compart:true},fontes[0]);
  const it=z?z.it:null, c=x.ctl||{};
  const m=!!(x.dataMinuta||(it&&it.minuta)), co=!!x.dataCorrecao, pj=!!(it&&it.pje), li=!!x.dataLiberacao, fi=!!(it&&it.final);
  const retido=/retirad|adiad/i.test(c.intercorTipo||'');
  /* a versão final não é etapa: é o indicador da fase liberada (só nas minhas correções) */
  const etapa=retido?'retido':cheio?(li?'liberada':pj?'pje':co?'corrigida':m?'minutada':'minutar'):(li?'liberada':co?'corrigida':m?'minutada':'minutar');
  const passos=cheio?[m,co,pj,li]:[m,co,li];
  const tags=[]; let nivel='';
  if(retido){tags.push(['in',c.intercorTipo]);}
  else{
    /* alerta só no que ainda pede ação: com a versão final registrada, o processo está em dia */
    if(cheio&&li&&!fi){tags.push(['al','Falta a versão final']);nivel=nivel||'al'}
    if(cheio&&fi)tags.push(['ok','Versão final']);
    if(cheio&&co&&!li&&!pj&&it&&it.minuta)tags.push(['in','Colar no PJe e marcar']);
    const np=it&&Array.isArray(it.pendencias)?it.pendencias.length:0;
    /* características do processo na pauta: meta do CNJ e julgamento que não é o primeiro */
    if(c.meta)tags.push(['in','★ Meta '+c.meta]);
    {const n1={ED:'Embargos de declaração',AgInt:'Agravo interno',JR:'Juízo de retratação'}[x.julgamento]||{'Embargos de Declaração':'Embargos de declaração','Agravo Interno':'Agravo interno','Juízo de Retratação':'Juízo de retratação'}[(c.cartao||{}).tipoJ];if(n1)tags.push(['in',n1])}
    if(x.acervo&&x.acervo.prioridade)tags.push(['in','Prioridade legal']);
    if(x.acervo&&x.acervo.urgencia)tags.push(['al','Urgência']);
    if(fontes.length>1)tags.push(['in','Minuta em '+fontes.length+' coleções']);else if(z&&z.compart)tags.push(['in','Minuta em '+z.titulo]);
    if(np&&!li)tags.push(['in',np+(np>1?' pendências':' pendência')+' a validar']);
    if(!String(x.servidor||'').trim()||!String(x.corretor||'').trim())tags.push(['cr','Sem designação']);
  }
  const txt={minutar:'a minutar',minutada:x.dataMinuta?'minutada '+brc(x.dataMinuta):'minutada',corrigida:'corrigida '+brc(x.dataCorrecao),pje:'no PJe '+brc(it&&it.pje&&it.pje.em),liberada:'liberada '+brc(x.dataLiberacao)+(cheio?(fi?' · versão final ✓':' · sem versão final'):''),retido:'fora da sessão'}[etapa];
  return {x,z,it,c,fontes,item:Number(x.item)||0,etapa,passos,tags,nivel,txt,retido,cheio,fi,
    meu:souEu(x.corretor)};
}
/* o corretor pode ser dupla ("Bruno/Alex"): basta um dos nomes ser o do login (nome inteiro ou o primeiro nome) */
function souEu(v){const u=sem(S.usuario);if(!u)return false;return sem(v).split(/[\/,;]|\s+e\s+/).map(s=>s.trim()).some(s=>s&&(s===u||s===u.split(' ')[0]||s.split(' ')[0]===u))}
function escopo(){return S.linhas.filter(r=>S.vista==='todos'||r.meu)}
function filtradas(){
  const q=sem(S.q);
  return escopo().filter(r=>{
    if(S.etapa&&r.etapa!==S.etapa)return false;
    if(S.fora&&r.etapa!==S.fora)return false;
    if(q&&!sem([r.x.item,r.x.cnj,r.x.partes,r.x.assunto,r.x.classe,r.x.servidor].join(' ')).includes(q))return false;
    return true;
  }).sort((a,b)=>a.item-b.item);
}

/* ---------- carga ---------- */
async function carregar(){
  try{
    msg('Lendo as sessões e os lotes…');
    const L=await get('/api/painel?lote=1');
    S.usuario=L.usuario||'';S.gestor=!!L.gestor;
    /* só as sessões ativas: publicadas para a equipe, com processos e ainda por realizar */
    const todas=(L.sessoes||[]).filter(s=>s.processos>0&&s.publicada!==false).sort((a,b)=>a.date.localeCompare(b.date));
    const ativas=todas.filter(s=>s.date>=hoje());
    const ses=ativas.length?ativas:todas.slice(-1);
    S.sessoes=ses;
    const pedida=params.get('sessao');
    S.data=(ses.find(s=>s.date===pedida)||ses.find(s=>s.date>=hoje())||ses[ses.length-1]||{}).date||'';
    if(!S.data)throw new Error('Nenhuma sessão publicada.');
    S.lotesLista=(L.lotes||[]);
    const pc=params.get('colecao'), lc=pc&&S.lotesLista.find(l=>l.id===pc);
    const dentro=lc&&pedida&&(lc.sessoes||[]).includes(S.data)&&S.data===pedida;
    if(lc){S.colTipo=dentro?'pauta':tipoCol(lc);await carregarLote(lc.id,dentro?S.data:'')}else await carregarSessao();
  }catch(e){
    $('#app').innerHTML=e.status===401||e.status===403&&!S.usuario?`<div class="load"><p class="t">Entre pelo <em class="it">Ex Officio.</em></p><p>A prévia usa o mesmo login do Collectio. <a href="/exofficio/">Abrir o Ex Officio</a></p></div>`:`<div class="load"><p class="t">Não foi possível <em class="it">ler.</em></p><p>${esc(e.message)}</p></div>`;
  }
}
/* índice dos registros das coleções avulsas, por processo: lido uma vez, depois do primeiro desenho */
async function indiceAvulsas(){
  if(S.idxAv)return;
  const ls=(S.lotesLista||[]).filter(l=>tipoCol(l)==='avulsa'&&l.total>0);
  const R=await Promise.all(ls.map(l=>S.lotes[l.id]?Promise.resolve({lote:S.lotes[l.id]}):get('/api/painel?lote=1&id='+encodeURIComponent(l.id)+MODO()).catch(()=>null)));
  const idx={};
  R.forEach(r=>{const l=r&&r.lote;if(!l)return;(l.itens||[]).forEach(it=>{if(!it.minuta)return;
    /* mais de uma: vale a que já tem versão final, depois a marcada no PJe */
    (idx[it.processo]=idx[it.processo]||[]).push({lote:l.id,titulo:l.titulo||l.id,it})})});
  const peso=f=>(f.it.final?2:0)+(f.it.pje?1:0);
  Object.values(idx).forEach(a=>a.sort((p,q)=>peso(q)-peso(p)));
  S.idxAv=idx;
  const muda=S.itens.some(x=>{const z=S.por[x.cnj];return (idx[x.cnj]||[]).some(f=>f.lote!==(z&&z.lote))});
  if(muda)render();
}
const tipoCol=l=>l.tipo==='pauta'?'pauta':l.tipo==='triagem'?'triagem':l.tipo==='selecao'?'selecao':'avulsa';
const ROT_COL={pauta:'Lote da pauta',selecao:'Seleção prévia',triagem:'Coleção de triagem',avulsa:'Coleção avulsa'};
async function carregarLote(id,ses){
  msg('Lendo a coleção…');
  const R=await get('/api/painel?lote=1&id='+encodeURIComponent(id)+MODO()), l=R.lote||{itens:[]};
  S.loteSel=l.id;S.colTit=l.titulo||l.id;S.loteSes=ses||'';S.lotes={[l.id]:l};S.por={};
  if(ses)l.itens=(l.itens||[]).filter(it=>!it.sessao||it.sessao===ses);
  /* designação, datas e retenção vêm da pauta de cada sessão do lote, quando publicada */
  const P={}, ss=[...new Set((l.itens||[]).map(i=>i.sessao).filter(Boolean))];
  await Promise.all(ss.map(s=>get('/api/pauta?data='+s).then(d=>(d.itens||[]).forEach(x=>{P[x.cnj]=x})).catch(()=>{})));
  S.itens=(l.itens||[]).map(it=>{S.por[it.processo]={lote:l.id,titulo:S.colTit,it};const e=it.equipe||{},d=e.datas||{};
    return P[it.processo]||{cnj:it.processo,item:it.item!=null?String(it.item):'',classe:it.recurso||'',assunto:it.assunto||'',partes:it.partes||'',servidor:e.minuta||'',corretor:e.correcao||'',dataMinuta:d.minuta||'',dataCorrecao:d.correcao||'',dataLiberacao:d.liberacao||'',ctl:{}}});
  S.linhas=S.itens.map(x=>linha(x));
  if(!S.linhas.some(r=>r.meu))S.vista='todos';
  const eu=$('#eu');if(S.usuario){eu.hidden=false;eu.textContent='★ '+S.usuario}
  const pp=params.get('processo'), ra=pp&&S.linhas.find(r=>r.x.cnj.startsWith(pp));if(ra)S.aberto=ra.x.cnj;
  render();
  if(ra)ir('proc');
  indiceAvulsas().catch(()=>{});
}
async function carregarSessao(){
  S.loteSel='';S.colTit='';S.loteSes='';
  msg('Lendo a pauta de '+br(S.data)+'…');
  const lotes=S.lotesLista.filter(l=>(l.sessoes||[]).includes(S.data)&&l.total>0&&l.tipo!=='selecao');
  const [P,...R]=await Promise.all([get('/api/pauta?data='+S.data)].concat(lotes.map(l=>get('/api/painel?lote=1&id='+encodeURIComponent(l.id)+MODO()).catch(()=>null))));
  S.por={};S.lotes={};
  /* matriz gravada na pauta da sessão (acervo/matrizes): vem aplicada na matriz geral da sessão */
  S.mxSes=null;
  try{const V=await get('/api/painel?lote=1&id=pauta-'+S.data+MODO());if(V.lote&&V.lote.matriz){const it={};(V.lote.itens||[]).forEach(i=>{if(i.grupo||(i.variacoes||[]).length)it[i.processo]={grupo:i.grupo||'',variacoes:i.variacoes||[],observacao:i.observacao||''}});S.mxSes={grupos:V.lote.grupos||[],colunas:V.lote.colunas||[],itens:it,em:V.lote.matriz.em,por:V.lote.matriz.por}}}catch(e){}
  R.forEach((r,k)=>{if(!r||!r.lote)return;const l=r.lote;S.lotes[l.id]=l;(l.itens||[]).forEach(it=>{if(it.sessao&&it.sessao!==S.data)return;const ant=S.por[it.processo];if(!ant||(!ant.it.minuta&&it.minuta))S.por[it.processo]={lote:l.id,titulo:l.titulo||l.id,it}})});
  S.itens=(P.itens||[]);
  S.linhas=S.itens.map(x=>linha(x));
  if(!S.linhas.some(r=>r.meu))S.vista='todos';
  const eu=$('#eu');if(S.usuario){eu.hidden=false;eu.textContent='★ '+S.usuario}
  S.aberto=params.get('processo')&&S.linhas.some(r=>r.x.cnj.startsWith(params.get('processo')))?S.linhas.find(r=>r.x.cnj.startsWith(params.get('processo'))).x.cnj:S.aberto;
  render();
  if(S.aberto&&params.get('processo'))ir('proc');
  indiceAvulsas().catch(()=>{});
}

/* coleções como no Collectio: Pauta (sessões ativas e os lotes de cada uma), Seleção prévia, Triagem e Avulsas */
function seletorColecoes(){
  const L=S.lotesLista||[], t=S.colTipo;
  const opt=l=>`<option value="${esc(l.id)}"${l.id===S.loteSel?' selected':''}>${l.cor?'● ':''}${esc(l.titulo)}${l.subtitulo?' — '+esc(l.subtitulo):''} · ${l.total}</option>`;
  /* lote com processos de uma sessão ativa é coleção daquela pauta: aparece dentro da Pauta, não nas Avulsas */
  const naAtiva=l=>(l.sessoes||[]).some(s=>S.sessoes.some(x=>x.date===s));
  const av=L.filter(l=>tipoCol(l)==='avulsa'&&!naAtiva(l)), tri=L.filter(l=>l.tipo==='triagem'), sel=L.filter(l=>l.tipo==='selecao'&&!l.arquivado).sort((a,b)=>String(a.sessao).localeCompare(String(b.sessao)));

async function carregarMinutas(){
  const fila=S.linhas.filter(r=>S.minAb.has(r.x.cnj)&&temMin(r)&&!MIN[r.z.lote+'|'+r.x.cnj.slice(0,10)]);
  let i=0;
  const um=async()=>{while(i<fila.length){const r=fila[i++],k=r.z.lote+'|'+r.x.cnj.slice(0,10);
    try{MIN[k]=await get('/api/painel?lote=1&id='+encodeURIComponent(r.z.lote)+MODO()+'&minuta='+r.x.cnj.slice(0,10))}catch(e){MIN[k]={erro:'Não foi possível ler a minuta: '+e.message}}
    const el=document.getElementById(idMin(r.x.cnj));if(el)el.innerHTML=docHtml(MIN[k]);}};
  await Promise.all([um(),um(),um(),um()]);
}
function grupos(lst){

/* coluna de uma etapa do fluxo: o número (filtro da lista), o próximo passo e os primeiros processos da fila */
const PASSO={minutar:['Minutar','pelo minutante designado',r=>r.x.servidor?'minutante '+r.x.servidor:'sem minutante designado'],

function colEtapa([k,r,t,d],base){

  </div>`;
}

/* indicadores da pauta: meta, julgamento que não é o primeiro, urgência e prioridade (acervo), admissibilidade, pendências, sigilo e retirada */
const INDS=[

  ['nao1','Não é 1º julgamento',x=>NAO1[x.julgamento]||NAO1[ca_(x).tipoJ]||'',v=>v?{t:v,c:'ik'}:null],

  ['pri','Prioridade legal',x=>(x.acervo||{}).prioridade||'',v=>v?{t:'■',c:'ik'}:null],
  ['adm','Admissibilidade em discussão',x=>{const c=c_(x),m=[];if(/intemp|n[ãa]o verif/i.test(c.tempest||''))m.push('tempestividade: '+c.tempest);if(/n[ãa]o recolh|n[ãa]o verif/i.test(c.preparo||''))m.push('preparo: '+c.preparo);if(c.repres&&/irreg|pend/i.test(c.repres))m.push('representação: '+c.repres);return m.join(' · ')},v=>v?{t:'■',c:'al'}:null],
  ['val','Pendência [VALIDAR]',x=>{const p=(ca_(x).pendencias||[]).filter(q=>q&&!q.ok);return p.length?p.length+' pendência'+(p.length>1?'s':'')+': '+p.map(q=>q.desc||q).join(' | '):''},v=>v?{t:String(parseInt(v,10)),c:'al'}:null],

      if(A.final){const b=mesma.find(v=>v.id===A.base)||pj||mesma[ix-1];if(b)return b.k}
      const c=fi||pj||mesma[ix-1]||mesma[ix+1];if(c)return c.k;
      const o=vs.find(v=>v.lote!==A.lote&&v.vig)||vs.find(v=>v.k!==k);return o&&o.k;};
    const mostra=async()=>{
      const a=$('#va').value, v=meta(a);
      $('#va-b').innerHTML=bd(v);
      $('#va-o').textContent=[v.por,v.em?br(v.em):'',v.origem,par(a)].filter(Boolean).join(' · ');
      const on=S.cmpOn&&vs.length>1;
      $('#vb-w').hidden=!on; $('#cmp').textContent=on?'Fechar comparação':'Comparar'; $('#cmp').setAttribute('aria-pressed',String(on));
      if(on){const b0=$('#vb').value;$('#vb').innerHTML=op(b0&&b0!==a?b0:outra(a),a);await comparar(mx,vs,a,$('#vb').value)}
      else{const d=$('#dif');d.innerHTML='<p class="vazio">Lendo a versão…</p>';try{const F=await foto(v.lote,mx,v.id);if($('#va')&&$('#va').value===a&&!S.cmpOn)d.innerHTML=`<div class="mdoc">${SECS.map(([s,rot])=>((F.secoes||{})[s]||[]).length?`<h4>${esc(rot.toUpperCase())}</h4>`+F.secoes[s].map(t=>`<p>${esc(t)}</p>`).join(''):'').join('')}</div>`}catch(e){d.innerHTML=`<p class="vazio">Não foi possível ler a versão: ${esc(e.message)}</p>`}}
    };
    $('#va').onchange=mostra;
    $('#vb').onchange=()=>comparar(mx,vs,$('#va').value,$('#vb').value);
    $('#cmp').onclick=()=>{S.cmpOn=!S.cmpOn;if(!S.cmpOn)$('#vb').innerHTML='';mostra()};
    if(vs.length<2)$('#cmp').disabled=true;
    mostra();
  }catch(e){const el=$('#vs');if(el)el.innerHTML=`<p class="vazio" style="padding:0">Não foi possível ler as versões: ${esc(e.message)}</p>`}
}
const fotos={};
async function foto(lote,mx,v){const k=lote+'|'+mx+'|'+v;return fotos[k]||(fotos[k]=await get('/api/painel?lote=1&id='+encodeURIComponent(lote)+MODO()+'&minuta='+mx+(v==='atual'?'':'&versao='+encodeURIComponent(v))))}
/* lado a lado: à esquerda a versão mais antiga, à direita a mais nova */
async function comparar(mx,vs,x1,x2){
  const d=$('#dif'); if(!x1||!x2||x1===x2){d.innerHTML='<p class="vazio">Escolha duas versões diferentes.</p>';return}
  const m=k=>vs.find(v=>v.k===k)||{}, ord=v=>String(v.em||'')+'|'+String(v.ix).padStart(3,'0');
  const [A,B]=ord(m(x1))<=ord(m(x2))?[m(x1),m(x2)]:[m(x2),m(x1)];
  const rot=v=>v.id+' · '+(v.rotulo||'')+(new Set(vs.map(q=>q.lote)).size>1?' · '+v.col:'');
  d.innerHTML='<p class="vazio">Comparando…</p>';
  try{
    const [FA,FB]=await Promise.all([foto(A.lote,mx,A.id),foto(B.lote,mx,B.id)]);
    const sa=FA.secoes||{},sb=FB.secoes||{};let h='',dif=0;
    SECS.forEach(([k,rt,ab])=>{
      const pa=(sa[k]||[]).map(String),pb=(sb[k]||[]).map(String);
      const ops=alinha(pa,pb);let blocoIg=0,linhas='';
      const fecha=()=>{if(blocoIg){linhas+=`<div class="eq">${blocoIg} parágrafo${blocoIg>1?'s':''} igua${blocoIg>1?'is':'l'}</div>`;blocoIg=0}};
      ops.forEach(o=>{
        if(o.t==='='){blocoIg++;return}
        fecha();dif++;
        const w=o.a!=null&&o.b!=null?difPal(pa[o.a],pb[o.b]):null;
        const L=o.a==null?'<div class="vz"></div>':`<div><span class="pr">§ ${ab}${o.a+1}</span>${w?w[0]:'<del>'+esc(pa[o.a])+'</del>'}</div>`;
        const R=o.b==null?'<div class="vz"></div>':`<div><span class="pr">§ ${ab}${o.b+1}</span>${w?w[1]:'<ins>'+esc(pb[o.b])+'</ins>'}</div>`;
        linhas+=`<div class="dif-l">${L}${R}</div>`;
      });
      fecha();
      if(pa.length||pb.length)h+=`<div class="eq" style="color:var(--eo2);border-bottom:1px solid var(--el2)">${rt}</div>`+linhas;
    });
    $('#vs-k').textContent=dif?dif+(dif>1?' parágrafos com diferença':' parágrafo com diferença'):'sem diferença';
    d.innerHTML=`<div class="dif"><div class="dif-h"><span>${esc(rot(A))}</span><span>${esc(rot(B))}</span></div>${h}</div>`;
  }catch(e){d.innerHTML=`<p class="vazio">Não foi possível comparar: ${esc(e.message)}</p>`}
}
/* parágrafos: LCS pelos textos normalizados; os blocos sem par são casados pela posição */
function alinha(A,B){
  const n=A.length,m=B.length,N=s=>s.replace(/\s+/g,' ').trim();
  const a=A.map(N),b=B.map(N),T=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const out=[];let i=0,j=0,da=[],db=[];
  const solta=()=>{const k=Math.max(da.length,db.length);for(let t=0;t<k;t++)out.push({t:'~',a:t<da.length?da[t]:null,b:t<db.length?db[t]:null});da=[];db=[]};
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){solta();out.push({t:'=',a:i,b:j});i++;j++}
    else if(j<m&&(i>=n||T[i][j+1]>=T[i+1][j])){db.push(j);j++}
    else{da.push(i);i++}
  }
  solta();return out;
}
function difPal(x,y){
  const A=x.split(/(\s+)/).filter(s=>s.length),B=y.split(/(\s+)/).filter(s=>s.length),n=A.length,m=B.length;
  if(n*m>400000)return ['<del>'+esc(x)+'</del>','<ins>'+esc(y)+'</ins>'];
  const T=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=A[i]===B[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  let i=0,j=0,l='',r='',cl='',cr='',bl=[],brr=[];
  const fl=()=>{if(bl.length){l+='<del>'+esc(bl.join(''))+'</del>';bl=[]}if(brr.length){r+='<ins>'+esc(brr.join(''))+'</ins>';brr=[]}};
  while(i<n||j<m){
    if(i<n&&j<m&&A[i]===B[j]){fl();l+=esc(A[i]);r+=esc(B[j]);i++;j++}
    else if(j<m&&(i>=n||T[i][j+1]>=T[i+1][j])){brr.push(B[j]);j++}
    else{bl.push(A[i]);i++}
  }
  fl();return [l,r];
}

async function trocaSessao(d){if(!d)return;S.colTipo='pauta';S.loteSel='';S.data=d;S.aberto='';S.etapa='';S.fora='';const u=new URL(location.href);u.searchParams.set('sessao',S.data);u.searchParams.delete('processo');u.searchParams.delete('colecao');history.replaceState(null,'',u);$('#app').innerHTML='<div class="load"><p id="ld-m">Lendo a pauta…</p></div>';try{await carregarSessao()}catch(e){$('#app').innerHTML=`<div class="load"><p>${esc(e.message)}</p></div>`}}
async function trocaColecao(id,ses){const l=(S.lotesLista||[]).find(x=>x.id===id);if(!l)return;S.colTipo=ses?'pauta':tipoCol(l);S.aberto='';S.etapa='';S.fora='';S.minAb.clear();const u=new URL(location.href);u.searchParams.set('colecao',id);if(ses)u.searchParams.set('sessao',ses);else u.searchParams.delete('sessao');u.searchParams.delete('processo');history.replaceState(null,'',u);$('#app').innerHTML='<div class="load"><p id="ld-m">Lendo a coleção…</p></div>';try{await carregarLote(id,ses)}catch(e){$('#app').innerHTML=`<div class="load"><p>${esc(e.message)}</p></div>`}}
function abre(cnj){S.aberto=cnj;S.cmpOn=false;const u=new URL(location.href);u.searchParams.set('sessao',S.data);u.searchParams.set('processo',cnj.slice(0,10));history.replaceState(null,'',u);render();ir('proc')}
