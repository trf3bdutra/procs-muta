<!-- Prévia do Collectio melhorado (/amicus/collectio/previa/): só leitura. Lê /api/painel?lote=1 (lotes, minutas e versões)
     e /api/pauta?data= (a pauta da sessão, com a designação e as datas da produção) e não grava nada. Mesmo login e mesmo tema
     (cmt-eq-tema) do Collectio. Mostra, por sessão: o fluxo da minuta (minutada · corrigida · no PJe · liberada · versão final),
     a lista com as etapas de cada processo, a fila do dia e o processo aberto com versões, comparação, ajustes e pendências. -->

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
const brc=d=>d?br(d).slice(0,5):'';
const sem=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const hoje=()=>new Date(Date.now()-4*3600e3).toISOString().slice(0,10);
const params=new URLSearchParams(location.search);
const SECS=[['relatorio','Relatório','R'],['voto','Voto','V'],['ementa','Ementa','E'],['acordao','Acórdão','A']];
const ETAPAS=[['corrigir','1 · Correção','a corrigir','minutadas, sem correção registrada'],['corrigida','2 · Corrigida','corrigidas','falta colar no PJe e marcar'],['pje','3 · No PJe','no PJe','versão importada, antes da liberação'],['liberada','4 · Liberada','liberadas','falta a versão final do PJe'],['final','5 · Versão final','conferidas','versão final registrada']];
const S={usuario:'',gestor:false,sessoes:[],data:'',itens:[],por:{},lotes:{},vista:'meus',etapa:'',fora:'',q:'',aberto:'',ver:{}};

async function get(url){const r=await fetch(url,{credentials:'same-origin',headers:{'Accept':'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.erro||('HTTP '+r.status));e.status=r.status;throw e}return j}
/* o gestor lê os lotes como na gestão (&modo=cg): vê todos os processos, inclusive os ainda ocultos da página da equipe */
const MODO=()=>S.gestor?'&modo=cg':'';
function msg(t){const e=$('#ld-m');if(e)e.textContent=t}

/* ---------- modelo de cada processo: etapas da produção, tiradas da pauta (Ex Officio) e do lote (Collectio) ---------- */
function linha(x){
  const z=S.por[x.cnj]||null, it=z?z.it:null, c=x.ctl||{};
  const m=!!(x.dataMinuta||(it&&it.minuta)), co=!!x.dataCorrecao, pj=!!(it&&it.pje), li=!!x.dataLiberacao, fi=!!(it&&it.final);
  const retido=/retirad|adiad/i.test(c.intercorTipo||'');
  const etapa=retido?'retido':fi?'final':li?'liberada':pj?'pje':co?'corrigida':m?'corrigir':'minutar';
  const passos=[m,co,pj,li,fi];
  const tags=[]; let nivel='';
  if(retido){tags.push(['in',c.intercorTipo]);}
  else{
    /* alerta só no que ainda pede ação: com a versão final registrada, o processo está em dia */
    if(!m){tags.push(['al','Sem minuta']);nivel=nivel||'al'}
    if(li&&!fi){tags.push(['al','Falta a versão final']);nivel=nivel||'al'}
    if(co&&!li&&!pj&&it&&it.minuta)tags.push(['in','Colar no PJe e marcar']);
    const np=it&&Array.isArray(it.pendencias)?it.pendencias.length:0;
    if(np&&!li)tags.push(['in',np+(np>1?' pendências':' pendência')+' a validar']);
    if(!String(x.servidor||'').trim()||!String(x.corretor||'').trim())tags.push(['cr','Sem designação']);
  }
  const txt={minutar:'a minutar',corrigir:x.dataMinuta?'minutada '+brc(x.dataMinuta):'minutada',corrigida:'corrigida '+brc(x.dataCorrecao),pje:'no PJe '+brc(it&&it.pje&&it.pje.em),liberada:'liberada '+brc(x.dataLiberacao),final:'versão final '+brc(it&&it.final&&it.final.em),retido:'fora da sessão'}[etapa];
  return {x,z,it,c,item:Number(x.item)||0,etapa,passos,tags,nivel,txt,retido,
    meu:souEu(x.corretor)};
}
/* o corretor pode ser dupla ("Bruno/Alex"): basta um dos nomes ser o do login (nome inteiro ou o primeiro nome) */
function souEu(v){const u=sem(S.usuario);if(!u)return false;return sem(v).split(/[\/,;]|\s+e\s+/).map(s=>s.trim()).some(s=>s&&(s===u||s===u.split(' ')[0]||s.split(' ')[0]===u))}
function escopo(){return S.linhas.filter(r=>S.vista==='todos'||r.meu)}
function filtradas(){
  const q=sem(S.q);
  return escopo().filter(r=>{
    if(S.etapa&&r.etapa!==S.etapa)return false;
    if(S.fora&&r.etapa!==S.fora)return false;
    if(q&&!sem([r.x.item,r.x.cnj,r.x.partes,r.x.assunto,r.x.classe,r.x.servidor].join(' ')).includes(q))return false;
    return true;
  }).sort((a,b)=>a.item-b.item);
}

/* ---------- carga ---------- */
async function carregar(){
  try{
    msg('Lendo as sessões e os lotes…');
    const L=await get('/api/painel?lote=1');
    S.usuario=L.usuario||'';S.gestor=!!L.gestor;
    const ses=(L.sessoes||[]).filter(s=>s.processos>0).sort((a,b)=>a.date.localeCompare(b.date));
    S.sessoes=ses;
    const pedida=params.get('sessao');
    S.data=(ses.find(s=>s.date===pedida)||ses.find(s=>s.date>=hoje())||ses[ses.length-1]||{}).date||'';
    if(!S.data)throw new Error('Nenhuma sessão publicada.');
    S.lotesLista=(L.lotes||[]);

const fotos={};
async function foto(lote,mx,v){const k=lote+'|'+mx+'|'+v;return fotos[k]||(fotos[k]=await get('/api/painel?lote=1&id='+encodeURIComponent(lote)+MODO()+'&minuta='+mx+'&versao='+encodeURIComponent(v)))}
async function comparar(lote,mx){
  const a=$('#va').value,b=$('#vb').value,d=$('#dif');

      });

    });

/* parágrafos: LCS pelos textos normalizados; os blocos sem par são casados pela posição */
function alinha(A,B){
  const n=A.length,m=B.length,N=s=>s.replace(/\s+/g,' ').trim();
  const a=A.map(N),b=B.map(N),T=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const out=[];let i=0,j=0,da=[],db=[];
  const solta=()=>{const k=Math.max(da.length,db.length);for(let t=0;t<k;t++)out.push({t:'~',a:t<da.length?da[t]:null,b:t<db.length?db[t]:null});da=[];db=[]};
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){solta();out.push({t:'=',a:i,b:j});i++;j++}
    else if(j<m&&(i>=n||T[i][j+1]>=T[i+1][j])){db.push(j);j++}
    else{da.push(i);i++}
  }
  solta();return out;
}
function difPal(x,y){
  const A=x.split(/(\s+)/).filter(s=>s.length),B=y.split(/(\s+)/).filter(s=>s.length),n=A.length,m=B.length;
  if(n*m>400000)return ['<del>'+esc(x)+'</del>','<ins>'+esc(y)+'</ins>'];
  const T=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=A[i]===B[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  let i=0,j=0,l='',r='',cl='',cr='',bl=[],brr=[];
  const fl=()=>{if(bl.length){l+='<del>'+esc(bl.join(''))+'</del>';bl=[]}if(brr.length){r+='<ins>'+esc(brr.join(''))+'</ins>';brr=[]}};
  while(i<n||j<m){
    if(i<n&&j<m&&A[i]===B[j]){fl();l+=esc(A[i]);r+=esc(B[j]);i++;j++}
    else if(j<m&&(i>=n||T[i][j+1]>=T[i+1][j])){brr.push(B[j]);j++}
    else{bl.push(A[i]);i++}
  }
  fl();return [l,r];
}

/* ---------- eventos ---------- */
function ligar(){
  const s=$('#ses');if(s)s.onchange=async()=>{S.data=s.value;S.aberto='';S.etapa='';S.fora='';const u=new URL(location.href);u.searchParams.set('sessao',S.data);u.searchParams.delete('processo');history.replaceState(null,'',u);$('#app').innerHTML='<div class="load"><p id="ld-m">Lendo a pauta…</p></div>';try{await carregarSessao()}catch(e){$('#app').innerHTML=`<div class="load"><p>${esc(e.message)}</p></div>`}};
  $$('[data-et]').forEach(b=>b.onclick=()=>{const k=b.dataset.et;S.etapa=S.etapa===k?'':k;S.fora='';render();ir('procs')});
  $$('[data-fo]').forEach(b=>b.onclick=()=>{const k=b.dataset.fo;S.fora=S.fora===k?'':k;S.etapa='';render();ir('procs')});
  $$('[data-vista]').forEach(b=>b.onclick=()=>{S.vista=b.dataset.vista;render()});
  const l=$('#limpa');if(l)l.onclick=()=>{S.etapa='';S.fora='';S.q='';render()};
  const q=$('#q');if(q){q.oninput=()=>{S.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)},250)}}
  $$('[data-abre]').forEach(b=>b.onclick=e=>{e.stopPropagation();abre(b.dataset.abre)});
  $$('tr.r').forEach(t=>{t.onclick=()=>abre(t.dataset.p);t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();abre(t.dataset.p)}}});
  const f=$('#fecha');if(f)f.onclick=()=>{S.aberto='';const u=new URL(location.href);u.searchParams.delete('processo');history.replaceState(null,'',u);render();ir('procs')};
}
function abre(cnj){S.aberto=cnj;const u=new URL(location.href);u.searchParams.set('sessao',S.data);u.searchParams.set('processo',cnj.slice(0,10));history.replaceState(null,'',u);render();ir('proc')}
function ir(id){const e=document.getElementById(id);if(e)e.scrollIntoView({block:'start'})}
$('#tema').onclick=()=>{const d=document.documentElement,t=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',t);try{localStorage.setItem('cmt-eq-tema',t)}catch(e){}};
$('#atu').onclick=()=>{S.ver={};for(const k in fotos)delete fotos[k];carregar()};
carregar();
})();
</script>
