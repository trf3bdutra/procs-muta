<!-- Painel de lotes (/lotes/): página própria, desenhada como parte do Painel do relator (/cmt), com o mesmo tema (cmt-eq-tema),
     o mesmo login do Ex Officio (cookie cmt_eq) ou o link próprio do relator (chave cmt_k / x-cmt-chave).
     Dados: /api/painel?lote=1 (api/_lote.js: acervo/lotes/<id>.json, cartões de acervo/sessoes e minutas de acervo/minutas/<id>/).
     Ligações: Painel do relator (/cmt/), Ex Officio (/equipe/) e Consulta do Modus Operandi (/modus/#consulta=AAAA-MM-DD/ITEM). -->
<style>
:root{--font:Figtree,"Segoe UI",system-ui,sans-serif;--bg:#eef2f4;--red:#a7433d}
html[data-theme=dark]{--bg:#0b1c28;--red:#f2a397}
.cv{--ep:#fbfaf5;--ep2:#f3f1e8;--el:#ded9cc;--el2:#c8c3b6;--ei:#1c3344;--ei2:#2b4556;--em:#5d6b72;--eg:#1b5878;--eg2:#2f7ba3;--eo:#a57829;--eo2:#805b18;--er:#a7433d;--ew:#fff;
 --emono:SFMono-Regular,Consolas,"Liberation Mono",ui-monospace,monospace;--eser:Georgia,"Times New Roman",serif;max-width:1180px;margin:0 auto;padding:0 22px 74px}
html[data-theme=dark] .cv{--ep:#10222e;--ep2:#132835;--el:#1e3747;--el2:#2c4a5c;--ei:#ebeff1;--ei2:#c5d2d8;--em:#a7a8a9;--eg:#4e9bcb;--eg2:#76bae6;--eo:#e6c27a;--eo2:#e6c27a;--er:#f2a397;--ew:#0a1821}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ei,#1c3344);font-size:14px}
html[data-theme=dark] body{color:#ebeff1}
a{color:inherit}
.star{width:24px;height:26px;flex:none;background:var(--eo);border-radius:0;box-shadow:none;-webkit-mask:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22319.34 233.85 63.70 71.05%22%3E%3Cg fill=%22%23000%22%3E%3Cpath d=%22M349.96 304.90L349.96 287.14C349.96 280.71 344.75 275.50 338.33 275.50L319.34 275.50L327.63 283.46L336.49 283.46C342.58 283.46 347.51 288.40 347.51 294.49L347.51 302.55L349.96 304.90%22/%3E%3Cpath d=%22M352.41 233.85L352.41 251.61C352.41 258.04 357.62 263.25 364.05 263.25L383.04 263.25L374.74 255.29L365.89 255.29C359.80 255.29 354.86 250.35 354.86 244.26L354.86 236.20L352.41 233.85%22/%3E%3Cpath d=%22M349.96 261.41L349.96 243.65L341.39 251.88L341.39 259.58C341.39 266.00 336.18 271.21 329.75 271.21L321.25 271.21L319.34 273.05L338.33 273.05C344.75 273.05 349.96 267.84 349.96 261.41%22/%3E%3Cpath d=%22M352.41 277.34L352.41 295.10L360.99 286.87L360.99 279.18C360.99 272.75 366.20 267.54 372.63 267.54L381.12 267.54L383.04 265.70L364.05 265.70C357.62 265.70 352.41 270.91 352.41 277.34%22/%3E%3C/g%3E%3C/svg%3E') center/contain no-repeat;mask-size:contain;mask-repeat:no-repeat;mask-position:center}
.cmt-hd2{display:flex;align-items:center;gap:12px;padding:20px 0 12px;border-bottom:1px solid var(--el);flex-wrap:wrap}
.cmt-hd2-t{min-width:0}
.cmt-ey{margin:0;font:400 11px var(--emono);letter-spacing:.16em;text-transform:uppercase;color:var(--eg2)}
.cmt-hd2-h{margin:1px 0 0;font-size:19px;font-weight:650;letter-spacing:-.03em;line-height:1.15;color:var(--ei)}
.cmt-hd2-h em,.cmt-q h2 em,.cmt-ld-t em{font-family:var(--eser);font-style:italic;font-weight:400;color:var(--eo)}
.cmt-sp{flex:1 1 20px}
.cmt-ut{display:flex;align-items:center;gap:2px;white-space:nowrap;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.hb{border:0;background:none;border-radius:0;color:var(--ei);font-family:var(--emono);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:0 9px;min-height:34px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none}
.hb:hover{color:var(--eo2)}
.hb select{border:1px solid var(--el2);background:var(--ew);color:var(--ei);font:400 11px var(--emono);letter-spacing:.04em;height:26px;padding:0 4px;text-transform:none}
.cmt-hb{display:inline-flex}
.cmt-hb i{font-style:normal;min-width:18px;padding:0 5px;border:1px solid var(--el);background:var(--ep2);color:var(--em);font:400 10px var(--emono);line-height:16px;text-align:center}
.cmt-hb select{border:0;background:transparent;color:var(--ei);font:inherit;font-size:12px;outline:0}
.cmt-q{border:1px solid var(--el);border-top:2px solid var(--eg);background:var(--ep);margin-top:18px;padding:0 18px 16px}
.cmt-q h2{margin:0 -18px 0;padding:11px 18px;border-bottom:1px solid var(--el);font-size:15px;color:var(--ei);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmt-q h2 .cmt-sp{flex:1}
.nn{font:400 10px var(--emono);font-style:normal;letter-spacing:.12em;color:var(--em);margin-right:2px}
.cmt-n{font:400 9.5px var(--emono);letter-spacing:.12em;text-transform:uppercase;color:var(--em);white-space:nowrap}
.cmt-ph{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-bottom:1px solid var(--el)}
.cmt-ph-2{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cmt-seg{display:inline-flex;border:1px solid var(--el);background:var(--ew)}
.cmt-seg button{height:28px;padding:0 12px;border:0;background:transparent;color:var(--em);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.cmt-seg button[aria-pressed=true]{background:var(--eg);color:#fff;font-weight:750}
.cmt-bq{flex:1 1 220px;min-width:0;display:flex;align-items:center;height:28px;border:1px solid var(--el2);background:var(--ew);padding:0 9px}
.cmt-bq input{border:0;outline:0;background:transparent;color:var(--ei);font:inherit;font-size:12.5px;width:100%}
.cmt-sel{height:28px;border:1px solid var(--el2);background:var(--ew);color:var(--ei);font:inherit;font-size:12px;padding:0 6px}
.cmt-met{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin:0 -18px;border-bottom:1px solid var(--el)}
.cmt-met div{padding:9px 12px;border-left:1px solid var(--el);cursor:pointer;border-top:3px solid transparent}
.cmt-met div:first-child{border-left:0;padding-left:18px}
.cmt-met div.off{opacity:.38}
.cmt-met span{display:block;font:400 8.5px var(--emono);letter-spacing:.12em;text-transform:uppercase;color:var(--em);line-height:1.35}
.cmt-met b{display:block;font:400 22px var(--emono);letter-spacing:-.03em;color:var(--eo2);margin-top:2px}
.cmt-tw{overflow-x:auto;margin:0 -18px}
.cmt-tb{width:100%;border-collapse:collapse;font-size:12.5px;min-width:980px}
.cmt-tb th{text-align:left;font:400 9px var(--emono);letter-spacing:.12em;text-transform:uppercase;color:var(--em);padding:8px 8px;border-bottom:1px solid var(--el);vertical-align:bottom;background:var(--ep);position:sticky;top:0;z-index:2}
.cmt-tb th:first-child,.cmt-tb td:first-child{padding-left:18px}
.cmt-tb th.v{width:28px;height:120px;padding:0 0 6px}
.cmt-tb th.v div{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto;letter-spacing:.08em;line-height:1.2;max-height:114px}
.cmt-tb td{border-bottom:1px solid var(--el);padding:7px 8px;color:var(--ei);vertical-align:middle}
.cmt-tb tr.r{cursor:pointer}.cmt-tb tr.r:hover td{background:var(--ep2)}
.cmt-tb td.f{text-align:center;border-left:1px solid var(--el)}
.cmt-tb .cnj,.cmt-tb .ii{font:400 11px var(--emono);white-space:nowrap}.cmt-tb .ii{color:var(--eo2)}
.cmt-tb tr.gh td{background:var(--ep2);font-size:12px;padding:8px}
.cmt-tb tr.gh td b{font-weight:650}
.dot{display:inline-block;width:10px;height:10px}
.obs{color:var(--em);font-size:11.5px}
.pf{margin-top:18px}
.pf.hl{outline:2px solid var(--eo);outline-offset:2px}
.pf h2 .tg{font:400 9.5px var(--emono);letter-spacing:.1em;text-transform:uppercase;color:var(--em);border:1px solid var(--el);padding:2px 6px;background:var(--ew)}
.pf h2 .cnj{font:400 13px var(--emono);color:var(--ei)}
.pf .nav{display:flex;gap:6px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid var(--el2);background:var(--ew);color:var(--ei);font:600 11.5px var(--font);cursor:pointer;text-decoration:none;white-space:nowrap}
.b:hover{border-color:var(--ei)}.b.pri{background:var(--eg);border-color:var(--eg);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0;margin:0 -18px;border-bottom:1px solid var(--el)}
.box{padding:12px 18px;border-right:1px solid var(--el);border-top:1px solid var(--el)}
.box h3{margin:0 0 7px;font:400 9px var(--emono);letter-spacing:.14em;text-transform:uppercase;color:var(--eg2)}
.box dl{display:grid;grid-template-columns:108px 1fr;gap:3px 10px;margin:0;font-size:12.5px}
.box dt{color:var(--em)}.box dd{margin:0;color:var(--ei)}
.box.wide{grid-column:1/-1}
.fl{display:flex;flex-wrap:wrap;gap:6px}.fl span{font-size:11px;padding:2px 8px;color:#fff}
.box table{width:100%;border-collapse:collapse;font-size:12px}
.box table td,.box table th{border-bottom:1px solid var(--el);padding:4px 6px;text-align:left;vertical-align:top}
.box table th{font:400 9px var(--emono);letter-spacing:.1em;text-transform:uppercase;color:var(--em)}
.box ul{margin:0;padding-left:18px;font-size:12.5px}.box p{margin:0 0 6px;font-size:12.5px}
.ori{color:var(--er);font-weight:600}
.mbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0 0}
.mbar .nn{margin-right:6px}.mbar .k{color:var(--em);font-size:11.5px;margin-left:4px}
.doc{margin:12px 0 0;padding:20px 28px 24px;background:var(--ew);border:1px solid var(--el);font:15px/1.65 var(--eser);color:var(--ei)}
.doc h4{font:400 10px var(--emono);letter-spacing:.2em;text-align:center;margin:20px 0 12px;color:var(--em)}
.doc p{text-align:justify;text-indent:2.5em;margin:0 0 10px}
.doc p.cit{margin-left:3.5em;text-indent:0;font-size:13.5px;line-height:1.5}
.doc p.ehd{text-indent:0;font-weight:700}.doc p.esec{text-indent:0;font-weight:700;margin-top:14px}
.doc p.sep,.doc p.rel{text-indent:0}.doc p.rod{text-indent:0;font-size:13.5px}
.none{padding:12px 0 0;color:var(--em);font-style:italic;font-size:12.5px}
.cmt-load{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cmt-load .star{width:30px;height:33px;margin-bottom:16px}
@keyframes cmtp{0%,100%{opacity:.35}50%{opacity:1}}
.cmt-ld-k{margin:0;font:400 10px var(--emono);letter-spacing:.2em;text-transform:uppercase;color:var(--em)}
.cmt-ld-t{margin:6px 0 0;font-size:34px;font-weight:600;letter-spacing:-.045em;color:var(--ei)}
.cmt-ld-m{margin:10px 0 0;font-size:13px;color:var(--em);max-width:440px}
.cmt-ld-b{margin-top:20px;width:220px;height:2px;background:var(--el);overflow:hidden}
.cmt-ld-b i{display:block;width:40%;height:100%;background:var(--eg);animation:cmtb 1.2s ease-in-out infinite}
@keyframes cmtb{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
[hidden]{display:none!important}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding:12px 0}
.form label{display:flex;flex-direction:column;gap:4px;font:400 9px var(--emono);letter-spacing:.12em;text-transform:uppercase;color:var(--em)}
.form .w{grid-column:1/-1}.form .lb{font:400 9px var(--emono);letter-spacing:.12em;text-transform:uppercase;color:var(--em)}
.form input{height:30px;border:1px solid var(--el2);background:var(--ew);color:var(--ei);font:13px var(--font);padding:0 9px;text-transform:none;letter-spacing:0}
.ses{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px;margin-top:6px;max-height:220px;overflow:auto;border:1px solid var(--el);background:var(--ew);padding:8px 10px}
.form .ses label,.ses label{display:flex;flex-direction:row;align-items:center;gap:6px;font:13px var(--font);color:var(--ei);text-transform:none;letter-spacing:0;cursor:pointer}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0 4px}.acts .k{color:var(--em);font-size:12px}
.hidden{display:none!important}
body.relator .so-equipe{display:none!important}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--eg,#1b5878);color:#fff;padding:8px 16px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
@media print{.cmt-hd2 .cmt-ut,.cmt-ph,.pf .nav,.mbar .b{display:none!important}.pf{break-inside:avoid-page}}
</style>

<body class="relator">
<div class="cv" id="cv">
 <div class="cmt-load" id="ld"><i class="star"></i><p class="cmt-ld-k">Gabinete</p><p class="cmt-ld-t">Lotes do <em>gabinete.</em></p><p class="cmt-ld-m" id="ld-m">Lendo o lote, os cartões do prontuário nas sessões e as minutas…</p><div class="cmt-ld-b"><i></i></div></div>
 <div id="app" hidden></div>
</div>
<div id="toast">Copiado</div>
<script>
(function(){
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECS=[['relatorio','RELATÓRIO'],['voto','VOTO'],['ementa','EMENTA'],['acordao','ACÓRDÃO']];
const br=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
const pad=n=>String(n).padStart(2,'0');
let RELATOR=false, LOTE=null, ITENS=[], FLN={}, COR={}, OUT=null, MIN={}, offG=new Set(), LISTA={lotes:[],calendario:[],gestor:false};
const params=new URLSearchParams(location.search);
/* link próprio do relator: a chave (k) vale como credencial, como no Painel do relator (/cmt?k=…) */
const CMTK=(function(){try{const m=/[?&#]k=([^&#]+)/.exec(location.search+location.hash);if(m){const v=decodeURIComponent(m[1]);sessionStorage.setItem('cmt_k',v);const q=new URLSearchParams(location.search);q.delete('k');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash.replace(/[#&]?k=[^&#]+/,''))}return sessionStorage.getItem('cmt_k')||''}catch(e){return ''}})();
async function api(q){const h={};if(CMTK)h['x-cmt-chave']=CMTK;const r=await fetch('/api/painel?lote=1'+(q?'&'+q.replace(/^\?/,''):''),{credentials:'same-origin',headers:h});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.erro||('HTTP '+r.status));e.status=r.status;throw e}return j}
async function post(b){const r=await fetch('/api/painel?lote=1',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.erro||('HTTP '+r.status));e.status=r.status;throw e}return j}
function mostra(html){$('#ld').hidden=true;const a=$('#app');a.hidden=false;a.innerHTML=html}
function falha(e){
  if(e.status===401){$('#ld-m').innerHTML='O painel de lotes usa o mesmo acesso do Painel do relator.<br><a class="b pri" style="margin-top:14px" href="/equipe/">Entrar pelo Ex Officio</a>';$('#ld .cmt-ld-b').hidden=true;return}
  $('#ld-m').textContent='Não foi possível abrir: '+e.message;$('#ld .cmt-ld-b').hidden=true;
}
function cabecalho(lotes,id,usuario){
  return `<div class="cmt-hd2"><i class="star" aria-hidden="true"></i>
   <div class="cmt-hd2-t"><p class="cmt-ey">Gabinete CMT · acesso do relator</p><p class="cmt-hd2-h">Lotes do <em>gabinete.</em></p></div>
   <span class="cmt-sp"></span>
   <div class="cmt-ut">
   <label class="hb" title="Lote"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Lote</span><select id="sel">${lotes.map(l=>`<option value="${esc(l.id)}"${l.id===id?' selected':''}>${esc(l.titulo)} · ${l.total}</option>`).join('')}</select></label>
   ${LISTA.gestor?`<button type="button" class="hb" id="b-novo" title="Criar um lote a partir das sessões"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Novo lote</span></button><button type="button" class="hb" id="b-ses" title="Associar ou desassociar sessões deste lote"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>Sessões</span></button>`:''}
   <a class="hb" href="/cmt/" title="Voltar ao Painel do relator"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Painel do relator</span></a>
   ${CMTK&&!usuario?'':`<a class="hb" href="/equipe/" title="Ex Officio: pautas, cartões e ficha do processo"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span>Ex Officio</span></a>`}
   <a class="hb" href="/modus/" target="_blank" rel="noopener" title="Modus Operandi: Ementário, Editorial, Diretrizes e Consulta"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Modus Operandi</span></a>
   <button type="button" class="hb" id="tema" title="Tema claro ou escuro"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Tema</span></button>
   <button type="button" class="hb" id="atu" title="Atualizar"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg><span>Atualizar</span></button>
   </div></div>`;
}
async function inicio(){
  try{
    const L=await api('');LISTA={lotes:L.lotes||[],calendario:L.calendario||[],gestor:!!L.gestor};
    const lotes=LISTA.lotes; if(!lotes.length){mostra(cabecalho([],'',L.usuario)+'<div id="gest"></div><p class="none">Nenhum lote cadastrado.'+(LISTA.gestor?' Use “Novo lote” para criar o primeiro.':'')+'</p>');ligaCab();if(LISTA.gestor)abrirNovo();return}
    const id=params.get('id')||lotes[0].id;
    const R=await api('?id='+encodeURIComponent(id)); LOTE=R.lote; RELATOR=!!R.relator; montar(lotes,id,L.usuario);
  }catch(e){falha(e)}
}
function ligaCab(){
  const sl=$('#sel');if(sl)sl.onchange=()=>{location.search='?id='+encodeURIComponent(sl.value)};
  $('#atu').onclick=()=>location.reload();
  $('#tema').onclick=()=>{const d=document.documentElement,n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('cmt-eq-tema',n)}catch(e){}};
  const bn=$('#b-novo');if(bn)bn.onclick=abrirNovo;const bs=$('#b-ses');if(bs)bs.onclick=abrirSessoes;
}
function gcor(it){return it.grupo&&COR[it.grupo]?COR[it.grupo]:OUT.cor}
function montar(lotes,id,usuario){
  FLN=Object.fromEntries(LOTE.colunas.map(c=>[c.id,c.rotulo])); COR=Object.fromEntries(LOTE.grupos.map(g=>[g.id,g.cor])); OUT=LOTE.grupo_outros||{rotulo:'Outros',cor:'#9aa0a8'};
  const ord=LOTE.grupos.map(g=>g.id).concat([null]);
  ITENS=LOTE.itens.slice().sort((a,b)=>ord.indexOf(a.grupo)-ord.indexOf(b.grupo)||a.sessao.localeCompare(b.sessao)||a.item-b.item);
  ITENS.forEach(it=>it.uid=it.sessao+'-'+it.item);

  const grs=LOTE.grupos.filter(g=>ITENS.some(i=>i.grupo===g.id)).map(g=>({k:g.id,r:g.rotulo,c:g.cor,n:ITENS.filter(i=>i.grupo===g.id).length}));

     <select class="cmt-sel so-equipe" id="fs"><option value="">Todas as situações</option>${sit.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
   </div></div>

    h+=`<tr class="r" data-u="${it.uid}"><td style="border-left:4px solid ${c}" class="cnj">${br(it.sessao).slice(0,5)}</td><td class="ii">${pad(it.item)}</td><td class="cnj">${it.processo.slice(0,15)}</td><td>${esc(it.exequente)}</td><td>${esc(it.executado)}</td><td>${/^ED/.test(it.recurso)?'ED':'Apel.'}</td>${cells}<td class="obs">${esc(it.observacao)}</td></tr>`;

  $('#profiles').innerHTML=ITENS.map(perfil).join('');

  document.querySelectorAll('[data-vai]').forEach(x=>x.onclick=()=>vai(x.dataset.vai));
  document.querySelectorAll('[data-min]').forEach(x=>x.onclick=()=>abreMinuta(x.dataset.min,x));
  document.querySelectorAll('[data-vz]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-vz]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));const rel=b.dataset.vz==='rel';document.body.classList.toggle('relator',rel);document.querySelectorAll('.pv').forEach(p=>p.textContent=rel?p.dataset.rel:p.dataset.eq);filtra()});
  document.body.classList.toggle('relator',RELATOR);if(!RELATOR)document.querySelectorAll('.pv').forEach(p=>p.textContent=p.dataset.eq);
  $('#q').oninput=filtra;$('#ff').onchange=filtra;$('#fs').onchange=filtra;filtra();

function dl(o){return '<dl>'+Object.entries(o).filter(([k,v])=>v).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')+'</dl>'}
function perfil(it,i){
  const c=gcor(it), e=it.equipe||{}, P=it.prontuario&&it.prontuario.cartao, t=it.triagem||{};
  const fl=it.variacoes.map(f=>`<span style="background:${f==='ORI'?'var(--er)':c}">${esc(FLN[f]||f)}</span>`).join('')||`<span style="background:${OUT.cor}">sem variações marcadas</span>`;
  const cons=`/modus/#consulta=${it.sessao}/${it.item}`;
  let b=`<div class="box"><h3>Identificação</h3>${dl({'Sessão':`${br(it.sessao)} · item ${it.item}`,'Processo':`<span class="cnj">${it.processo}</span>`,'Recurso':esc(it.recurso),'Exequente':esc(it.exequente),'Executado':esc(it.executado)})}</div>`;
  b+=`<div class="box"><h3>Enquadramento</h3>${dl({'Tipo de caso':esc(it.tipo_caso),'Resultado':esc(it.resultado),'Modelo vigente':esc(it.modelo)})}</div>`;
  b+=`<div class="box so-equipe"><h3>Equipe e situação</h3>${dl({'Minuta':esc(e.minuta),'Correção':esc(e.correcao),'Situação':esc(e.situacao),'Código triagem':esc(t['Código'])})}</div>`;
  b+=`<div class="box wide"><h3>Variações e peculiaridades</h3><div class="fl">${fl}</div>`+
     `<p class="pv" style="margin-top:8px" data-eq="${esc(it.peculiaridades)}" data-rel="${esc(it.peculiaridades_relator)}">${esc(it.peculiaridades_relator)}</p>`+
     (it.orientacao?`<p class="ori">Ponto para orientação: ${esc(it.orientacao)}</p>`:'')+(it.observacao?`<p style="color:var(--em)">${esc(it.observacao)}</p>`:'')+`</div>`;
  if((it.pecas||[]).length||it.mpf) b+=`<div class="box"><h3>Peças nos autos</h3>${dl(Object.fromEntries(it.pecas.map(p=>[p.peca,'ID '+p.id])))}${it.mpf?`<p style="margin-top:6px">${esc(it.mpf)}</p>`:''}</div>`;
  if(t['Apelante']||t['Mérito (triagem)']||t['Preliminares']||t['Obs. da triagem'])
    b+=`<div class="box so-equipe"><h3>Triagem</h3>${dl({'Apelante':esc(t['Apelante']),'Preliminares':esc(t['Preliminares']),'Mérito':esc(t['Mérito (triagem)']),'Observação':esc(t['Obs. da triagem'])})}</div>`;
  if(P){b+=`<div class="box wide"><h3>Prontuário · Ex Officio</h3>${P.sintese?`<p><b>Síntese.</b> ${esc(P.sintese)}</p>`:''}${P.especificidades?`<p><b>Especificidades.</b> ${esc(P.especificidades)}</p>`:''}${P.questoes?`<p><b>Questões.</b> ${esc(P.questoes)}</p>`:''}${P.obsGeral?`<p><b>Observação.</b> ${esc(P.obsGeral)}</p>`:''}`+
    (P.pecas&&P.pecas.length?`<table><tr><th>Peça</th><th>ID</th><th>Data</th></tr>${P.pecas.map(p=>`<tr><td>${esc(p.desc)}</td><td class="cnj">${esc(p.id)}</td><td>${esc(br(p.data))}</td></tr>`).join('')}</table>`:'')+
    (P.pendencias&&P.pendencias.length?`<div class="so-equipe"><p style="margin-top:8px"><b>Pendências do prontuário</b></p><ul>${P.pendencias.map(p=>`<li>${esc(p.desc)}</li>`).join('')}</ul></div>`:'')+
    `<p class="cmt-n" style="margin-top:6px">Editado por ${esc(it.prontuario.editadoPor)} em ${esc(br(it.prontuario.editadoEm))}</p></div>`}
  if((it.ajustes||[]).length>1){const hd=it.ajustes[0];b+=`<div class="box wide so-equipe"><h3>Quadro de ajustes</h3><table><tr>${hd.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${it.ajustes.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`}
  if((it.pendencias||[]).length) b+=`<div class="box wide so-equipe"><h3>Pendências</h3><ul>${it.pendencias.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
  const pv=ITENS[i-1], nx=ITENS[i+1];
  const mn=it.minuta?`<div class="mbar" id="mb-${it.uid}"><i class="nn">MINUTA</i><button type="button" class="b pri" data-min="${it.uid}">Abrir minuta</button><span class="k" id="mo-${it.uid}"></span></div><div class="doc hidden" id="d-${it.uid}"></div>`
    :`<p class="none">Minuta não disponível no painel${e.situacao==='A minutar'?' (processo a minutar)':/Voto próprio|Sem modelo/.test(e.situacao||'')?' (voto próprio, sem acórdão-modelo)':''}.</p>`;
  return `<section class="cmt-q pf" id="p-${it.uid}" data-u="${it.uid}" style="border-top-color:${c}">
   <h2><i class="nn">ITEM ${pad(it.item)}</i><span class="cnj">${it.processo}</span><span class="tg">${esc(it.tipo_caso)}</span><span class="tg">${esc(it.resultado)}</span><span class="tg so-equipe">${esc(e.situacao||'')}</span><span class="cmt-sp"></span>
   <span class="nav"><a class="b" href="${cons}" target="_blank" rel="noopener" title="Abre o processo na Consulta do Modus Operandi">Consulta ↗</a>${pv?`<button type="button" class="b" data-vai="${pv.uid}">← ${pad(pv.item)}</button>`:''}${nx?`<button type="button" class="b" data-vai="${nx.uid}">${pad(nx.item)} →</button>`:''}<button type="button" class="b" onclick="document.getElementById('matriz').scrollIntoView({behavior:'smooth'})">Matriz ↑</button></span></h2>
   <div class="grid">${b}</div>${mn}</section>`;
}
function cls(p,sec,i){
  if(sec==='ementa'){if(i===0)return 'ehd';if(/^(I|II|III|IV)\.\s/.test(p))return 'esec';if(/^_+$/.test(p))return 'sep';if(/^(Dispositivos|Jurisprudência) relevantes? citad/.test(p))return 'rod';return 'rel'}
  if(sec==='acordao')return 'rel';
  if(/^[“"]/.test(p)||/^\[\.\.\.\]/.test(p)||/^Art\. \d/.test(p)||/^§ \d/.test(p))return 'cit';
  if(/^(AgInt|AgRg|ApCiv|ApelRemNec|REsp|RE |ARE|AI |EDcl|AC |RMS|MS )[^:]{0,180}:\s*[“"]/.test(p))return 'cit';
  return '';
}
async function abreMinuta(uid,btn){
  const it=ITENS.find(i=>i.uid===uid), d=$('#d-'+uid);
  if(MIN[uid]){d.classList.toggle('hidden');btn.textContent=d.classList.contains('hidden')?'Abrir minuta':'Fechar minuta';return}
  btn.disabled=true;btn.textContent='Carregando…';
  try{
    const m=await api('?id='+encodeURIComponent(LOTE.id)+'&minuta='+it.processo.slice(0,10)); MIN[uid]=m;
    const S=SECS.filter(([k])=>m.secoes[k]&&m.secoes[k].length);
    d.innerHTML=S.map(([k,t])=>`<h4>${t}</h4>`+m.secoes[k].map((p,i)=>`<p class="${cls(p,k,i)}">${esc(p)}</p>`).join('')).join('');
    $('#mo-'+uid).textContent=(m.origem||'')+(m.atualizado_em?' · '+br(m.atualizado_em):'');
    const mb=$('#mb-'+uid);
    mb.insertAdjacentHTML('beforeend',S.map(([k,t])=>`<button type="button" class="b" data-cp="${uid}|${k}">Copiar ${t.toLowerCase()}</button>`).join('')+`<button type="button" class="b pri" data-cp="${uid}|*">Copiar tudo</button>`);
    mb.querySelectorAll('[data-cp]').forEach(x=>x.onclick=()=>copia(x.dataset.cp));
    d.classList.remove('hidden');btn.textContent='Fechar minuta';
  }catch(e){btn.textContent='Abrir minuta';toast(e.message)}
  btn.disabled=false;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1500)}
async function clip(plain,rich){
  try{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([plain],{type:'text/plain'}),'text/html':new Blob([rich],{type:'text/html'})})]);return true}}catch(_){}
  try{if(navigator.clipboard){await navigator.clipboard.writeText(plain);return true}}catch(_){}
  try{const ta=document.createElement('textarea');ta.value=plain;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(_){return false}
}
async function copia(v){
  const [uid,k]=v.split('|'), m=MIN[uid], ks=k==='*'?SECS.filter(([x])=>m.secoes[x]&&m.secoes[x].length):SECS.filter(([x])=>x===k);
  const plain=ks.map(([x,t])=>(k==='*'?t+'\n\n':'')+m.secoes[x].join('\n\n')).join('\n\n\n');
  const rich=ks.map(([x,t])=>(k==='*'?`<p style="text-align:center;font-weight:bold">${t}</p>`:'')+m.secoes[x].map((p,i)=>{const c=cls(p,x,i);const st=c==='cit'?'margin-left:4cm;text-align:justify':(c==='ehd'||c==='esec')?'font-weight:bold;text-align:justify':(c==='rel'||c==='sep'||c==='rod')?'text-align:justify':'text-align:justify;text-indent:2.5cm';return `<p style="${st}">${esc(p)}</p>`}).join('')).join('');
  const ok=await clip(plain,`<div style="font-family:'Times New Roman';font-size:12pt">${rich}</div>`);
  toast(ok?(k==='*'?'Minuta copiada':ks[0][1].charAt(0)+ks[0][1].slice(1).toLowerCase()+' copiado'):'Não foi possível copiar: selecione o texto e use Ctrl+C');
}
function vai(uid){const e=document.getElementById('p-'+uid);if(!e)return;e.classList.remove('hidden');e.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.pf.hl').forEach(x=>x.classList.remove('hl'));e.classList.add('hl');try{history.replaceState(null,'',location.pathname+location.search+'#p='+encodeURIComponent(uid))}catch(_){}}
function filtra(){
  const q=$('#q').value.toLowerCase().trim(), f=$('#ff').value, st=$('#fs').value, vis=new Set(), rel=document.body.classList.contains('relator');
  for(const it of ITENS){const e=it.equipe||{};
    const hay=[it.processo,it.item,it.partes,it.peculiaridades,it.peculiaridades_relator,it.observacao,it.tipo_caso,e.minuta,e.correcao,it.variacoes.map(x=>FLN[x]).join(' ')].join(' ').toLowerCase();
    if((!rel||it.pronto)&&!offG.has(it.grupo||'')&&(!q||hay.includes(q))&&(!f||it.variacoes.includes(f))&&(!st||e.situacao===st))vis.add(it.uid)}
  document.querySelectorAll('#mxb tr.r').forEach(r=>r.classList.toggle('hidden',!vis.has(r.dataset.u)));
  document.querySelectorAll('#mxb tr.gh').forEach(r=>{const g=r.dataset.gh||null,n=ITENS.filter(i=>(i.grupo||null)===g&&(!rel||i.pronto)).length;r.classList.toggle('hidden',!ITENS.some(i=>(i.grupo||null)===g&&vis.has(i.uid)));const x=r.querySelector('.ghn');if(x)x.textContent=n+' processo'+(n>1?'s':'')});
  document.querySelectorAll('.pf').forEach(p=>p.classList.toggle('hidden',!vis.has(p.dataset.u)));
  document.querySelectorAll('#met [data-g]').forEach(d=>{const g=d.dataset.g||null,n=ITENS.filter(i=>(i.grupo||null)===g&&(!rel||i.pronto)).length;d.querySelector('b').textContent=pad(n);d.classList.toggle('hidden',!n)});
  const oc=rel&&!RELATOR?ITENS.filter(i=>!i.pronto).length:0, tot=rel?ITENS.length-oc:ITENS.length;
  $('#cnt').textContent=`${pad(vis.size)} de ${pad(tot)} processos`+(oc?` · ${oc} por fazer ou corrigir, fora da visão do Relator`:'');
}

const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);

function abrirSessoes(){
  if(!LOTE)return;
  const f=LOTE.filtro||{}, fd=[f.assunto&&('assunto contém “'+f.assunto+'”'),f.classe&&('classe contém “'+f.classe+'”'),f.texto&&('texto “'+f.texto+'”')].filter(Boolean).join(' · ')||'todos os processos da sessão';
  $('#gest').innerHTML=`<section class="cmt-q" id="g-ses"><h2><i class="nn">00</i><span>Sessões do <em>lote.</em></span><span class="cmt-n">${esc(LOTE.titulo)} · filtro: ${esc(fd)}</span><span class="cmt-sp"></span><button type="button" class="b" id="gs-x">Fechar</button></h2>
   <p class="none" style="font-style:normal">Ao associar uma sessão, entram os processos dela que passam no filtro do lote. Ao desassociar, saem os processos daquela sessão. Os demais ficam como estão, com os dados já registrados.</p>
   ${listaSessoes(LOTE.sessoes||[],'gs-s')}
   <div class="acts"><button type="button" class="b pri" id="gs-ok">Salvar sessões</button><span class="k" id="gs-m"></span></div></section>`;
  $('#gs-x').onclick=fechaGest;
  $('#gs-ok').onclick=async()=>{const ss=marcadas('gs-s');$('#gs-ok').disabled=true;$('#gs-m').textContent='Atualizando o lote…';
    try{const r=await post({acao:'sessoes',id:LOTE.id,sessoes:ss});toast(`Lote atualizado: +${r.entram} −${r.saem}`);setTimeout(()=>location.reload(),700)}
    catch(e){$('#gs-m').textContent=e.message;$('#gs-ok').disabled=false}};
  $('#g-ses').scrollIntoView({behavior:'smooth'});
}
inicio();
})();
</script>
</body>
</html>
