 <div id="app" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECS=[['relatorio','RELATÓRIO'],['voto','VOTO'],['ementa','EMENTA'],['acordao','ACÓRDÃO']];
const br=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
const pad=n=>String(n).padStart(2,'0');
let RELATOR=false, VIS=new Set(), PEND=new Map(), TPEND=0, LOTE=null, ITENS=[], FLN={}, COR={}, OUT=null, MIN={}, offG=new Set(), LISTA={lotes:[],sessoes:[],calendario:[],gestor:false}, SELEC=new Set();
const params=new URLSearchParams(location.search);
const FILT_SESSAO=String(params.get('sessao')||'').trim(), FILT_MINUTISTA=String(params.get('minutista')||'').trim();
/* Amicus Curiae · Collectio: três visões no mesmo arquivo. O nome visual permanece Collectio; rotas canônicas: /amicus/collectio/ (Geral), /amicus/collectio/cmt/ (Desembargador) e /amicus/collectio/cg/ (controle geral). /amicus/collectio/* e as rotas antigas de lotes permanecem apenas como compatibilidade. */
const PATH=location.pathname.toLowerCase();
const MODO=(/^\/amicus\/collectio\/cmt(?:\/|$)/.test(PATH)||/^\/lote\/cmt?(?:\/|$)/.test(PATH)||/^\/index\/cm(?:t)?(?:\/|$)/.test(PATH)||/^\/cmt\/lotes(?:\/|$)/.test(PATH))?'rel':((/^\/amicus\/collectio\/(?:gc|cg)(?:\/|$)/.test(PATH)||/^\/lote\/(?:cg|gc)(?:\/|$)/.test(PATH)||/^\/index\/(?:cg|gc)(?:\/|$)/.test(PATH)||/^\/(?:cg|gc)\/lotes(?:\/|$)/.test(PATH))?'cg':'eq'), MODO_REL=MODO==='rel';
let VZ=MODO==='cg'?'tudo':MODO;
/* linha de abertura do carregamento, no lugar da saudação do Painel do Desembargador */
(function(){const e=document.getElementById('ld-s');if(e)e.textContent=MODO==='rel'?'Collectio · CMT.':MODO==='cg'?'Collectio · CG.':'Collectio · Geral.'})();
/* O endereço escolhe a visão; a API exige sessão válida ou chave do relator (CMT_CHAVE). */
const CMTK=(function(){try{const m=/[?&#]k=([^&#]+)/.exec(location.search+location.hash);if(m){const v=decodeURIComponent(m[1]);sessionStorage.setItem('cmt_k',v);const q=new URLSearchParams(location.search);q.delete('k');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash.replace(/[#&]?k=[^&#]+/,''))}return sessionStorage.getItem('cmt_k')||''}catch(e){return ''}})();
async function api(q){const h={};if(CMTK)h['x-cmt-chave']=CMTK;const r=await fetch('/api/painel?lote=1'+(MODO_REL?'&rel=1':MODO==='cg'?'&modo=cg':'')+(q?'&'+q.replace(/^\?/,''):''),{credentials:'same-origin',headers:h});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.erro||('HTTP '+r.status));e.status=r.status;throw e}return j}
async function post(b){const r=await fetch('/api/painel?lote=1',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.erro||('HTTP '+r.status));e.status=r.status;throw e}return j}
function mostra(html){$('#ld').hidden=true;const a=$('#app');a.hidden=false;a.innerHTML=html}
function falha(e){
  if(e.status===403&&MODO==='cg'){$('#ld-m').innerHTML='Esta página é só do controle geral.<br><a class="b pri" style="margin-top:14px" href="/amicus/collectio/">Ir para o Collectio geral</a>';$('#ld .cmt-ld-b').hidden=true;return}
  if(e.status===401){$('#ld-m').innerHTML=MODO_REL?'Abra esta página pelo link do painel do Desembargador.':'O Amicus Curiae · Collectio usa o login do Ex Officio.<br><a class="b pri" style="margin-top:14px" href="/exofficio/">Entrar pelo Ex Officio</a>';$('#ld .cmt-ld-b').hidden=true;return}
  $('#ld-m').textContent='Não foi possível abrir: '+e.message;$('#ld .cmt-ld-b').hidden=true;
}
const ROTULO={cg:'CG',eq:'Geral',rel:'CMT'};

/* As coleções são três áreas: Pauta, Avulsas e Triagem. Sessões são fontes, não coleções.
   Triagem: lotes montados a partir das tarefas do PJe (tipo 'triagem'), agrupados pela tarefa. */
function seletorColecoes(lotes,id) {
  const tipo=LOTE?(LOTE.tipo==='pauta'?'pauta':LOTE.tipo==='triagem'?'triagem':'avulsa'):'avulsa';
  const ses=LOTE&&LOTE.sessoes&&LOTE.sessoes[0]||LISTA.sessoes[0]?.date||'';
  const sess=LISTA.sessoes||[],avulsos=lotes.filter(l=>l.tipo!=='pauta'&&l.tipo!=='triagem'),tri=lotes.filter(l=>l.tipo==='triagem');
  const daSessao=lotes.filter(l=>l.tipo==='pauta'&&(l.sessao||(l.sessoes||[])[0])===ses);
  const opt=l=>'<option value="'+esc(l.id)+'"'+(l.id===id?' selected':'')+'>'+esc(l.titulo)+' · '+l.total+'</option>';
  const tarefas=[...new Set(tri.map(l=>l.tarefa||'Triagem'))];
  const optTri=tarefas.map(t=>'<optgroup label="'+esc(t)+'">'+tri.filter(l=>(l.tarefa||'Triagem')===t).map(opt).join('')+'</optgroup>').join('');
  const bt=(k,r)=>'<button type="button" data-colecao="'+k+'" aria-pressed="'+(tipo===k)+'">'+r+'</button>';
  return '<div class="col-areas" aria-label="Coleções do Collectio"><div class="col-tipos">'+
    bt('pauta','Coleção de Pauta')+bt('triagem','Coleção de Triagem')+bt('avulsa','Coleções Avulsas')+'</div>'+
    '<div class="col-area" id="col-pauta"'+(tipo==='pauta'?'':' hidden')+'>'+
    '<label class="lx-sel">Sessão<select id="sel-sessao">'+sess.map(x=>'<option value="'+esc(x.date)+'"'+(x.date===ses?' selected':'')+'>'+esc(x.nome||br(x.date))+' · '+x.processos+' na pauta</option>').join('')+'</select></label>'+
    '<button class="b col-matriz" type="button" id="b-matriz">Matriz geral da sessão</button>'+
    '<label class="lx-sel">Lotes criados nesta pauta<select id="sel-pauta"><option value="">Escolha um lote da sessão</option>'+daSessao.map(opt).join('')+'</select></label></div>'+
    '<div class="col-area" id="col-triagem"'+(tipo==='triagem'?'':' hidden')+'>'+
    '<label class="lx-sel">Lote de triagem<select id="sel-triagem"><option value="">Selecione um lote</option>'+optTri+'</select></label></div>'+
    '<div class="col-area" id="col-avulsas"'+(tipo==='avulsa'?'':' hidden')+'>'+
    '<label class="lx-sel">Coleção avulsa<select id="sel-avulsas">'+
    '<option value="">Selecione uma coleção</option>'+avulsos.map(opt).join('')+'</select></label></div></div>';
}
function ligarColecoes(lotes) {
  const go=id=>{if(id)location.search='?id='+encodeURIComponent(id)};
  document.querySelectorAll('[data-colecao]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.colecao;
    document.querySelector('#col-pauta').hidden=k!=='pauta';
    document.querySelector('#col-triagem').hidden=k!=='triagem';
    document.querySelector('#col-avulsas').hidden=k!=='avulsa';
    document.querySelectorAll('[data-colecao]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    if(k==='pauta'){const s=document.querySelector('#sel-sessao').value;go('pauta-'+s)}
    else if(k==='triagem'){const a=lotes.find(l=>l.tipo==='triagem');if(a)go(a.id)}
    else{const a=lotes.find(l=>l.tipo!=='pauta'&&l.tipo!=='triagem');if(a)go(a.id)}
  });
  const ses=$('#sel-sessao');if(ses)ses.onchange=()=>go('pauta-'+ses.value);
  const matriz=$('#b-matriz');if(matriz)matriz.onclick=()=>go('pauta-'+ses.value);
  const lp=$('#sel-pauta');if(lp)lp.onchange=()=>go(lp.value);
  const lt=$('#sel-triagem');if(lt)lt.onchange=()=>go(lt.value);
  const la=$('#sel-avulsas');if(la)la.onchange=()=>go(la.value);
}

   <div class="lx-bc"><span class="lx-nxey">CMT · Amicus Curiae</span><div class="lx-cad"><b>Collectio<em>.</em></b><span class="lx-sl" aria-hidden="true">/</span><span class="lx-cr">${ROTULO[MODO]}</span></div></div>

   ${MODO_REL?'':`<a class="hb" href="/amicus/collectio/cmt/?id=${encodeURIComponent(id)}" target="_blank" rel="noopener" title="Abre o Collectio · CMT"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Collectio · CMT</span></a>`}
   ${MODO_REL||(CMTK&&!usuario)?'':`<a class="hb" href="/exofficio/" title="Ex Officio: pautas, cartões e ficha do processo"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span>Ex Officio</span></a>`}
   ${MODO_REL?'':'<a class="hb" href="/amicus/compendium/" target="_blank" rel="noopener" title="Modus Operandi: Ementário, Editorial, Diretrizes e Consulta"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Compendium</span></a>'}

   <button type="button" class="hb" id="atu" title="Atualizar"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg><span>Atualizar</span></button>

async function inicio(){
  try{
    const L=await api('');LISTA={lotes:L.lotes||[],sessoes:L.sessoes||[],calendario:L.calendario||[],gestor:!!L.gestor};
    const lotes=LISTA.lotes; if(!lotes.length&&!LISTA.sessoes.length){mostra(cabecalho([],'',L.usuario)+'<div id="gest"></div><p class="none">Nenhuma sessão ou coleção disponível.'+(MODO==='cg'?' Use “Novo lote avulso” para criar o primeiro.':'')+'</p>');ligaCab();if(MODO==='cg')abrirNovo();return}
    const pedido=params.get('id')||'';
    const id=(lotes.some(l=>l.id===pedido)||LISTA.sessoes.some(x=>'pauta-'+x.date===pedido))?pedido:
      (LISTA.sessoes.length?'pauta-'+LISTA.sessoes[0].date:lotes[0].id);
    const R=await api('?id='+encodeURIComponent(id));
    /* só com a chave do relator (sem login), /lotes/ leva à página dele */
    if(MODO==='eq'&&R.relator){location.replace('/amicus/collectio/cmt/?id='+encodeURIComponent(id)+location.hash);return}
    LOTE=R.lote; RELATOR=!!R.relator; montar(lotes,id,L.usuario);
  }catch(e){falha(e)}
}
function ligaCab(){
  ligarColecoes(LISTA.lotes);

      $('#gn-prev').innerHTML=r.amostra.length?`<table class="cmt-tb" style="min-width:0;margin-top:10px"><tr><th>Sessão</th><th>Item</th><th>Processo</th><th>Assunto</th></tr>${r.amostra.map(a=>`<tr><td class="cnj">${br(a.sessao).slice(0,5)}</td><td class="ii">${pad(a.item)}</td><td class="cnj">${esc(a.processo)}</td><td>${esc(a.assunto)}</td></tr>`).join('')}</table>`:''}
    catch(e){$('#gn-m').textContent=e.message}};
  $('#gn-ok').onclick=async()=>{const ss=marcadas('gn-s'),id=slug($('#gn-id').value||$('#gn-t').value);
    if(!$('#gn-t').value.trim()){toast('Dê um título ao lote');return} if(!ss.length){toast('Escolha ao menos uma sessão');return}
    $('#gn-ok').disabled=true;$('#gn-m').textContent='Criando o lote…';
    try{const r=await post({acao:'criar',tipo:'avulso',id,titulo:$('#gn-t').value.trim(),descricao:$('#gn-d').value.trim(),sessoes:ss,filtro:filtro()});
      toast('Lote criado com '+r.total+' processos');location.search='?id='+encodeURIComponent(r.id)}
    catch(e){$('#gn-m').textContent=e.message;$('#gn-ok').disabled=false}};
  $('#g-novo').scrollIntoView({behavior:'smooth'});
}
function abrirSessoes(){
  if(!LOTE)return;
  const f=LOTE.filtro||{}, fd=[f.assunto&&('assunto contém “'+f.assunto+'”'),f.classe&&('classe contém “'+f.classe+'”'),f.texto&&('texto “'+f.texto+'”')].filter(Boolean).join(' · ')||'todos os processos da sessão';
  $('#gest').innerHTML=`<section class="cmt-q" id="g-ses"><h2><i class="nn">00</i><span>Sessões do <em>lote.</em></span><span class="cmt-n">${esc(LOTE.titulo)} · filtro: ${esc(fd)}</span><span class="cmt-sp"></span><button type="button" class="b" id="gs-x">Fechar</button></h2>
   <p class="none" style="font-style:normal">Ao associar uma sessão, entram os processos dela que passam no filtro do lote. Ao desassociar, saem os processos daquela sessão, mas ficam guardados: se a sessão for associada de novo, eles voltam com tudo o que já estava registrado. Os demais ficam como estão.</p>
   ${listaSessoes(LOTE.sessoes||[],'gs-s')}
   <div class="acts"><button type="button" class="b pri" id="gs-ok">Salvar sessões</button><span class="k" id="gs-m"></span></div></section>`;
  $('#gs-x').onclick=fechaGest;
  $('#gs-ok').onclick=async()=>{const ss=marcadas('gs-s');$('#gs-ok').disabled=true;$('#gs-m').textContent='Atualizando o lote…';
    try{const r=await post({acao:'sessoes',id:LOTE.id,sessoes:ss});toast(`Lote atualizado: +${r.entram} −${r.saem}`+(r.voltam?` (${r.voltam} com os dados de antes)`:''));setTimeout(()=>location.reload(),700)}
    catch(e){$('#gs-m').textContent=e.message;$('#gs-ok').disabled=false}};
  $('#g-ses').scrollIntoView({behavior:'smooth'});
}
inicio();
})();
</script>
