<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMT Compêndio</title>
<meta name="description" content="CMT Compêndio do Gabinete CMT: enunciados (temas e súmulas), repertório jurisprudencial, normativo e regimental, ementário de precedentes, modelos e parágrafos-padrão, e editorial de redação com as diretrizes de conformidade.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#24272b;--panel:#2c3036;--card:#31363c;--field:#383d44;--ink:#e8e6e1;--mut:#a5abb3;--line:#41474f;--gold:#d4ab58;--gold-ink:#1d1f22;--gold-soft:rgba(212,171,88,.14);--good:#7fb08f;--bad:#c78c79;--warn:#e0a64f;--warn-soft:rgba(224,166,79,.16);--crit:#e07a64;--crit-soft:rgba(224,122,100,.16);--stf:#c9a35a;--stj:#7fa3c9;--trf:#8fb59a;--focus:#d4ab58}
:root[data-theme="light"]{--bg:#eceff2;--panel:#ffffff;--card:#ffffff;--field:#f3f5f7;--ink:#22313c;--mut:#5f6f7c;--line:#d9e0e6;--gold:#8c6d38;--gold-ink:#ffffff;--gold-soft:rgba(140,109,56,.12);--good:#3b7150;--bad:#93504b;--warn:#956019;--warn-soft:#fff2db;--crit:#a2402f;--crit-soft:#fbe4de;--stf:#8c6d38;--stj:#265f85;--trf:#3b7150;--focus:#8c6d38}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand small{font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.brand b{font-size:19px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--mut)}
.tab[aria-selected="true"]{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.live{background:var(--good)}.dot.snap{background:var(--warn)}
.pill2{display:inline-flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden}
.pill2>*{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;font-size:12px;font-weight:700;background:transparent;border:0;color:var(--gold);text-decoration:none;cursor:pointer;white-space:nowrap}
.pill2>*+*{border-left:1px solid var(--gold)}
.pill2>*:hover{background:var(--gold-soft)}
.pill2 svg,.ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--mut);padding:0}
.ico:hover{color:var(--gold);border-color:var(--gold)}
.ico .i-moon{display:none}
:root[data-theme="light"] .ico .i-sun{display:none}
:root[data-theme="light"] .ico .i-moon{display:block}
.glist .rh{font-weight:800;font-size:12.5px;letter-spacing:.02em;margin-top:6px;color:var(--ink)}
.glist .rh i{border-radius:50%}
.glist .sa{padding-left:22px;font-size:12.5px}
.ramo-t{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:30px 0 -8px;display:flex;align-items:center;gap:10px}
.ramo-t::after{content:"";flex:1;height:1px;background:var(--line)}
.ramo-t:first-child{margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.sub{display:flex;gap:4px;flex-wrap:wrap;padding:14px 20px 0}
.sub button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--mut)}
.sub button[aria-selected="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 64px)}
aside{border-right:1px solid var(--line);padding:16px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto}
.lab{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:16px 0 8px}
.lab:first-child{margin-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;cursor:pointer;font-weight:700;font-size:12px;color:var(--mut);min-width:56px}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin:8px 0;cursor:pointer}
.glist{display:flex;flex-direction:column;gap:2px}
.glist button{display:flex;align-items:flex-start;gap:8px;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink)}
.glist button:hover{background:var(--card)}
.glist button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold);font-weight:700}
.glist button.zero{opacity:.45}
.glist i{width:9px;height:9px;border-radius:2px;flex:none;margin-top:5px}
.glist span{flex:1}
.glist small{color:var(--mut);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mut);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;margin-top:18px}
.content{padding:16px 22px 60px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q{flex:1 1 260px;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.count{font-size:13px;color:var(--mut)}
.count b{color:var(--ink)}
.grp{margin-top:22px}
.grp>h2{font-size:17px;color:var(--gold);margin:0 0 10px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.grp>h2 small{font-size:12px;color:var(--mut);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gc,var(--gold));border-radius:10px;padding:14px 16px;min-width:0}
.card.s-nac{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit) inset}
.card.s-resp{border-color:var(--warn)}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:4px;color:var(--gold-ink);background:var(--stf)}
.tb.STJ{background:var(--stj)}.tb.TRF3,.tb.TRF4,.tb.TFR{background:var(--trf)}
.num{font-weight:800;font-size:15px}
.pill{font-size:10.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut)}
.card h3{font-size:14.5px;line-height:1.35;margin:8px 0}
.flag{border-radius:7px;padding:8px 10px;margin:8px 0;font-size:12.5px}
.flag b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.flag.nac{background:var(--crit-soft);color:var(--crit)}
.flag.resp{background:var(--warn-soft);color:var(--warn)}
.flag.sem{background:var(--field);color:var(--mut)}
.k{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 3px}
.k.of{color:var(--good)}.k.rs{color:var(--warn)}
.tx{white-space:pre-line;overflow-wrap:anywhere;margin:0}
.box{background:var(--field);border-radius:7px;padding:8px 10px;margin-top:8px;font-size:12.5px;color:var(--mut);white-space:pre-line;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--mut);margin-top:4px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--gold)}
.ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ft .sp{flex:1}
.usos{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:transparent;cursor:pointer}
.usos.has{color:var(--gold);border-color:var(--gold)}
.ulist{margin:8px 0 0;padding:0;list-style:none;font-size:12px}
.ulist li{padding:4px 0;border-bottom:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.field{background:var(--field);border-radius:7px;padding:8px 10px;border-left:2px solid var(--line)}
.field.good{border-left-color:var(--good)}.field.bad{border-left-color:var(--bad)}
.field b{display:block;font-size:10px;color:var(--gold);letter-spacing:.05em;margin-bottom:2px}
.field p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
code{font-size:12px;background:var(--field);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.matriz{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:12px 16px;margin-bottom:12px}
.matriz h3{margin:0 0 6px;font-size:14px;color:var(--gold)}
.matriz ol{margin:4px 0 10px 18px;padding:0}
.reg h2.h0{font-size:18px;color:var(--gold);margin:26px 0 6px}
.reg h3.h1{font-size:16px;margin:18px 0 4px}
.reg h4{font-size:14px;margin:14px 0 4px;color:var(--mut)}
.reg .hn{font-size:11.5px;color:var(--mut);margin:0 0 6px}
.art{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:8px 0}
.art.rev{opacity:.55}
.art .tag{font-size:10px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin-left:6px}
.tree button{font-size:12.5px}
.tree .l1{padding-left:18px;font-size:12px;color:var(--mut)}
.strip{border:1px solid var(--crit);background:var(--crit-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.strip b{color:var(--crit)}
.strip a{cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media (max-width:860px){.top{position:static}.layout{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.top{padding:10px 16px}.content{padding:14px 16px 50px}.grid{grid-template-columns:1fr}.right{margin-left:0;width:100%}}
@media print{.top,aside,.ft{display:none}.layout{display:block}body{background:#fff;color:#000}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><small>TRF3 · Gabinete CMT</small><b>CMT Compêndio · Referenciais</b></div>
  <nav class="tabs" role="tablist" aria-label="Seções">
    <button class="tab" role="tab" data-v="temas" aria-selected="true">Enunciados</button>
    <button class="tab" role="tab" data-v="rep" aria-selected="false">Repertório</button>
    <button class="tab" role="tab" data-v="ement" aria-selected="false">Ementário</button>
    <button class="tab" role="tab" data-v="edit" aria-selected="false">Editorial</button>
    <button class="tab" role="tab" data-v="consulta" aria-selected="false">Consulta</button>
  </nav>
  <div class="right">
    <span class="status" id="status"><i class="dot"></i><span>Carregando…</span></span>
    <button class="ico" id="theme" type="button" aria-label="Alternar tema claro ou escuro" title="Tema claro ou escuro"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
</header>

<section id="v-temas">
  <div class="n-wrap nodet" id="n-wrap">
    <aside class="n-f" id="n-aside"></aside>
    <div class="n-main"><div class="n-bar"><div class="n-sum" id="n-sum"></div><div class="seg n-seg" id="n-modos" role="group" aria-label="Modo de exibição"></div></div><div id="n-out"></div></div>
    <section class="n-det" id="n-det" aria-label="Enunciado"></section>
  </div>
</section>

<section id="v-rep" hidden>
  <div class="sub" role="tablist">
    <button data-s="juris" aria-selected="true">Repertório jurisprudencial</button>
    <button data-s="normas" aria-selected="false">Repertório normativo</button>
    <button data-s="reg" aria-selected="false">Regimento Interno</button>
  </div>
  <div class="n-wrap nodet" id="r-wrap">
    <aside class="n-f" id="r-aside"></aside>
    <div class="n-main"><div class="n-bar"><div class="n-sum" id="r-sum"></div><div class="seg n-seg" id="r-modos" role="group" aria-label="Modo de exibição"></div></div><div id="r-out"></div></div>
    <section class="n-det" id="r-det" aria-label="Detalhe"></section>
  </div>
</section>

<section id="v-ement" hidden>
  <div class="sub" role="tablist" id="e-sub">
    <button data-s="prec" aria-selected="true">Precedentes</button>
    <button data-s="mod" aria-selected="false">Modelos-matriz</button>
    <button data-s="par" aria-selected="false">Parágrafos-padrão</button>
  </div>
  <div class="layout">
    <aside id="e-aside"></aside>
    <div class="content">
      <div class="bar"><input class="q" id="e-q" type="search" placeholder="Buscar por número, classe, ementa ou dispositivo…" aria-label="Buscar no ementário"><span class="count" id="e-cnt"></span></div>
      <div class="e-modes" id="e-modes"></div>
      <div id="e-chips"></div>
      <div id="e-sel"></div>
      <div id="e-out"><p class="empty">Carregando o índice de precedentes…</p></div>
    </div>
  </div>
</section>

<section id="v-consulta" hidden><div class="cq-wrap"><h2 class="cq-h">Consulta do caso pautado</h2><p class="meta">Escolha a sessão e o item: o Compêndio lê o cartão do processo e reúne o material aplicável.</p><div id="cq"></div></div></section>

<section id="v-edit" hidden>
  <div class="sub" role="tablist" id="x-sub">
    <button data-s="pecas" aria-selected="true">Peças</button>
    <button data-s="dir" aria-selected="false">Diretrizes</button>
  </div>
  <div class="xman" id="x-man" hidden></div>
  <div class="xa" id="x-wrap">
    <aside class="xside" id="x-aside" aria-label="Peças e orientações"></aside>
    <div id="x-main"></div>
    <aside class="xrefp" id="x-ref" aria-label="Consulta"></aside>
  </div>
</section>

<div class="e-dr" id="e-dr" hidden><div class="e-drb" id="e-drb" role="dialog" aria-modal="true" aria-label="Detalhe"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="usos-auto">/*__USOS__*/</script>
<script type="application/json" id="snapshot">/*__DATA__*/</script>
<script type="application/json" id="editorial">/*__EDITORIAL__*/</script>
<script type="application/octet-stream" id="modelos-gz">/*__MODELOS__*/</script>
<script>
(function(){
'use strict';
var DB=null;
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function fmtN(n){var x=String(n||'').replace(/\D/g,'');return x?x.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):String(n||'');}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},1600);}
function copy(txt){
  function fb(){var a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Citação copiada');}catch(e){toast('Não foi possível copiar');}a.remove();}
  try{navigator.clipboard.writeText(txt).then(function(){toast('Citação copiada');},fb);}catch(e){fb();}
}
try{var th=localStorage.getItem('vdm-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
$('#theme').addEventListener('click',function(){var r=document.documentElement;var nv=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',nv);try{localStorage.setItem('vdm-theme',nv);}catch(e){}});

/* ---------- dados: apoio/vade-mecum.json do procs-muta, embutido na página (a planilha do Google deixou de ser fonte) ---------- */
function setStatus(kind,msg){var s=$('#status');s.querySelector('.dot').className='dot '+kind;s.querySelector('span').textContent=msg;s.title='Base do procs-muta (apoio/vade-mecum.json)';}
function boot(){
  DB=JSON.parse(document.getElementById('snapshot').textContent);
  setStatus('live','Base do procs-muta');
  try{localStorage.removeItem('vdm-cache');}catch(e){}
  prep();renderAll();
}

/* ---------- preparo ---------- */
var AS=[],ASN={},USOS={};
/* Usos localizados automaticamente nos precedentes (procs-muta, scripts/repertorio/vincular.py) */
var USOS_AUTO=(function(){try{return JSON.parse(document.getElementById('usos-auto').textContent);}catch(e){return [];}})();
/* dispositivos do repertório normativo acrescentados no procs-muta (apoio/repertorio-normativo-complemento.json) */
var NORMAS_COMP=null;
function normasComp(){if(NORMAS_COMP)return NORMAS_COMP;try{NORMAS_COMP=JSON.parse(document.getElementById('editorial').textContent).normasComplemento||[];}catch(e){NORMAS_COMP=[];}return NORMAS_COMP;}
function prep(){
  var NL=DB['Normas']=(DB['Normas']||[]).slice(),tem={};NL.forEach(function(n){tem[n['Código']]=1;});normasComp().forEach(function(n){if(!tem[n['Código']])NL.push(n);});
  AS=(DB['Assuntos']||[]).slice().sort(function(a,b){return (+a['Ordem']||99)-(+b['Ordem']||99);});
  ASN={};AS.forEach(function(a){ASN[a['Assunto']]=a;});
  USOS={};(DB['Usos no gabinete']||[]).forEach(function(u){var k=(u['Código do item']||'').trim();if(!k)return;(USOS[k]=USOS[k]||[]).push(u);});
  USOS_AUTO.forEach(function(u){var k=u['Código do item'];var L=(USOS[k]=USOS[k]||[]);if(!L.some(function(x){return (x['Processo']||'').trim()===u['Processo']&&(!x['Data']||x['Data']===u['Data']);}))L.push(u);});
}
function asList(s){return String(s||'').split(';').map(function(x){return x.trim();}).filter(Boolean);}
function ramoOf(a){return (ASN[a]&&ASN[a]['Ramo'])||'Outros';}
function ramos(){var r=[];AS.forEach(function(a){var k=a['Ramo']||'Outros';if(r.indexOf(k)<0)r.push(k);});if(r.indexOf('Outros')<0)r.push('Outros');return r;}
function matchA(s,st){var L=asList(s);if(st.g)return L.indexOf(st.g)>=0||(st.g==='(sem assunto)'&&!L.length);if(st.ramo)return L.some(function(a){return ramoOf(a)===st.ramo;})||(st.ramo==='Outros'&&!L.length);return true;}
/* Árvore lateral: ramo do direito e, dentro dele, os assuntos */
function ramoTree(items,getA,st,showZero){
  var cnt={},rc={};
  items.forEach(function(x){var L=asList(getA(x));if(!L.length)L=['(sem assunto)'];var rs={};L.forEach(function(a){cnt[a]=(cnt[a]||0)+1;rs[ramoOf(a)]=1;});Object.keys(rs).forEach(function(r){rc[r]=(rc[r]||0)+1;});});
  var h='<button data-r="" data-g="" aria-pressed="'+(!st.g&&!st.ramo)+'"><i style="background:var(--ink)"></i><span>Todos os assuntos</span><small>'+items.length+'</small></button>';
  ramos().forEach(function(r){
    var as=AS.filter(function(a){return (a['Ramo']||'Outros')===r;}).map(function(a){return a['Assunto'];});
    if(r==='Outros')Object.keys(cnt).forEach(function(k){if(!ASN[k]&&as.indexOf(k)<0)as.push(k);});
    if(!rc[r]&&!showZero)return; if(!as.length)return;
    h+='<button class="rh'+(rc[r]?'':' zero')+'" data-r="'+esc(r)+'" data-g="" aria-pressed="'+(st.ramo===r&&!st.g)+'"><i style="background:var(--gold)"></i><span>'+esc(r)+'</span><small>'+(rc[r]||0)+'</small></button>';
    as.forEach(function(k){if(!cnt[k]&&!showZero)return;h+='<button class="sa'+(cnt[k]?'':' zero')+'" data-r="" data-g="'+esc(k)+'" aria-pressed="'+(st.g===k)+'"><i style="background:'+esc(ASN[k]?ASN[k]['Cor']:'var(--mut)')+'"></i><span>'+esc(k)+'</span><small>'+(cnt[k]||0)+'</small></button>';});
  });
  return h;
}
function bindTree(box,st,fn){box.querySelectorAll('button').forEach(function(b){b.onclick=function(){st.ramo=b.getAttribute('data-r')||'';st.g=b.getAttribute('data-g')||'';fn();};});}
function color(a){return (ASN[a]&&ASN[a]['Cor'])||'var(--gold)';}
function usosBtn(code){
  var L=USOS[code]||[];var ac=L.filter(function(u){return /ac[oó]rd/i.test(u['Tipo de decisão']);}).length;var mo=L.length-ac;
  var h='<button class="usos'+(L.length?' has':'')+'" data-usos="'+esc(code)+'" title="Acórdãos e decisões monocráticas em que o item foi citado">Acórdãos '+ac+' · Monocráticas '+mo+'</button>';
  return h;
}
function usosList(code){
  var L=USOS[code]||[];
  if(!L.length) return '<p class="meta">Nenhum uso registrado. Registre na aba “Usos no gabinete” com o código <code>'+esc(code)+'</code>.</p>';
  var mais=L.length>40?'<p class="meta">Mostrando 40 de '+L.length+' registros.</p>':'';L=L.slice(0,40);
  return mais+'<ul class="ulist">'+L.map(function(u){var p=esc(u['Processo']);return '<li><b>'+esc(u['Tipo de decisão'])+'</b> · '+(u['Link']?'<a href="'+esc(u['Link'])+'" target="_blank" rel="noopener">'+p+'</a>':p)+(u['Data']?' · '+esc(u['Data']):'')+(u['Órgão julgador']?' · '+esc(u['Órgão julgador']):'')+(u['Observação']?'<br><span class="meta">'+esc(u['Observação'])+'</span>':'')+'</li>';}).join('')+'</ul>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-usos]');
  if(b){var card=b.closest('.card,.art');var box=card.querySelector('.uwrap');if(box){box.remove();return;}var d=document.createElement('div');d.className='uwrap';d.innerHTML=usosList(b.getAttribute('data-usos'));card.appendChild(d);return;}
  var c=e.target.closest('[data-copy]');
  if(c){copy(c.getAttribute('data-copy'));}
});

/* ---------- navegação ---------- */
var VIEW='temas';
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){VIEW=b.getAttribute('data-v');document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',String(x===b));});['temas','rep','ement','edit','consulta','enc'].forEach(function(v){var sv=$('#v-'+v);if(sv)sv.hidden=v!==VIEW;});if(window.VDM_view)window.VDM_view(VIEW);window.scrollTo(0,0);});});
function renderAll(){if(window.VDM_enun)window.VDM_enun();if(window.VDM_rep)window.VDM_rep();if(window.VDM_refresh)window.VDM_refresh();}

/* Enunciados: código em ementario.js (lista, tabela, mapa e painel) */
function suspKind(t){var s=norm(t['Suspensão de processos']);if(!s)return '';if(s.indexOf('nacional')>=0)return 'nac';if(s.indexOf('so ')===0||s.indexOf('recursos')>=0)return 'resp';if(s.indexOf('sem')===0)return 'sem';return '';}
window.VDM_usos=function(){return USOS;};
window.VDM_assuntos=function(){return {AS:AS,ASN:ASN,ramos:ramos()};};

/* Repertório: código em ementario.js */
window.VDM_DB=function(){return DB;};
boot();
})();
</script>
